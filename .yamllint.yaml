---

extends: default

ignore: |
  **/charts
  Secret.*.yaml
  *.enc.yaml
  values.default.yaml
  values.*.default.yaml
  k8s/infrastructure/auth/authelia/assets/configuration.yaml

rules:
  line-length: disable
  comments-indentation: disable
  colons:
    max-spaces-before: 0
    max-spaces-after: -1   # -1 = unlimited, disables the after-colon check
  commas:
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: -1   # -1 = unlimited, disables the after-comma check
