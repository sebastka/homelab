# https://postfinance.github.io/topf/main/configuration/
# https://postfinance.github.io/topf/main/configuration-model/
# https://docs.siderolabs.com/talos/v1.14/reference/configuration/v1alpha1/config
#
# Patches live next to this file and are merged in this order:
#   all/ -> control-plane/ -> node/<host>/ , lexicographically within each folder.
---
clusterName: talmox
clusterEndpoint: https://192.168.1.200:6443
# Minor upgrades go through `talosctl upgrade-k8s`, which validates skew and rolls the
# components in order; this field is updated afterwards so `topf apply` does not revert it.
kubernetesVersion: 1.37.1
talosVersion: 1.14.4

# topf derives the installer image from the fields below:
#   <factory>/<platform>-installer[-secureboot]/<schematicId>:v<talosVersion>
# It injects it as a cluster-level patch, so no `machine.install.image` patch is needed.
platform: metal  # Every node is a bare-metal NUC
secureboot: true  # SecureBoot + UKI, so the -secureboot installer variant
schematicId: '@schematic.yaml'

secretsPath: secrets.sops.yaml  # decrypted transparently by topf via sops

# Available in *.tpl patches as {{ .Data.<key> }}, and read by mk_kubeconfig.sh.
# Values used by only one patch are written in that patch instead of here.
data:
  vip: 192.168.1.200  # keep in step with clusterEndpoint above
  oidcIssuerUrl: https://auth.karlsen.fr
  oidcClientId: kube_login

# Per-node values are available as {{ .Node.Data.<key> }}.
#   zone         topology zone label; upgrade.sh also uses it as the Kubernetes node name
#   link         the link that carries DHCP and the control-plane VIP
#   installDisk  serial of the install disk, see all/00-install.yaml.tpl
#   mac0, mac1   the ports, by MAC (node/<host>/01-*): the bond members on the NUC 16s, where mac0 is also the
#                bond's own MAC, which the Kea reservation on helios is keyed on; hera's one port
nodes:
  # ASUS NUC 15 Pro+, bare metal, one port (formerly the Proxmox host of t01 and file01). Its Samsung 9100 PRO is
  # the file VM's, bound to vfio-pci. See node/hera.home.karlsen.fr/.
  - host: hera.home.karlsen.fr
    ip: 192.168.0.40
    role: control-plane
    data: {zone: hera, link: lan0, installDisk: AAFDB532007H4N, mac0: '88:ae:dd:68:ab:e8'}

  # ASUS NUC 16 Pro, bare metal, on harmonia ports 3+4 (static LAG1). See node/hestia.home.karlsen.fr/.
  - host: hestia.home.karlsen.fr
    ip: 192.168.0.50
    role: control-plane
    data: {zone: hestia, link: bond0, installDisk: S7HDNJ0L802614A, mac0: '48:21:0B:7D:F6:25', mac1: '48:21:0B:7D:F6:26'}

  # ASUS NUC 16 Pro, bare metal, on harmonia ports 5+6 (static LAG2). See node/dike.home.karlsen.fr/.
  - host: dike.home.karlsen.fr
    ip: 192.168.0.60
    role: control-plane
    data: {zone: dike, link: bond0, installDisk: S64BNJ0T221755X, mac0: '48:21:0B:7D:F4:73', mac1: '48:21:0B:7D:F4:74'}
