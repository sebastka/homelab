# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.12/website/content/v1.12/schemas/config.schema.json
# Disable Flanel and kube-proxy: use Cilium instead
# - https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
---
cluster:
  network:
    cni:
      name: none
  # proxy:
  #   disabled: true
  # extraManifests:
  #   - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/experimental-install.yaml  # Required by Cilium for Gateway API support
machine:
  features:
    hostDNS:
      forwardKubeDNSToHost: false  # https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium#known-issues
