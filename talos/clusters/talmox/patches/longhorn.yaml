# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.12/website/content/v1.12/schemas/config.schema.json
# Longhorn
# - https://longhorn.io/docs/1.9.0/advanced-resources/os-distro-specific/talos-linux-support/
# - https://joshrnoll.com/installing-longhorn-on-talos-with-helm/
# - https://www.johanneskueber.com/posts/longhorn_uservolumes_talos/
# - https://docs.siderolabs.com/talos/v1.11/reference/configuration/block/uservolumeconfig
---
machine:
  kernel:
    modules: [{name: nvme_tcp}, {name: vfio_pci}, {name: iscsi_tcp}]  # uio_pci_generic
  sysctls: {vm.nr_hugepages: '1024'}
  kubelet:
    extraMounts:
      - source: /var/mnt/longhorn-data
        destination: /var/lib/longhorn
        type: bind
        options: [bind, rshared, rw]
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn-data  # label: u-longhorn-data
provisioning:
  diskSelector: {match: 'disk.size > 96u * GiB'}
  minSize: 1GiB
filesystem: {type: ext4}
encryption:
  provider: luks2
  keys: [{nodeID: {}, slot: 0}]
