# yaml-language-server: $schema=
# https://docs.siderolabs.com/talos/v1.12/platform-specific-installations/bare-metal-platforms/secureboot#booting-talos-linux-in-secureboot-mode
---
apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  keys:
    - nodeID: {}
      slot: 0
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
encryption:
  provider: luks2
  keys:
    - nodeID: {}
      slot: 0
