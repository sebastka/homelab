# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.12/website/content/v1.12/schemas/config.schema.json
# Lower kubelet image GC thresholds so unused layers are pruned before disk
---
machine:
  kubelet:
    extraConfig:
      imageGCHighThresholdPercent: 65   # default: 85
      imageGCLowThresholdPercent: 50    # default: 80
      imageMaximumGCAge: 48h            # default: 0s (disabled)
      nodeStatusUpdateFrequency: 20s    # default: 10s
      syncFrequency: 3m                 # default: 1m
