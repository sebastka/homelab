# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.12/website/content/v1.12/schemas/config.schema.json
# Reources limits for control plane components
---
cluster:
  apiServer:
    resources:
      requests: {memory: 2048Mi}
      limits: {memory: 2560Mi}
  controllerManager:
    resources:
      requests: {memory: 128Mi}
      limits: {memory: 512Mi}
  scheduler:
    resources:
      requests: {memory: 64Mi}
      limits: {memory: 128Mi}
