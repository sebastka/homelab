# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.12/website/content/v1.12/schemas/config.schema.json
# Kernel modules and sysctls for cluster stability and workload compatibility
---
machine:
  sysctls:
    fs.inotify.max_user_watches: '524288'    # default 8192 - too low for ArgoCD/Prometheus/Falco
    fs.inotify.max_user_instances: '8192'    # default 128
    vm.max_map_count: '262144'               # default 65530 - required by Thanos, JVM workloads
    net.core.somaxconn: '65536'              # default 4096 - required for high load on API server
