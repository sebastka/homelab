# https://budimanjojo.github.io/talhelper/latest/getting-started/
# https://budimanjojo.github.io/talhelper/latest/reference/configuration/
# https://github.com/budimanjojo/talhelper/blob/master/example/talconfig.yaml
# https://docs.siderolabs.com/talos/v1.12/reference/configuration/v1alpha1/config
---
clusterName: ${CLUSTER_NAME}
talosVersion: v${TALOS_VERSION}
kubernetesVersion: v${K8S_VERSION}
endpoint: https://${CONTROL_PLANE_IP}:6443
# domain: home.karlsen.fr
allowSchedulingOnMasters: false
# additionalApiServerCertSans:
clusterPodNets: [10.244.0.0/16]
clusterSvcNets: [10.96.0.0/12]
# cniConfig:  # Use patch instead
#   name: none

patches:
  - '@./patches/common/cilium.yaml'
  - '@./patches/common/prometheus.yaml'
  - '@./patches/common/longhorn.yaml'
  - '@./patches/common/oom.yaml'

controlPlane:
  patches:
    - '@./patches/controlplane/metrics.yaml'
    - '@./patches/controlplane/oidc.yaml'

worker:
  patches:
    - '@./patches/worker/longhorn.yaml'

nodes:
  - hostname: cp01.${CLUSTER_DOMAIN}
    ipAddress: 192.168.1.201
    installDisk: &x-installDisk /dev/sda
    # installDiskSelector: &x-installDiskSelector 'size < 40 GiB'  # Make sure Talos is installed on the smaller OS disk and not on the extra data disk
    controlPlane: true
    ignoreHostname: &x-ignoreHostname true
    networkInterfaces: &x-networkInterfaces-cp
      - interface: eth0
        dhcp: true
        vip:
          ip: ${TALOS_VIP}  # https://docs.siderolabs.com/talos/v1.12/networking/advanced/vip
    machineSpec: &x-machineSpec
      mode: nocloud
      arch: amd64
      secureboot: true
      useUKI: true
      bootMethod: disk-image
    nodeLabels:
      topology.kubernetes.io/region: &x-label-topology-region ${CLUSTER_NAME}
      topology.kubernetes.io/zone: cp01
    schematic: &x-schematic
      customization:
        bootloader: sd-boot
        extraKernelArgs:
          - -lockdown
          - -lockdown=integrity
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/qemu-guest-agent
            - siderolabs/util-linux-tools
            - siderolabs/xe
            # - siderolabs/i915
            # - siderolabs/cloudflared

  - hostname: cp02.${CLUSTER_DOMAIN}
    ipAddress: 192.168.1.202
    installDisk: *x-installDisk
    # installDiskSelector: *x-installDiskSelector
    controlPlane: true
    ignoreHostname: *x-ignoreHostname
    networkInterfaces: *x-networkInterfaces-cp
    machineSpec: *x-machineSpec
    nodeLabels:
      topology.kubernetes.io/region: *x-label-topology-region
      topology.kubernetes.io/zone: cp02
    schematic: *x-schematic

  - hostname: cp03.${CLUSTER_DOMAIN}
    ipAddress: 192.168.1.203
    installDisk: *x-installDisk
    # installDiskSelector: *x-installDiskSelector
    controlPlane: true
    ignoreHostname: *x-ignoreHostname
    networkInterfaces: *x-networkInterfaces-cp
    machineSpec: *x-machineSpec
    nodeLabels:
      topology.kubernetes.io/region: *x-label-topology-region
      topology.kubernetes.io/zone: cp03
    schematic: *x-schematic

  - hostname: w01.${CLUSTER_DOMAIN}
    ipAddress: 192.168.1.211
    installDisk: *x-installDisk
    # installDiskSelector: *x-installDiskSelector
    controlPlane: false
    ignoreHostname: *x-ignoreHostname
    networkInterfaces: &x-networkInterfaces-worker
      - interface: eth0
        dhcp: true
    machineSpec: *x-machineSpec
    nodeLabels:
      topology.kubernetes.io/region: *x-label-topology-region
      topology.kubernetes.io/zone: w01
    schematic: *x-schematic

  - hostname: w02.${CLUSTER_DOMAIN}
    ipAddress: 192.168.1.212
    installDisk: *x-installDisk
    # installDiskSelector: *x-installDiskSelector
    controlPlane: false
    ignoreHostname: *x-ignoreHostname
    networkInterfaces: *x-networkInterfaces-worker
    machineSpec: *x-machineSpec
    nodeLabels:
      topology.kubernetes.io/region: *x-label-topology-region
      topology.kubernetes.io/zone: w02
    schematic: *x-schematic

  - hostname: w03.${CLUSTER_DOMAIN}
    ipAddress: 192.168.1.213
    installDisk: *x-installDisk
    # installDiskSelector: *x-installDiskSelector
    controlPlane: false
    ignoreHostname: *x-ignoreHostname
    networkInterfaces: *x-networkInterfaces-worker
    machineSpec: *x-machineSpec
    nodeLabels:
      topology.kubernetes.io/region: *x-label-topology-region
      topology.kubernetes.io/zone: w03
    schematic: *x-schematic
