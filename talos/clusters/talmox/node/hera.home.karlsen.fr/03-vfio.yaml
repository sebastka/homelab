# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.14/website/content/v1.14/schemas/config.schema.json
# The Samsung 9100 PRO (4 TB, 144d:a810 at 0000:01:00.0, alone in its IOMMU group) belongs to the file VM
# (k8s/infrastructure/storage/file): bound to vfio-pci instead of nvme, so Talos never uses it and KubeVirt can
# pass it through. The IOMMU is on by default on these Intel NUCs, and vfio_pci is loaded by all/13-longhorn.yaml.
# vfio_iommu_type1 is VFIO's IOMMU backend, which QEMU's VFIO container needs and nothing loads by itself: without
# it, the VM fails to start with "failed to setup container for group 17: No available IOMMU models".
# Check: talosctl -n hera get pcidevices 0000:01:00.0 -o yaml    (driver: vfio-pci)
#        talosctl -n hera read /proc/modules | grep vfio_iommu_type1
# - https://docs.siderolabs.com/talos/v1.14/reference/configuration/hardware/pcidriverrebindconfig
---
apiVersion: v1alpha1
kind: PCIDriverRebindConfig
name: 0000:01:00.0
targetDriver: vfio-pci
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: vfio_iommu_type1
