# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.14/website/content/v1.14/schemas/config.schema.json
# The Corsair MP600 Micro (1 TB) for everything Talos keeps, as on the NUC 16s: Longhorn's user volume shares the system
# disk (all/13-longhorn.yaml), never the Samsung 9100 PRO, which is the file VM's (./03-vfio.yaml).
#
# EPHEMERAL grows to fill its disk by default, which would leave Longhorn nothing, so it is capped, at 128 GiB as on
# hestia (1 TB too). The cap is set at install time: changing it later means wiping EPHEMERAL.
#
# Merges with all/18-disk-encryption.yaml, which keeps its encryption settings.
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 128GiB
  grow: false
