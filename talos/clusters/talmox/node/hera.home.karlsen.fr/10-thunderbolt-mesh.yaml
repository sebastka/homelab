# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.14/website/content/v1.14/schemas/config.schema.json
# hera's two cables of the Thunderbolt mesh (all/21-thunderbolt.yaml), clockwise hera -> hestia -> dike -> hera: tb-next
# to hestia, tb-prev to dike. One /31 per cable in 10.250.0.0/24, and a host route to each neighbour's
# node IP through its cable: node-to-node traffic (WireGuard, etcd, the API, NFS...) takes the mesh without the node IPs
# changing, and the LAN otherwise. The links are matched by their Thunderbolt port (bus path <domain>-<port>.0), not their
# MAC: thunderbolt_net's MACs, and so the kernel's enx<MAC> names, can change at boot (hera's did, 2026-11-07). A cable
# moved to the other port swaps tb-next and tb-prev.
# The pods' routes to the other nodes are here too, over the cables and over the LAN as a fallback: they hard-code each
# node's podCIDR (kubectl get nodes -o custom-columns=NODE:.metadata.name,PODCIDR:.spec.podCIDR), to update for a new or
# reinstalled node.
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: tb-next
selector:
  match: link.driver == "thunderbolt-net" && link.bus_path == "1-1.0"  # Thunderbolt port 1-1, cable to hestia
---
apiVersion: v1alpha1
kind: LinkConfig
name: tb-next
up: true
mtu: 65520  # thunderbolt-net's maximum. The pods stay at 1500 (Cilium); the nodes' own connections adjust when one falls back to the LAN
addresses:
  - address: 10.250.0.0/31
routes:
  - destination: 192.168.0.50/32  # hestia's node IP: everything this node sends to hestia takes the cable
    gateway: 10.250.0.1
    source: 192.168.0.40  # The node IP, not the cable's address: peers (etcd's certificate checks, Cilium's node identities) see the usual address
  - destination: 10.244.1.0/24  # hestia's pods (its node's podCIDR): pod traffic to hestia takes the cable, unencrypted
    gateway: 10.250.0.1
    source: 192.168.0.40
    metric: 100  # Before the LAN's fallback route (below)
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: tb-prev
selector:
  match: link.driver == "thunderbolt-net" && link.bus_path == "0-1.0"  # Thunderbolt port 0-1, cable to dike
---
apiVersion: v1alpha1
kind: LinkConfig
name: tb-prev
up: true
mtu: 65520  # thunderbolt-net's maximum. The pods stay at 1500 (Cilium); the nodes' own connections adjust when one falls back to the LAN
addresses:
  - address: 10.250.0.5/31
routes:
  - destination: 192.168.0.60/32  # dike's node IP: everything this node sends to dike takes the cable
    gateway: 10.250.0.4
    source: 192.168.0.40  # The node IP, not the cable's address: peers (etcd's certificate checks, Cilium's node identities) see the usual address
  - destination: 10.244.4.0/24  # dike's pods (its node's podCIDR): pod traffic to dike takes the cable, unencrypted
    gateway: 10.250.0.4
    source: 192.168.0.40
    metric: 100  # Before the LAN's fallback route (below)
---
# The LAN's routes to the other nodes' pods, which Cilium no longer installs (autoDirectNodeRoutes: false): the fallback
# while a cable is down, when its metric-100 route above disappears with its link.
apiVersion: v1alpha1
kind: LinkConfig
name: lan0
routes:
  - destination: 10.244.1.0/24  # hestia's pods
    gateway: 192.168.0.50
    source: 192.168.0.40
    metric: 1024
  - destination: 10.244.4.0/24  # dike's pods
    gateway: 192.168.0.60
    source: 192.168.0.40
    metric: 1024
---
# Receive Packet Steering onto the P-cores (cpu0-5, 0x3f): the cables' receive interrupts land on E-cores (cpu10-13,
# 4.5 GHz), and one core does each cable's receive work, which held traffic into hera at 4-5 Gbit/s. With RPS, its IP
# and TCP processing moves to the P-cores: dike -> hera pods 5.3 -> 9.3 Gbit/s (iperf3, 2026-11-07). A udev rule, by
# driver: the kernel's names (enx<MAC>) change at boot with the MACs, so a SysfsConfig by name cannot hold.
# Check: talosctl -n hera read /sys/class/net/<enx…>/queues/rx-0/rps_cpus    (003f)
apiVersion: v1alpha1
kind: UdevRulesConfig
rules:
  - ACTION=="add", SUBSYSTEM=="net", DRIVERS=="thunderbolt-net", ATTR{queues/rx-0/rps_cpus}="3f"
