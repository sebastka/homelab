# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.14/website/content/v1.14/schemas/config.schema.json
# One NVMe drive for everything: Longhorn's user volume shares the system disk (all/13-longhorn.yaml).
#
# EPHEMERAL grows to fill its disk by default, which would leave Longhorn nothing, so it is capped. It holds images,
# logs and etcd. The cap is set at install time: changing it later means wiping EPHEMERAL.
#
# Merges with all/18-disk-encryption.yaml, which keeps its encryption settings.
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 128GiB
  grow: false
