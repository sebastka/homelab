# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.14/website/content/v1.14/schemas/config.schema.json
# The I226-V's (igc) receive losses (rx_missed_errors: 0.1-0.3% of received packets on enp85s0, 2026-10-20).
#
# The cause: PCIe ASPM L1 (and its L1.1 substate) on the cards' links. While the link sleeps, the card waits before
# writing packets to memory, and its RX FIFO overflows in bursts at 2.5 Gbit/s (node to node, WireGuard). Off per card
# (l1_aspm: 0, which also disables the substates), set live. Tested on hera by hand first: 0 losses in 307,000 packets,
# vs 0.15% on hestia (ASPM on) over the same 5 minutes (2026-10-20 23:57).
# Check: talosctl -n <node> read /sys/class/net/enp85s0/device/link/l1_aspm    (0)
#        talosctl -n <node> read /sys/class/net/enp85s0/statistics/rx_missed_errors     (the losses)
#
# Also no C3 (C3_ACPI, 1048 us to wake): the first suspect, which didn't reduce the losses. To revert once ASPM off is
# confirmed here, unless it saves power (hera: 21 -> 18 W without it). The Core Ultra 7 356H only has ACPI C-states
# here (intel_idle has no native table for it): POLL, C1 (state1), C2 (state2), C3 (state3), on its 16 CPUs.
# Check: talosctl -n <node> read /sys/devices/system/cpu/cpu0/cpuidle/state3/disable    (1)
---
apiVersion: v1alpha1
kind: SysfsConfig
params:
  # Through the links' network devices: the PCI addresses (0000:56:00.0) have dots, which the keys can't carry
  class.net.enp85s0.device.link.l1_aspm: '0'
  class.net.enp86s0.device.link.l1_aspm: '0'
  devices.system.cpu.cpu0.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu1.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu2.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu3.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu4.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu5.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu6.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu7.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu8.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu9.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu10.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu11.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu12.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu13.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu14.cpuidle.state3.disable: '1'
  devices.system.cpu.cpu15.cpuidle.state3.disable: '1'
