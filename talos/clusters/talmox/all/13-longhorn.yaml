# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.14/website/content/v1.14/schemas/config.schema.json
# Longhorn
# - https://longhorn.io/docs/1.9.0/advanced-resources/os-distro-specific/talos-linux-support/
# - https://joshrnoll.com/installing-longhorn-on-talos-with-helm/
# - https://www.johanneskueber.com/posts/longhorn_uservolumes_talos/
# - https://docs.siderolabs.com/talos/v1.14/reference/configuration/block/uservolumeconfig
#
# There is no kubelet bind mount for /var/lib/longhorn: `machine.kubelet.extraMounts` no
# longer exists (siderolabs/talos#14365), and it is not needed. Longhorn's defaultDataPath is
# /var/mnt/longhorn-data and instance-manager reaches it through its host-root mount, so the
# user volume below is what holds the replicas.
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvme_tcp
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: vfio_pci
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: uio_pci_generic
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: iscsi_tcp
---
apiVersion: v1alpha1
kind: SysctlConfig
params: {vm.nr_hugepages: '1024'}
# V2 Data Engine - when dedicating an NVMe, optionally bind it to vfio-pci to
# remove it from the OS and hand it exclusively to SPDK. Identify the PCI address
# with `talosctl get hardwareinfo` then add a PCIDriverRebindConfig document.
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn-data  # label: u-longhorn-data
provisioning:
  diskSelector: {match: 'disk.size > 96u * GiB'}
  minSize: 1GiB
filesystem: {type: ext4}
encryption:
  provider: luks2
  # Lets fstrim return deleted replica blocks to the ZFS pool. Rationale in
  # all/18-disk-encryption.yaml.
  allowDiscards: true
  keys: [{nodeID: {}, slot: 0}]
