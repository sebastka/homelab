# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.14/website/content/v1.14/schemas/config.schema.json
# https://docs.siderolabs.com/talos/v1.14/platform-specific-installations/bare-metal-platforms/secureboot#booting-talos-linux-in-secureboot-mode
#
# The key is sealed in the TPM against the Secure Boot state, so a volume only opens on its own machine running a
# Talos image signed with the enrolled key: a pulled disk is unreadable elsewhere. Enrollment is refused if Secure
# Boot is off. The volume is formatted with the key it is first given: changing it later means wiping the volume.
#
# allowDiscards lets TRIM reach the NVMe drive underneath, which is what makes the default weekly
# FilesystemTrimConfig do anything on an encrypted volume: without it the LUKS layer swallows every discard. The
# trade-off is that an attacker holding the raw disk can see which sectors are in use. EPHEMERAL churns (images,
# logs) and is worth it; STATE is ~88 MB and near-static, so it is left alone. See also all/13-longhorn.yaml.
---
apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  keys: [{tpm: {checkSecurebootStatusOnEnroll: true}, slot: 0}]
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
encryption:
  provider: luks2
  allowDiscards: true
  keys: [{tpm: {checkSecurebootStatusOnEnroll: true}, slot: 0}]
