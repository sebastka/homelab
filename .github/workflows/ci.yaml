---
name: CI

on:
  # Deliberately no `paths` filter. `CI gate` below is a required status check,
  # and a run that never starts leaves that check permanently pending, which would
  # block the PR from merging rather than letting it through.
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect:
    name: Collect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.collect.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the diff below needs history back to the PR base

      - name: Extract images added by this PR
        id: collect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # workflow_dispatch has no PR context; nothing to diff against.
          if [[ -z "${BASE_SHA:-}" ]]; then
            echo 'images=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A Renovate PR bumps one pinned `image:` line, so scanning only what the diff
          # introduces keeps this fast and fails solely on the change under review.
          # Helm-templated refs and bare chart version bumps are skipped: those images
          # are not resolvable without rendering the chart.
          # Both greps exit 1 when nothing matches, which here means "this PR changes
          # no images" — a normal result, not an error. Without the guards, `set -e`
          # plus `pipefail` fails the job on every PR that touches no k8s image.
          git diff --unified=0 "$BASE_SHA" HEAD -- k8s \
            | { grep -E '^\+[[:space:]]*image:[[:space:]]*\S' || true; } \
            | sed -E 's/^\+[[:space:]]*image:[[:space:]]*//; s/[[:space:]].*$//' \
            | tr -d '\042\047' \
            | { grep -Ev '[{}$]|^$' || true; } \
            | sort -u > images.txt

          echo 'Images to scan:'
          cat images.txt
          jq -Rsc 'split("\n") | map(select(length > 0))' < images.txt \
            | sed 's/^/images=/' >> "$GITHUB_OUTPUT"

  images:
    name: ${{ matrix.image }}
    needs: collect
    if: needs.collect.outputs.images != '' && needs.collect.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # report every offending image, not just the first
      matrix:
        image: ${{ fromJSON(needs.collect.outputs.images) }}
    env:
      # Job-level so the step `if` below can read it; step-level env is not
      # reliably visible to that step's own condition.
      DOCKERHUB_USERNAME: sebastka
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      # Only needed for .trivyignore.yaml; the image itself is pulled from its registry.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .trivyignore.yaml
          sparse-checkout-cone-mode: false

      # Trivy reads ~/.docker/config.json, so an optional Docker Hub login lifts the
      # anonymous pull-rate limit that shared Actions runners regularly hit. No-op
      # until a DOCKERHUB_TOKEN secret exists on the repo.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        run: echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      # Reporting only: this job is deliberately outside `CI gate`'s `needs`, so a
      # finding surfaces in the run log without blocking the merge. These images are
      # pulled from upstream rather than built here, so blocking on a CVE we cannot
      # fix just freezes the cluster on an older image carrying the same flaw.
      - name: Report HIGH and CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'  # visibility only
          trivyignores: .trivyignore.yaml
          hide-progress: true

  config:
    name: Misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scan manifests and OpenTofu
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          # Reporting only for now: the existing manifests have never been triaged
          # against these checks, so failing here would block every PR. Flip to '1'
          # once the Security tab backlog is clear.
          exit-code: '0'
          skip-dirs: 'k8s/**/charts/**'  # vendored upstream charts, per renovate.json ignorePaths
          hide-progress: true

      - name: Upload results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: trivy-config.sarif

  # kustomize configMapGenerator `envs:` takes everything after the first `=`
  # literally - no quote stripping, no comment stripping. Shell habits silently
  # corrupt values; three separate instances surfaced during the paperless v3
  # upgrade, each only when a stricter parser rejected them.
  env-files:
    name: Env file lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Reject shell quoting and trailing comments
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          bad = []
          for path in sorted(pathlib.Path("k8s").rglob("*.env")):
              if "/charts/" in str(path):
                  continue
              for num, line in enumerate(path.read_text().splitlines(), 1):
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#") or "=" not in stripped:
                      continue
                  key, _, value = stripped.partition("=")
                  if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                      continue
                  if len(value) > 1 and value[0] == value[-1] and value[0] in "\"'":
                      bad.append((path, num, "quoted value", line))
                  elif " #" in value:
                      bad.append((path, num, "trailing comment", line))

          for path, num, why, line in bad:
              print(f"::error file={path},line={num}::{why} - kustomize keeps this verbatim: {line}")

          if bad:
              print(f"\n{len(bad)} problem(s). Move comments to their own line and drop shell quotes.")
              sys.exit(1)

          print("All env files clean.")
          PY

  # Single stable check name for the ruleset on master to require. The per-image
  # jobs are named after the image they scan, so their names change every PR and
  # cannot be named in a ruleset. Only the jobs listed in `needs` can block a
  # merge: the Trivy scans above report into the run and the Security tab, but
  # are deliberately left out so upstream CVE churn cannot freeze the repo.
  gate:
    name: CI gate
    needs: [env-files]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"

          # Job results are success | failure | cancelled | skipped.
          if jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' <<< "$RESULTS" > /dev/null; then
            echo '::error::One or more required jobs did not pass'
            exit 1
          fi

          echo 'All required jobs passed.'
