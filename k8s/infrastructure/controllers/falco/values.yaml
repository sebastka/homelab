# yaml-language-server: $schema=
# https://github.com/falcosecurity/charts/blob/master/charts/falco/values.yaml
---

driver:
  kind: modern_ebpf
  # loader: {enabled: true}

tty: true

collectors:
  containerEngine:
    engines:
      docker:       {enabled: false}
      podman:       {enabled: false}
      containerd:   {enabled: true}
      cri:          {enabled: false}
      lxc:          {enabled: false}
      libvirt_lxc:  {enabled: false}
      bpm:          {enabled: false}

falcosidekick:
  enabled: true
  webui: {enabled: true, redis: {enabled: true}}
  config:
    loki: {hostport: http://loki.loki.svc.cluster.local:3100, minimumpriority: debug}
    webhook: {address: http://web.ntfy.svc.cluster.local, minimumpriority: warning, checkcert: false}
    extraEnv:
      - {name: FALCO_NTFY_TOKEN,       valueFrom: {secretKeyRef: {name: falco-ntfy, key: NTFY_AUTH_TOKEN_FALCO}}}
      - {name: FALCO_NTFY_TOPIC,       valueFrom: {secretKeyRef: {name: falco-ntfy, key: NTFY_TOPIC}}}
      - {name: WEBHOOK_ADDRESS,        value: "http://web.ntfy.svc.cluster.local/$(FALCO_NTFY_TOPIC)"}
      - {name: WEBHOOK_CUSTOMHEADERS,  value: "Authorization:Bearer $(FALCO_NTFY_TOKEN),X-Template:falco,X-Priority:4,X-Tags:falco"}

customRules:
  cilium-cni-false-positives.yaml: |-
    - rule: Drop and execute new binary in container
      override: {condition: append}
      condition: and not (proc.name = "cilium-cni" and proc.pname = "containerd")

