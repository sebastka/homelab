---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-falcosidekick-ingress
  namespace: falco
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: falcosidekick}}
  ingress:
    - {fromEntities: [host], toPorts: [ports: [{port: '2801', protocol: TCP}]]}  # Host probes
    - {fromEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: falco, app.kubernetes.io/name: falco}}], toPorts: [ports: [{port: '2801', protocol: TCP}]]}  # Events from Falco
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-falcosidekick-egress
  namespace: falco
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: falcosidekick}}
  egress:
    - {toEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: falco, app.kubernetes.io/name: falcosidekick}}], toPorts: [ports: [{port: '2802', protocol: TCP}]]}  # Test connection
    - {toEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: loki, app.kubernetes.io/name: loki, app.kubernetes.io/component: single-binary}}], toPorts: [ports: [{port: '3100', protocol: TCP}]]}  # Loki output
    - {toEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: ntfy, app.kubernetes.io/name: ntfy}}], toPorts: [ports: [{port: '8080', protocol: TCP}]]}  # Webhook output
