---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: falcosidekick-loki
  namespace: falco
spec:
  allowCrossNamespaceImport: true
  folder: Falco
  resyncPeriod: 10m
  instanceSelector:
    matchLabels:
      app: grafana
  configMapRef:
    name: falcosidekick-loki-dashboard-grafana
    key: falcosidekick-loki-dashboard.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: falco-events
  namespace: falco
spec:
  allowCrossNamespaceImport: true
  folder: Falco
  resyncPeriod: 10m
  instanceSelector:
    matchLabels:
      app: grafana
  json: |
    {
      "title": "Falco Events",
      "uid": "falco-events",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-24h", "to": "now"},
      "timezone": "browser",
      "tags": ["falco"],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "victoriametrics-logs-datasource",
            "hide": 0,
            "label": "Datasource",
            "multi": false,
            "includeAll": false,
            "current": {}
          },
          {
            "name": "priority",
            "type": "textbox",
            "hide": 0,
            "label": "Priority",
            "options": [{"selected": true, "text": ".+", "value": ".+"}],
            "query": ".+",
            "current": {"selected": true, "text": ".+", "value": ".+"}
          },
          {
            "name": "namespace",
            "type": "textbox",
            "hide": 0,
            "label": "Namespace",
            "options": [{"selected": true, "text": ".+", "value": ".+"}],
            "query": ".+",
            "current": {"selected": true, "text": ".+", "value": ".+"}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Events",
          "type": "logs",
          "gridPos": {"h": 24, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
              "editorMode": "code",
              "expr": "{priority=~\"$priority\"} | k8s_ns_name =~ \"$namespace\"",
              "queryType": "range"
            }
          ]
        }
      ],
      "annotations": {"list": []},
      "links": [
        {
          "title": "Falcosidekick Stats",
          "type": "dashboard",
          "url": "/d/de6ixj4nl1kowc",
          "tooltip": "Open Falcosidekick Loki dashboard"
        }
      ]
    }
