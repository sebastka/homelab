---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: falco-events
  namespace: falco
spec:
  allowCrossNamespaceImport: true
  folder: Falco
  resyncPeriod: 10m
  instanceSelector: {matchLabels: {app: grafana}}
  configMapRef: {name: falco-events-dashboard, key: falco-events.json}
