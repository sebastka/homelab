---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-falco-ingress
  namespace: falco
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: falco}}
  ingress:
    - {fromEntities: [host], toPorts: [ports: [{port: '8081', protocol: TCP}]]}  # Host probes
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-falco-egress
  namespace: falco
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: falco}}
  egress:
    - {toEntities: [kube-apiserver]}
    - {toEntities: [world], toPorts: [ports: [{port: '443', protocol: TCP}]]}  # falcoctl rule updates
