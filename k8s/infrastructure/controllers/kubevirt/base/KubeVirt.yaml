---
# https://kubevirt.io/user-guide/cluster_admin/updating_and_deletion/
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates:
        - HostDevices  # PCI passthrough (Alpha in 1.9: feature-gates.json of the release)
    # https://kubevirt.io/user-guide/compute/host-devices/
    # Only devices bound to vfio-pci on their node are offered, as a schedulable resource of that node.
    permittedHostDevices:
      pciHostDevices:
        # hera's Samsung 9100 PRO (talos: node/hera.home.karlsen.fr/03-vfio.yaml), the file VM's data disk
        - {pciVendorSelector: '144D:A810', resourceName: samsung.com/ssd-9100-pro}
    imagePullPolicy: IfNotPresent
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  uninstallStrategy: BlockUninstallIfWorkloadsExist  # Deleting this resource never takes running VMs with it
  workloadUpdateStrategy: {}
