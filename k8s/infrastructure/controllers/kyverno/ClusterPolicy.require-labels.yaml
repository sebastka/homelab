---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/description: Require the 'app.kubernetes.io/name' label on all Pods to enable consistent identification and policy targeting across the cluster.
spec:
  background: true
  rules:
    - name: require-app-name-label
      match: {any: [resources: {kinds: [Pod]}]}
      exclude: {any: [resources: {namespaceSelector: {matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [kube-system, kube-node-lease, kube-public]}]}}]}
      validate:
        failureAction: Audit
        message: "Label 'app.kubernetes.io/name' is required on all pods."
        deny:
          conditions:
            all:
              - {key: "{{ contains(keys(request.object.metadata.labels), 'app.kubernetes.io/name') }}", operator: Equals, value: false}
