# Exceptions:
# - forgejo: GPG signatures on release binaries only, no container image signing
# - searxng: not signed
# - lldap: not signed
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures-third-party
  annotations:
    policies.kyverno.io/title: Verify Third-Party Image Signatures
    policies.kyverno.io/description: Verify Sigstore keyless signatures on images from trusted third-party projects (Cilium, ArgoCD, Kyverno, SPIRE, Longhorn, etc.) to ensure images originate from their official CI pipelines.
spec:
  background: false
  rules:
    - name: verify-cilium
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['quay.io/cilium/*']
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/cilium/cilium/.github/workflows/*'
                    issuer: 'https://token.actions.githubusercontent.com'
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-argocd
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['quay.io/argoproj/*', 'quay.io/argoprojlabs/*']
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/argoproj/argo-cd/.github/workflows/*'
                    issuer: 'https://token.actions.githubusercontent.com'
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-kyverno
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['docker.io/kyverno/*', 'ghcr.io/kyverno/*']
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/kyverno/kyverno/.github/workflows/*'
                    issuer: https://token.actions.githubusercontent.com
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-cloudnative-pg
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
