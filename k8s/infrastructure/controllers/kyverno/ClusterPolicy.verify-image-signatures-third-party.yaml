    - name: verify-kubernetes
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['registry.k8s.io/*']
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: k8s-infra-gcb@k8s-infra-release-prod.iam.gserviceaccount.com
                    issuer: https://accounts.google.com
                    rekor: {url: https://rekor.sigstore.dev}
