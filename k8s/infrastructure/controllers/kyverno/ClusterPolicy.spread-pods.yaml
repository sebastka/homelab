# Soft zone-spread topology constraint into every non-system pod
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: spread-pods-across-zones
  annotations:
    policies.kyverno.io/title: Spread Pods Across Zones
    policies.kyverno.io/description: Inject a soft topology spread constraint into every non-system Pod to distribute workloads evenly across availability zones.
spec:
  background: false
  rules:
    - name: inject-zone-spread
      match: {any: [resources: {kinds: [Pod], operations: [CREATE]}]}
      exclude: {any: [resources: {namespaceSelector: {matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [kube-system, kube-node-lease, kube-public, kyverno, envoy-gateway-system, cilium-spire, cilium-secrets, trivy]}]}}]}
      mutate:
        patchStrategicMerge:
          metadata: {labels: {topology.karlsen.fr/spread: 'true'}}
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector: {matchLabels: {topology.karlsen.fr/spread: 'true'}}
