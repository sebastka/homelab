# yaml-language-server: $schema=
# https://github.com/kyverno/kyverno/blob/main/charts/kyverno/values.yaml
---

features:
  # policyExceptions:
  #   enabled: true
  #   namespace: kyverno
  ttlController:
    reconciliationInterval: 30m
  reporting:
    # validate: true
    # mutate: true
    mutateExisting: false
    # imageVerify: true
    generate: false

# Memory only: the chart's CPU requests stay. Both peaked at ~110Mi on its 64Mi/128Mi defaults.
cleanupController:
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 256Mi}

reportsController:
  resources:
    requests: {memory: 192Mi}
    limits: {memory: 256Mi}
