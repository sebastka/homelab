---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kyverno

components:
  - ../../../../common/images

images:
  - {name: ghcr.io/kyverno/readiness-checker, newTag: latest, digest: sha256:d52dd1fd0ea857abb2eddf815d5e33ba7a94cd948527cc36c97e36800f08ba2a}

# Wave 0: CRDs + Operator
# Wave 1: CiliumNetworkPolicies
# Wave 2: ClusterPolicies
patches:
  - target: {kind: CiliumNetworkPolicy}
    patch: |
      - {op: add, path: /metadata/annotations, value: {argocd.argoproj.io/sync-wave: '1'}}
  - target: {kind: ClusterPolicy}
    patch: |
      - {op: add, path: /metadata/annotations, value: {argocd.argoproj.io/sync-wave: '2'}}

resources:
  - Namespace.yaml
  # - ClusterPolicy.spread-pods.yaml
  - ClusterPolicy.trivy-node-collector-fix-proxy-bins.yaml
  - ClusterPolicy.require-securitycontext.yaml
  - ClusterPolicy.disallow-latest-tag.yaml
  - ClusterPolicy.require-requests-limits.yaml
  - ClusterPolicy.require-labels.yaml
  - ClusterPolicy.require-probes.yaml
  - ClusterPolicy.restrict-image-registries.yaml
  # - ClusterPolicy.verify-image-signatures.yaml
  - CiliumNetworkPolicy.yaml

helmCharts:
  - name: kyverno
    repo: oci://ghcr.io/kyverno/charts
    version: 3.9.1
    releaseName: kyverno
    namespace: kyverno
    includeCRDs: true
    valuesFile: values.yaml
