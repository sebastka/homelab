      verifyImages:
        - imageReferences: [quay.io/thanos/thanos]
          type: Cosign
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/thanos-io/thanos/.github/workflows/*'
                    issuer: https://token.actions.githubusercontent.com
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-kubernetes
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['registry.k8s.io/*', '!registry.k8s.io/git-sync/*']
          type: Cosign
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: k8s-infra-gcb@k8s-infra-release-prod.iam.gserviceaccount.com
                    issuer: https://accounts.google.com
                    rekor: {url: https://rekor.sigstore.dev}
                - keyless:
                    subject: krel-trust@k8s-releng-prod.iam.gserviceaccount.com
                    issuer: https://accounts.google.com
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-git-sync
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
