                    subject: 'https://github.com/element-hq/synapse/.github/workflows/docker.yml@refs/tags/v*'
                    issuer: https://token.actions.githubusercontent.com
                    rekor: {url: https://rekor.sigstore.dev}
        # OCI referrer cosign/sign/v1 - uncomment when Kyverno supports it:
