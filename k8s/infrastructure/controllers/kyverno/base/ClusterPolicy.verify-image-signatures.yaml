# Exceptions (images in restrict-image-registries without a verified signature rule):
#
# Not signed:
#   Docker Official Images: library/{alpine,busybox,node,postgres,mariadb,memcached}
#   docker.io/alpine/{kubectl,curl,git}
#   docker.io/{valkey/valkey,mikefarah/yq,nginxinc/nginx-unprivileged}
#   docker.io/crowdsecurity/crowdsec
#   docker.io/falcosecurity/{falcosidekick,falcosidekick-ui}
#   docker.io/redis/redis-stack; docker.io/bitnami/sealed-secrets-controller
#   mirror.gcr.io/aquasec/trivy (mirror carries no cosign artifacts; ghcr.io source is signed)
#   intel/{intel-deviceplugin-operator,intel-gpu-plugin} (inaccessible via docker.io)
#   ghcr.io/headlamp-k8s/headlamp; ghcr.io/kubebeam/trivy-headlamp-plugin
#   quay.io/prometheus/{prometheus,alertmanager,node-exporter}; prom/memcached-exporter
#   docker.io/kiwigrid/k8s-sidecar
#   docker.io/envoyproxy/{envoy,gateway,ratelimit}; ghcr.io/kdwils/envoy-proxy-bouncer
#   ghcr.io/{traefik/whoami,jellyfin/jellyfin,alexta69/metube}
#   docker.io/dyc3/opentogethertube; ghcr.io/maxmind/geoipupdate
#   docker.n8n.io/n8nio/n8n; n8nio/runners
#   docker.io/{binwiederhier/ntfy,apache/tika,gotenberg/gotenberg,searxng/searxng}
#   ghcr.io/paperless-ngx/paperless-ngx; ghcr.io/thelounge/thelounge; docker.io/glanceapp/glance
#   code.forgejo.org/forgejo/forgejo (GPG only, no container image signing)
#   docker.io/lldap/lldap
#   docker.io/velero/{velero,velero-plugin-for-aws} (donated to CNCF velero-io in 2026, not signed yet)
#   docker.io/grafana/{alloy,grafana,loki}; docker.io/longhornio/*
#   quay.io/cilium/{hubble-ui,hubble-ui-backend}
#
# OCI referrer cosign/sign/v1 format: incompatible with Kyverno 3.8.x type: Cosign (.sig tag only)
# and type: SigstoreBundle (expects newer bundle spec). Rules below are commented out: uncomment
# when Kyverno adds support for cosign/sign/v1 OCI referrer format.
#   ghcr.io/sebastka/*
#   quay.io/cilium/* (cilium, cilium-operator, cilium-envoy, hubble-relay, operator-generic)
#   quay.io/argoproj/{argocd,argocd-extension-installer}
#   quay.io/prometheus-operator/* (v0.90+; was .sig tag in v0.82)
#   docker.io/zabbix/*
#   ghcr.io/home-operations/*
#   docker.io/falcosecurity/falcoctl
#   ghcr.io/jkroepke/*
#   ghcr.io/element-hq/matrix-authentication-service; docker.io/vectorim/element-web
#
# Personally signed, not via GHA OIDC (not added: tied to dominik@suess.wtf personal account):
#   ghcr.io/grafana/grafana-operator
#
# Attestations only, no .sig signatures:
#   reg.kyverno.io/kyverno/*; ghcr.io/kyverno/*
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/description: Verify Sigstore keyless signatures on images to ensure images originate from their official CI pipelines.
spec:
  background: true
  rules:
    # - name: verify-sebastka-images  # OCI referrer cosign/sign/v1 - uncomment when Kyverno supports it
    #   match: {any: [resources: {kinds: [Pod]}]}
    #   verifyImages:
    #     - imageReferences: ['ghcr.io/sebastka/*']
    #       type: SigstoreBundle
    #       failureAction: Audit  # Enforce
    #       mutateDigest: false
    #       verifyDigest: false
    #       attestors:
    #         - count: 1
    #           entries:
    #             - keyless:
    #                 subject: 'https://github.com/sebastka/*/.github/workflows/*'
    #                 issuer: https://token.actions.githubusercontent.com
    #                 rekor: {url: https://rekor.sigstore.dev}
    - name: verify-cloudnative-pg
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['ghcr.io/cloudnative-pg/*']
          type: Cosign
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/cloudnative-pg/cloudnative-pg/.github/workflows/*'
                    issuer: https://token.actions.githubusercontent.com
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-spire
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
