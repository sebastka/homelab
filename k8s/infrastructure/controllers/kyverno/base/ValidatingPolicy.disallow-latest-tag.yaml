---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/description: Require all container images to use an explicit, versioned tag. Images using ':latest' or no tag are rejected to ensure reproducible deployments.
spec:
  validationActions: [Deny]
  evaluation: {background: {enabled: true}}
  # Pod rules are also generated for their controllers (Deployment, StatefulSet, CronJob...)
  matchConstraints:
    resourceRules: [{apiGroups: [''], apiVersions: [v1], resources: [pods], operations: [CREATE, UPDATE]}]
    namespaceSelector: {matchExpressions: [{key: kubernetes.io/metadata.name, operator: NotIn, values: [kube-system, kube-node-lease, kube-public]}]}
  variables:
    - {name: containers, expression: 'object.spec.containers + object.spec.?initContainers.orValue([])'}
  validations:
    # ':' anywhere: a tag, or a digest only (image@sha256:...)
    - expression: variables.containers.all(c, !c.image.endsWith(':latest') && c.image.contains(':'))
      message: "All container images must use an explicit tag: not ':latest' and not untagged."
