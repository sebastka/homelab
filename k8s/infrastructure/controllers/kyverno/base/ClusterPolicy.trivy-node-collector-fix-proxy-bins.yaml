# Workaround for trivy-operator node-collector "spec not found" on nodes running Zabbix.
#
# Root cause: node-collector's binary lookup for kube-proxy uses `pgrep -l "" | grep 'proxy'`
# as a last-resort pattern, which matches Zabbix's "proxy poller" worker threads and returns
# "zabbix_server:" (with trailing colon) as the binary name. When this is substituted into
# the node-commands YAML template, the colon-space sequence causes yaml.Unmarshal to fail
# silently, leaving commands=nil and returning "spec not found".
#
# Fix: replace the --node-config blob passed to each node-collector Job with a patched version
# that removes the bare "proxy" entry from proxy.bins. On a Cilium cluster kube-proxy does not
# run, so this entry never finds a real binary anyway.
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: trivy-node-collector-fix-proxy-bins
  annotations:
    policies.kyverno.io/title: Fix trivy node-collector proxy.bins contamination
    policies.kyverno.io/description: >-
      Patches the --node-config blob in node-collector Jobs to remove the bare
      "proxy" binary search pattern that matches Zabbix worker threads.
spec:
  background: false
  rules:
    - name: patch-node-config-proxy-bins
      match:
        any:
          - resources:
              kinds: [Job]
              namespaces: [trivy]
              operations: [CREATE]
              selector:
                matchLabels:
                  app.kubernetes.io/managed-by: trivy-operator
                  trivy-operator.resource.kind: Node
      preconditions:
        all:
          - key: "{{ request.object.spec.template.spec.containers[0].args[3] }}"
            operator: Equals
            value: "--node-config"
      mutate:
        patchesJson6902: |
          - op: replace
            path: /spec/template/spec/containers/0/args/4
            value: ""
