---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/description: Restrict which image registries can be used in Pods to reduce the attack surface and prevent accidental usage of unapproved images.
spec:
  background: true
  rules:
    - name: check-registries
      match: {any: [resources: {kinds: [Pod]}]}
      exclude: {any: [resources: {namespaceSelector: {matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [kube-system, kube-node-lease, kube-public]}]}}]}
      validate:
        failureAction: Audit  # Switch to Enforce once policy-reporter shows zero violations
        message: "One or more images are not in the allowlist: {{ request.object.spec.[containers, initContainers, ephemeralContainers][].image | join(', ', @) }}. Add the image to ClusterPolicy/restrict-image-registries to permit it."
        foreach:
          - list: 'request.object.spec.[containers, initContainers, ephemeralContainers][]'
            deny:
              conditions:
                all:
                  # Strip :tag and @sha256:digest before matching so each entry covers all versions.
                  - key: "{{ element.image | regex_replace_all_literal(':[^/:@]+$|@sha256:[a-f0-9]+$', @, '') }}"
                    operator: NotIn
                    value:
                      # Shared (used in multiple places)
                      - alpine
                      - docker.io/alpine/git
                      - alpine/kubectl
                      - busybox
                      - docker.io/busybox
                      - docker.io/library/busybox
                      - public.ecr.aws/docker/library/busybox  # ArgoCD redis-ha
                      - kubectl
                      - docker.io/mikefarah/yq
                      - 'ghcr.io/sebastka/*'
                      - docker.io/nginxinc/nginx-unprivileged
                      - registry.k8s.io/git-sync/git-sync          # paperless + homepage
                      - ghcr.io/jkroepke/access-log-exporter       # kube-prometheus-stack + loki
                      - ecr-public.aws.com/docker/library/haproxy  # Redis HA: argocd + nextcloud
                      - ecr-public.aws.com/docker/library/redis    # Redis HA: argocd
                      - docker.io/valkey/valkey                    # common/valkey
                      - docker.io/library/node
                      - node

                      # infrastructure/network/cilium
                      - 'quay.io/cilium/*'
                      - ghcr.io/spiffe/spire-agent
                      - ghcr.io/spiffe/spire-server

                      # infrastructure/network/envoy-gateway
                      - 'docker.io/envoyproxy/*'
                      - ghcr.io/kdwils/envoy-proxy-bouncer

                      # infrastructure/controllers/argocd
                      - quay.io/argoproj/argocd

                      # infrastructure/controllers/falco
                      - docker.io/falcosecurity/falco
                      - docker.io/falcosecurity/falcoctl
                      - docker.io/falcosecurity/falcosidekick
                      - docker.io/falcosecurity/falcosidekick-ui

                      # infrastructure/controllers/kyverno
                      - 'ghcr.io/kyverno/*'
                      - 'kyverno/*'

                      # infrastructure/controllers/reloader
                      - ghcr.io/stakater/reloader

                      # infrastructure/controllers/node-feature-discovery
                      - registry.k8s.io/nfd/node-feature-discovery

                      # infrastructure/database/cloudnative-pg
                      # - ghcr.io/cloudnative-pg/cloudnative-pg

                      # infrastructure/database/database-backup
                      - docker.io/postgres
                      - docker.io/mariadb

                      # infrastructure/storage/longhorn
                      - 'longhornio/*'

                      # infrastructure/storage/velero
                      - docker.io/velero/velero
                      - docker.io/velero/velero-plugin-for-aws
                      - registry.k8s.io/kubectl

                      # infrastructure/monitoring/kube-prometheus-stack
                      - quay.io/prometheus/alertmanager
                      - quay.io/prometheus/prometheus
                      - quay.io/prometheus-operator/admission-webhook
                      - quay.io/prometheus-operator/prometheus-config-reloader
                      - quay.io/prometheus-operator/prometheus-operator
                      - ghcr.io/jkroepke/kube-webhook-certgen

                      # infrastructure/monitoring/thanos
                      - quay.io/thanos/thanos
                      - rustfs/rc

                      # infrastructure/monitoring/grafana-operator
                      - ghcr.io/grafana/grafana-operator

                      # infrastructure/monitoring/alloy
                      # (docker.io/grafana/alloy covered by docker.io/grafana/* below)

                      # infrastructure/monitoring/loki
                      - 'docker.io/grafana/*'
                      - memcached
                      - prom/memcached-exporter
                      - docker.io/kiwigrid/k8s-sidecar

                      # infrastructure/monitoring/policy-reporter
                      # kyverno/* (line 50) covers all policy-reporter images
                      - ghcr.io/oliver006/redis_exporter

                      # infrastructure/monitoring/trivy
                      - 'ghcr.io/aquasecurity/*'
                      - 'mirror.gcr.io/aquasec/*'

                      # infrastructure/monitoring/headlamp
                      - ghcr.io/headlamp-k8s/headlamp
                      - ghcr.io/kubebeam/trivy-headlamp-plugin

                      # infrastructure/monitoring/zabbix
                      - docker.io/zabbix/zabbix-server-pgsql
                      - docker.io/zabbix/zabbix-web-nginx-pgsql

                      # infrastructure/auth/authelia
                      - docker.io/authelia/authelia

                      # infrastructure/auth/light-ldap
                      - docker.io/lldap/lldap

                      # applications/dev/forgejo
                      - code.forgejo.org/forgejo/forgejo

                      # applications/dev/harbor
                      - 'goharbor/*'

                      # applications/dev/whoami
                      - ghcr.io/traefik/whoami

                      # applications/media/jellyfin
                      - ghcr.io/jellyfin/jellyfin

                      # applications/media/metube
                      - ghcr.io/alexta69/metube

                      # applications/media/opentogethertube
                      - docker.io/dyc3/opentogethertube

                      # applications/public/element
                      - docker.io/vectorim/element-web

                      # applications/public/slink
                      # - docker.io/anirdev/slink

                      # applications/public/synapse
                      - ghcr.io/element-hq/synapse

                      # applications/utils/deluge
                      - ghcr.io/home-operations/deluge

                      # applications/utils/glance
                      - docker.io/glanceapp/glance

                      # applications/utils/joplin
                      # - docker.io/joplin/server
                      # - docker.io/joplin/transcribe
                      # - docker.io/joplin/htr-cli

                      # applications/utils/matrix-authentication-service
                      - ghcr.io/element-hq/matrix-authentication-service
                      - ghcr.io/maxmind/geoipupdate

                      # applications/utils/n8n
                      - docker.n8n.io/n8nio/n8n
                      - n8nio/runners

                      # applications/utils/nextcloud
                      # - library/nextcloud
                      # - library/nginx
                      # - xperimental/nextcloud-exporter
                      # - h2non/imaginary
                      # - bitnamilegacy/mariadb
                      # - bitnamilegacy/postgresql
                      # - bitnamilegacy/redis

                      # applications/utils/ntfy
                      - docker.io/binwiederhier/ntfy

                      # applications/utils/paperless
                      - ghcr.io/paperless-ngx/paperless-ngx
                      - docker.io/apache/tika
                      - docker.io/gotenberg/gotenberg

                      # applications/utils/qbittorrent
                      # - ghcr.io/qbittorrent/qbittorrent

                      # applications/utils/searxng
                      - docker.io/searxng/searxng

                      # applications/utils/thelounge
                      - ghcr.io/thelounge/thelounge
