# Exceptions:
# - forgejo: GPG signatures on release binaries only, no container image signing
# - searxng: not signed
# - lldap: not signed
# - velero: not signed (donated to CNCF velero-io org in 2026, no cosign signing implemented)
# - falcoctl: signed but uses OCI-referrer-only format (no .sig tag); Kyverno 3.8.x looks for .sig tag
#   and reports "no signatures found". Other falcosecurity images (falco, falcosidekick, falcosidekick-ui)
#   have .sig tags and verify correctly.
# - grafana/alloy: not signed on Docker Hub
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/description: Verify Sigstore keyless signatures on images to ensure images originate from their official CI pipelines.
spec:
  background: true
  rules:
    - name: verify-sebastka-images
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['ghcr.io/sebastka/*']
          failureAction: Audit  # Enforce
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/sebastka/containers/.github/workflows/*'
                    issuer: https://token.actions.githubusercontent.com
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-cilium
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['quay.io/cilium/*']
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/cilium/cilium/.github/workflows/*'
                    issuer: 'https://token.actions.githubusercontent.com'
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-argocd
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['quay.io/argoproj/*', 'quay.io/argoprojlabs/*']
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/argoproj/argo-cd/.github/workflows/*'
                    issuer: 'https://token.actions.githubusercontent.com'
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-kyverno
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['docker.io/kyverno/*', 'ghcr.io/kyverno/*']
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/kyverno/kyverno/.github/workflows/*'
                    issuer: https://token.actions.githubusercontent.com
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-cloudnative-pg
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['ghcr.io/cloudnative-pg/*']
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/cloudnative-pg/cloudnative-pg/.github/workflows/*'
                    issuer: https://token.actions.githubusercontent.com
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-spire
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['ghcr.io/spiffe/*']
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/spiffe/spire/.github/workflows/*'
                    issuer: https://token.actions.githubusercontent.com
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-reloader
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: [ghcr.io/stakater/reloader]
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/stakater/Reloader/.github/workflows/*'
                    issuer: https://token.actions.githubusercontent.com
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-authelia
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: [docker.io/authelia/authelia]
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/authelia/authelia/.github/workflows/*'
                    issuer: https://token.actions.githubusercontent.com
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-dex
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: [ghcr.io/dexidp/dex]
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: 'https://github.com/dexidp/dex/.github/workflows/*'
                    issuer: https://token.actions.githubusercontent.com
                    rekor: {url: https://rekor.sigstore.dev}
    - name: verify-minio
      match: {any: [resources: {kinds: [Pod]}]}
      verifyImages:
        - imageReferences: ['quay.io/minio/*']
          failureAction: Audit
          mutateDigest: false
