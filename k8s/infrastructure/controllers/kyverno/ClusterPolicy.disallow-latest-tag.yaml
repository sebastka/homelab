---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  background: true
  rules:
    - name: require-image-tag
      match: {any: [resources: {kinds: [Pod]}]}
      exclude: {any: [resources: {namespaceSelector: {matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [kube-system, kube-node-lease, kube-public, kyverno, envoy-gateway-system, cilium-spire, cilium-secrets]}]}}]}
      validate:
        failureAction: Audit
        message: "All container images must use an explicit tag: not ':latest' and not untagged."
        foreach:
          - list: "request.object.spec.[containers, initContainers][]"
            deny:
              conditions:
                any:
                  - {key: "{{ element.image }}", operator: Equals, value: '*:latest'}
                  - {key: "{{ regex_match('^[^:]+$', element.image) }}", operator: Equals, value: true}
