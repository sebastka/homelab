---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/description: Require all container images to use an explicit, versioned tag. Images using ':latest' or no tag are rejected to ensure reproducible deployments.
spec:
  background: true
  rules:
    - name: require-image-tag
      match: {any: [resources: {kinds: [Pod]}]}
      exclude: {any: [resources: {namespaceSelector: {matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [kube-system, kube-node-lease, kube-public]}]}}]}
      validate:
        failureAction: Audit
        message: "All container images must use an explicit tag: not ':latest' and not untagged."
        foreach:
          - list: "request.object.spec.[containers, initContainers][]"
            preconditions:
              all:
                - {key: "{{ element.image }}", operator: NotEquals, value: docker.io/dyc3/opentogethertube:latest}
            deny:
              conditions:
                any:
                  - {key: "{{ element.image }}", operator: Equals, value: '*:latest'}
                  - {key: "{{ regex_match('^[^:]+$', element.image) }}", operator: Equals, value: true}
