---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: controllers
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/sebastka/homelab.git
  destinations:
    - namespace: argocd
      server: '*'
    - namespace: kube-system
      server: '*'
    - name: security-profiles-operator
      server: '*'
    - namespace: sealed-secrets
      server: '*'
    - namespace: databases-backup
      server: '*'
    - namespace: cert-manager
      server: '*'
    - namespace: node-feature-discovery
      server: '*'
    - namespace: intel-device-plugins
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
