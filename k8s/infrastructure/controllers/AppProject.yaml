---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: controllers
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/sebastka/homelab.git
    - ghcr.io/argoproj
  destinations:
    - namespace: argocd
      server: '*'
    - namespace: kube-system
      server: '*'
    - namespace: cert-manager
      server: '*'
    - namespace: portainer
      server: '*'
    - namespace: node-feature-discovery
      server: '*'
    - namespace: 'intel-device-plugins'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
