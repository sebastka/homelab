---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: controllers
  namespace: argocd
spec:
  sourceRepos: [https://github.com/sebastka/homelab.git]
  destinations:
    - {namespace: fallback,             name: talmox}
    - {namespace: argocd,               name: talmox}
    - {namespace: kube-system,          name: talmox}
    - {namespace: cert-manager,         name: talmox}
    - {namespace: crowdsec,             name: talmox}
    - {namespace: falco,                name: talmox}
    - {namespace: intel-device-plugins, name: talmox}
    - {namespace: kyverno,              name: talmox}
    - {namespace: nfd,                  name: talmox}
    - {namespace: reloader,             name: talmox}
    - {namespace: sealed-secrets,       name: talmox}
    - {namespace: trivy,                name: talmox}
  clusterResourceWhitelist:
    - {group: '*', kind: '*'}
