---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nfd

resources:
  - Namespace.yaml
  - CiliumNetworkPolicy.master.yaml
  - CiliumNetworkPolicy.worker.yaml
  - CiliumNetworkPolicy.gc.yaml

# https://github.com/kubernetes-sigs/node-feature-discovery
helmCharts:
  - name: node-feature-discovery
    repo: oci://registry.k8s.io/nfd/charts
    version: 0.18.3  # renovate: datasource=github-releases depName=kubernetes-sigs/node-feature-discovery
    releaseName: node-feature-discovery
    includeCRDs: true
    namespace: nfd
    valuesFile: values.yaml
