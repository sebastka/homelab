---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nfd

resources:
  - Namespace.yaml
  - https://raw.githubusercontent.com/intel/intel-device-plugins-for-kubernetes/refs/heads/release-0.35/deployments/nfd/overlays/node-feature-rules/node-feature-rules.yaml

# https://github.com/kubernetes-sigs/node-feature-discovery
helmCharts:
  - name: node-feature-discovery
    repo: oci://registry.k8s.io/nfd/charts
    version: 0.18.3  # renovate: github-releases=kubernetes-sigs/node-feature-discovery
    releaseName: node-feature-discovery
    includeCRDs: true
    namespace: nfd
    valuesFile: values.yaml
