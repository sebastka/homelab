---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crowdsec

components:
  - ../../../../common/images

patches:
  # Fix missing namespace in resources created by the helm chart
  - target:
      kind: (DaemonSet|Deployment|Service|ConfigMap|Secret|ServiceAccount|Job)
    patch: |
      - {op: add, path: /metadata/namespace, value: crowdsec}
  # Mount ntfy notification plugin into LAPI
  - target: {kind: Deployment, name: crowdsec-lapi}
    patch: |
      - op: add
        path: /spec/template/spec/volumes/-
        value: {name: crowdsec-notifications-ntfy, configMap: {name: crowdsec-notifications-ntfy}}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: crowdsec-notifications-ntfy, mountPath: /etc/crowdsec_data/notifications/http_ntfy.yaml, subPath: http_ntfy.yaml, readOnly: true}
  - target: {kind: Pod, name: 'crowdsec-test-.*'}
    patch: |
      # Fix missing namespace and add securityContext to test pod
      - op: add
        path: /metadata/namespace
        value: crowdsec
      # Add securityContext to test pod to ensure it can run in the cluster
      - op: add
        path: /spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
          seccompProfile: {type: RuntimeDefault}
      # Add securityContext to test pod containers to ensure they can run in the cluster
      - op: add
        path: /spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}

images:
  - {name: crowdsecurity/crowdsec, newName: docker.io/crowdsecurity/crowdsec}
  - {name: curlimages/curl, newName: docker.io/alpine/curl, newTag: 8.19.0, digest: sha256:23b60dc412cd453aba2841da0ee8bc6ad8da32263c557fcc9eccd52840f4ca43}

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {namespace: crowdsec, name: crowdsec-notifications-ntfy, files: [http_ntfy.yaml=assets/http_ntfy.yaml]}

resources:
  - Namespace.yaml
  - PersistentVolumeClaim.yaml
  - SealedSecret.crowdsec-secrets.yaml
  - CiliumNetworkPolicy.yaml
  - GrafanaDashboard.yaml

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.0
    releaseName: crowdsec
    namespace: crowdsec
    includeCRDs: true
    valuesFile: values.yaml
