# LAPI for cscli on the LAN and tailnet (internal gateway): login, decisions, alerts.
# Machine registration (POST /v1/watchers) is refused here: through the gateway, every request
# comes from an Envoy pod, inside auto_registration's allowed_ranges (10.244.0.0/16). Machines are
# added with `cscli machines add` in the LAPI pod instead.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lapi
  namespace: crowdsec
spec:
  parentRefs:
    - {namespace: gateway, name: internal, sectionName: https-wc-talmox-hera-home-karlsen-fr}
  hostnames: [crowdsec-lapi.talmox.hera.home.karlsen.fr]
  rules:
    - {matches: [path: {type: Exact, value: /v1/watchers}], filters: [{type: ExtensionRef, extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: deny-registration}}]}
    - {matches: [path: {type: PathPrefix, value: /}], backendRefs: [{name: crowdsec-service, kind: Service, port: 8080}]}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: deny-registration
  namespace: crowdsec
spec:
  directResponse:
    statusCode: 403
    contentType: text/plain
    body: {type: Inline, inline: "Machine registration is not available through this route.\n"}
