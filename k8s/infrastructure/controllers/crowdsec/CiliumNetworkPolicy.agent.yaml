# ---
# apiVersion: cilium.io/v2
# kind: CiliumNetworkPolicy
# metadata:
#   name: allow-crowdsec-agent-ingress
#   namespace: crowdsec
# spec:
#   endpointSelector: {matchLabels: {k8s-app: crowdsec, type: agent}}
#   ingress:
#     - {fromEntities: [host], toPorts: [ports: [{port: '8082', protocol: TCP}]]}  # Host probes
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-crowdsec-agent-egress
  namespace: crowdsec
spec:
  endpointSelector: {matchLabels: {k8s-app: crowdsec, type: agent}}
  egress:
    - {toEntities: [cluster], toPorts: [ports: [{port: '8080', protocol: TCP}]]}  # LAPI (cluster entity covers pod IPs unresolved by ipcache)
    - {toFQDNs: [{matchPattern: '*.crowdsec.net'}], toPorts: [ports: [{port: '443', protocol: TCP}]]}
