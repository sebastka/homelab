---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: databases-backup-pv
  namespace: databases-backup
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  nfs:
    server: file01.hera.home.karlsen.fr
    path: /mnt/nfs/homelab/databases-backup
