# Create: kubectl create secret --dry-run=client generic -n databases-backups mariadb-secrets -o yaml --from-literal=mariadb-db-csv=XX
# Ksops:
# - Encrypt: sops -e Secret.mariadb-secrets.yaml > Secret.mariadb-secrets.enc.yaml
# - Decrypt: sops -d Secret.mariadb-secrets.enc.yaml > Secret.mariadb-secrets.yaml
# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.mariadb-secrets.yaml >SealedSecret.mariadb-secrets.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mariadb-secrets
  namespace: databases-backup
spec:
  encryptedData:
    mariadb-db-csv: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: mariadb-secrets
      namespace: databases-backup
