---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mariadb-secrets
  namespace: databases-backup
spec:
  encryptedData:
    mariadb-db-csv: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: mariadb-secrets
      namespace: databases-backup
