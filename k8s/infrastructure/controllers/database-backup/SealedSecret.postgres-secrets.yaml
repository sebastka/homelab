# Create: kubectl create secret --dry-run=client generic -n databases-backups postgres-secrets -o yaml --from-literal=postgres-db-csv=XX
# Ksops:
# - Encrypt: sops -e Secret.postgres-secrets.yaml > Secret.postgres-secrets.enc.yaml
# - Decrypt: sops -d Secret.postgres-secrets.enc.yaml > Secret.postgres-secrets.yaml
# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.postgres-secrets.yaml >SealedSecret.postgres-secrets.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secrets
  namespace: databases-backup
spec:
  encryptedData:
    postgres-db-csv: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: postgres-secrets
      namespace: databases-backup
