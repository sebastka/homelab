# Run:
# kubectl -n databases-backup create job --from=cronjob/mariadb-backup mariadb-backup
# kubectl -n databases-backup logs jobs/mariadb-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
  namespace: databases-backup
spec:
  schedule: '0 6 * * *'
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: databases-backup
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: mariadb-backup
              image: mariadb:12.2.2-noble
              command: ['/bin/sh', '-c']
              args:
                - |
                  set -eu
                  echo "$MARIADB_DB_CSV" | sed 1d | sed '/^$/d' | while IFS=, read username password host port database; do
                    filename="${database}.$(date +'%Y-%m-%d--%H-%M-%S')"

                    mariadb-dump --host="$host" --port="$port" --user="$username" --password="$password" "$database" >"/tmp/${filename}.sql"
                    printf -- '%s - Database "%s" dumped to "/tmp/%s.sql"\n' "$(date +'%Y-%m-%d %H:%M:%S')" "$database" "$filename"

                    xz -6 "/tmp/${filename}.sql"
                    printf -- '%s - Dump file "/tmp/%s.sql" xz-compressed\n' "$(date +'%Y-%m-%d %H:%M:%S')" "$filename"

                    rsync "/tmp/${filename}.sql.xz" /mnt/backup/mariadb/
                    printf -- '%s - Dump file "/tmp/%s.sql.xz" moved to backup target. Done\n\n' "$(date +'%Y-%m-%d %H:%M:%S')" "$filename"
                  done
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {memory: 256Mi}
                limits: {memory: 256Mi, cpu: 1}
              envFrom:
                - secretRef: {name: mariadb-secrets}
              volumeMounts:
                - {name: tmp-empty, mountPath: /tmp}
                - {name: backup-target-volume, mountPath: /mnt/backup}
          volumes:
            - {name: tmp-empty, emptyDir: {}}
            - {name: backup-target-volume, persistentVolumeClaim: {claimName: databases-backup-pvc}}
