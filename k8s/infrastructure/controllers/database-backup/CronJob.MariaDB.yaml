# Run:
# kubectl -n databases-backup create job --from=cronjob/mariadb-backup mariadb-backup
# kubectl -n databases-backup logs jobs/mariadb-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
  namespace: databases-backup
spec:
  schedule: '0 2 * * *'
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mariadb-backup
              image: mariadb:latest
              command: ['/bin/sh', '-c']
              args:
                - |
                  set -eu
                  echo "$MARIADB_DB_CSV" | sed 1d | sed '/^$/d' | while IFS=, read username password host port database; do
                    filename="${database}.$(date +'%Y-%m-%d--%H-%M-%S')"

                    mariadb-dump --host="$host" --port="$port" --user="$username" --password="$password" "$database" >"/tmp/${filename}.sql"
                    printf -- '%s - Database "%s" dumped to "/tmp/%s.sql"\n' "$(date +'%Y-%m-%d %H:%M:%S')" "$database" "$filename"

                    xz -6 "/tmp/${filename}.sql"
                    printf -- '%s - Dump file "/tmp/%s.sql" xz-compressed\n' "$(date +'%Y-%m-%d %H:%M:%S')" "$filename"

                    mv "/tmp/${filename}.sql.xz" /mnt/backup/mariadb/
                    printf -- '%s - Dump file "/tmp/%s.sql.xz" moved to backup target. Done\n\n' "$(date +'%Y-%m-%d %H:%M:%S')" "$filename"
                  done
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  # cpu: 50m
                  memory: 256Mi
                limits:
                  # cpu: 50m
                  memory: 256Mi
              env:
                - name: MARIADB_DB_CSV
                  valueFrom:
                    secretKeyRef:
                      name: mariadb-secrets
                      key: mariadb-db-csv
              volumeMounts:
                - name: tmp-empty
                  mountPath: /tmp
                - name: mariadb-backup-target
                  mountPath: /mnt/backup
          volumes:
            - name: tmp-empty
              emptyDir: {}
            - name: mariadb-backup-target
              nfs:
                server: file01.hera.home.karlsen.fr
                path: /mnt/nfs/homelab/databases-backup
