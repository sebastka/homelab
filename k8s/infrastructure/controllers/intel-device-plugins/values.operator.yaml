# yaml-language-server: $schema=
# https://artifacthub.io/packages/helm/intel/intel-device-plugins-operator?modal=values
---

manager:
  devices:
    dsa: false  # Intel Data Streaming accelerator
    gpu: true
    iaa: false  # Intel Analytics accelerator
    qat: false  # Intel QAT adapters
    sgx: false  # Intel Software Guard Extensions

resources:
  requests: {memory: 128Mi}
  limits: {memory: 128Mi, cpu: 1}
