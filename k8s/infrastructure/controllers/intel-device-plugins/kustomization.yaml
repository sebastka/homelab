---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: intel-device-plugins

components:
  - ../../../common/default-networkpolicy

resources:
  - Namespace.yaml
  - CiliumNetworkPolicy.operator.yaml
  - CiliumNetworkPolicy.gpu.yaml

helmCharts:
  - name: intel-device-plugins-operator
    repo: oci://ghcr.io/intel/helm-charts
    version: 0.35.0  # renovate: datasource=github-releases depName=intel/helm-charts
    namespace: intel-device-plugins
    releaseName: intel-device-plugins-operator
    includeCRDs: true
    valuesFile: values.operator.yaml

  - name: intel-device-plugins-gpu
    repo: oci://ghcr.io/intel/helm-charts
    version: 0.35.0  # renovate: datasource=github-releases depName=intel/helm-charts
    namespace: intel-device-plugins
    releaseName: intel-device-plugins-gpu
    includeCRDs: true
    valuesFile: values.gpu.yaml
