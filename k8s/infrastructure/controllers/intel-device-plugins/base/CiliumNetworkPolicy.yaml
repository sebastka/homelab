---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-operator
  namespace: intel-device-plugins
spec:
  endpointSelector: {matchLabels: {control-plane: controller-manager}}
  ingress:
    - {fromEntities: [kube-apiserver], toPorts: [{ports: [{port: '9443', protocol: TCP}]}]}  # Webhook
  egress:
    - {toEntities: [kube-apiserver]}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gpu
  namespace: intel-device-plugins
spec:
  endpointSelector: {matchLabels: {app: intel-gpu-plugin}}
  # ingress: []
  egress:
    - {toEntities: [kube-apiserver]}
