---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: argocd
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: argocd-redis}}
  ingress:
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: argocd, app.kubernetes.io/name: argocd-server}], toPorts: [ports: [{port: '6379', protocol: TCP}]]}
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: argocd, app.kubernetes.io/name: argocd-repo-server}], toPorts: [ports: [{port: '6379', protocol: TCP}]]}
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: argocd, app.kubernetes.io/name: argocd-application-controller}], toPorts: [ports: [{port: '6379', protocol: TCP}]]}
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: argocd, app.kubernetes.io/name: argocd-applicationset-controller}], toPorts: [ports: [{port: '6379', protocol: TCP}]]}
