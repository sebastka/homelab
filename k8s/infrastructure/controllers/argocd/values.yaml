# yaml-language-server: $schema=
# https://artifacthub.io/packages/helm/argo/argo-cd?modal=values
---

global:
  domain: argocd.talmox.hera.home.karlsen.fr
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999

configs:
  cm:
    create: true
    application.resourceTrackingMethod: annotation+label
    admin.enabled: false
    # https://argo-cd.readthedocs.io/en/latest/operator-manual/user-management/zitadel
    url: https://argocd.talmox.hera.home.karlsen.fr
    oidc.config: |
      name: Zitadel
      issuer: https://karlsen-xzy0yv.zitadel.cloud
      redirectURI: https://argocd.talmox.hera.home.karlsen.fr/auth/callback
      clientID: "352479117259590425"
      requestedScopes: ["openid", "profile", "email", "groups"]
      enablePKCEAuthentication: true
      preferredUsernameClaim: preferred_username
      logoutURL: https://karlsen-xzy0yv.zitadel.cloud/oidc/v1/end_session
    kustomize.buildOptions: --enable-helm
  cmp:
    create: true
  params:
    server.insecure: true
    controller.diff.server.side: true
  rbac:
    scopes: '[groups]'
    policy.csv: |
      g, k8s_administrators, role:admin
      g, k8s_users, role:readonly
    policy.default: ''

crds:
  install: true
  keep: false

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      # cpu: 100m
      memory: 512Mi
    limits:
      # cpu: 100m
      memory: 512Mi

dex:
  enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      # cpu: 10m
      memory: 64Mi
    limits:
      # cpu: 10m
      memory: 64Mi

# https://github.com/viaduct-ai/kustomize-sops/issues/300
repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      # cpu: 100m
      memory: 256Mi
    limits:
      # cpu: 100m
      memory: 256Mi
  containerSecurityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    # fsGroup: 999
    # fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: custom-tools
      emptyDir: {}
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
  initContainers:
    - name: install-tools
      image: alpine:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eux
          export KUSTOMIZE_VERSION="5.8.1"
          wget -qO- "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -C /custom-tools -xzf - kustomize
          chmod +x /custom-tools/kustomize
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools

redis:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      # cpu: 100m
      memory: 64Mi
    limits:
      # cpu: 100m
      memory: 64Mi

server:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      # cpu: 50m
      memory: 128Mi
    limits:
      # cpu: 50m
      memory: 128Mi

  httproute:
    enabled: true
    # labels: {}
    # annotations: {}
    parentRefs:
      - name: internal
        namespace: gateway
        sectionName: https-wc-talmox-hera-home-karlsen-fr
    hostnames:
      - argocd.talmox.hera.home.karlsen.fr
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

  # To be fixed
  grpcroute:
    enabled: false
    # labels: {}
    # annotations: {}
    parentRefs:
      - kind: Gateway
        name: internal
        namespace: gateway
        sectionName: https-wc-talmox-hera-home-karlsen-fr
    hostnames:
      - argocd.talmox.hera.home.karlsen.fr
    rules:
      - matches:
          - headers:
              - name: Content-Type
                value: application/grpc

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      # cpu: 50m
      memory: 64Mi
    limits:
      # cpu: 50m
      memory: 64Mi

notifications:
  enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      # cpu: 100m
      memory: 64Mi
    limits:
      # cpu: 1000m
      memory: 64Mi
