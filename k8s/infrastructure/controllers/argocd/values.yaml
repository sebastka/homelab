# yaml-language-server: $schema=
# https://artifacthub.io/packages/helm/argo/argo-cd?modal=values
---

global:
  domain: argocd.talmox.hera.home.karlsen.fr
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999

configs:
  cm:
    create: true
    application.resourceTrackingMethod: annotation+label
    admin.enabled: false
    url: https://argocd.talmox.hera.home.karlsen.fr
    oidc.config: |
      name: Authelia
      issuer: https://auth.karlsen.fr
      clientID: argocd
      clientSecret: $oidc:authelia.clientSecret
      cliClientID: argocd-cli
      enablePKCEAuthentication: true
      requestedScopes: [openid, email, groups, profile]
      enableUserInfoGroups: true
      userInfoPath: /api/oidc/userinfo
    kustomize.buildOptions: --enable-helm
  cmp:
    create: true
  params:
    server.insecure: true
    controller.diff.server.side: true
    applicationsetcontroller.enable.progressive.syncs: "true"
  rbac:
    policy.csv: |
      g, k8s_admins, role:admin
      g, k8s_users, role:readonly
    policy.default: ''

crds:
  install: true
  keep: false

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: {memory: 1024Mi}
    limits: {memory: 1024Mi}

dex:
  enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: {memory: 64Mi}
    limits: {memory: 64Mi}

# https://github.com/viaduct-ai/kustomize-sops/issues/300
repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: {memory: 256Mi}
    limits: {memory: 256Mi}
  containerSecurityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    # fsGroup: 999
    # fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  volumes:
    - {name: custom-tools, emptyDir: {}}
  volumeMounts:
    - {mountPath: /usr/local/bin/kustomize, name: custom-tools, subPath: kustomize}
  initContainers:
    - name: install-tools
      image: alpine:3.23.4
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eux
          export KUSTOMIZE_VERSION="5.8.1"
          wget -qO- "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -C /custom-tools -xzf - kustomize
          chmod +x /custom-tools/kustomize
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools

redis:
  metrics:
    enabled: true
    serviceMonitor: {enabled: true}
  resources:
    requests: {memory: 64Mi}
    limits: {memory: 64Mi}

server:
  metrics:
    enabled: true
    serviceMonitor: {enabled: true}
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 128Mi}

  httproute:
    enabled: true
    # labels: {}
    # annotations: {}
    parentRefs:
      - {namespace: gateway, name: internal, sectionName: https-wc-talmox-hera-home-karlsen-fr}
    hostnames: [argocd.talmox.hera.home.karlsen.fr]
    rules:
      - matches: [path: {type: PathPrefix, value: /}]

  # To be fixed
  grpcroute:
    enabled: false

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 128Mi}

notifications:
  enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  resources:
    requests: {memory: 64Mi}
    limits: {memory: 64Mi}

  notifiers:
    service.webhook.ntfy-sync: |
      url: http://web.ntfy.svc.cluster.local/$ntfy-topic
      headers:
        - {name: Authorization, value: $ntfy-token}
    service.webhook.ntfy-degraded: |
      url: http://web.ntfy.svc.cluster.local/$ntfy-topic
      headers:
        - {name: Authorization, value: $ntfy-token}
    service.webhook.ntfy-restored: |
      url: http://web.ntfy.svc.cluster.local/$ntfy-topic
      headers:
        - {name: Authorization, value: $ntfy-token}

  templates:
    template.app-sync-failed: |
      webhook:
        ntfy-sync:
          method: POST
          headers:
            - {name: X-Title, value: "Sync failed: {{.app.metadata.name}}"}
            - {name: X-Priority, value: high}
            - {name: X-Tags, value: "rotating_light,argocd"}
            - {name: X-Click, value: "{{.context.argocdUrl}}/applications/{{.app.metadata.namespace}}/{{.app.metadata.name}}"}
            - {name: X-Markdown, value: "true"}
          body: |
            **{{.app.metadata.name}}** failed to sync.

            **Message:** {{.app.status.operationState.message}}
            **Repo:** {{.app.spec.source.repoURL}}
    template.app-health-degraded: |
      webhook:
        ntfy-degraded:
          method: POST
          headers:
            - {name: X-Title, value: "Degraded: {{.app.metadata.name}}"}
            - {name: X-Priority, value: high}
            - {name: X-Tags, value: "warning,argocd"}
            - {name: X-Click, value: "{{.context.argocdUrl}}/applications/{{.app.metadata.namespace}}/{{.app.metadata.name}}"}
            - {name: X-Markdown, value: "true"}
          body: |
            **{{.app.metadata.name}}** health is Degraded.
            {{- range .app.status.resources}}
            {{- if eq .health.status "Degraded"}}
            - **{{.kind}}/{{.name}}**: {{.health.message}}
            {{- end}}
            {{- end}}
    template.app-health-restored: |
      webhook:
        ntfy-restored:
          method: POST
          headers:
            - {name: X-Title, value: "Restored: {{.app.metadata.name}}"}
            - {name: X-Priority, value: default}
            - {name: X-Tags, value: "white_check_mark,argocd"}
            - {name: X-Click, value: "{{.context.argocdUrl}}/applications/{{.app.metadata.namespace}}/{{.app.metadata.name}}"}
            - {name: X-Markdown, value: "true"}
          body: |
            **{{.app.metadata.name}}** is back to Healthy.

  triggers:
    trigger.on-sync-failed: |
      - when: app.status.operationState != nil && app.status.operationState.phase in ['Error', 'Failed']
        oncePer: app.status.operationState.syncResult.revision
        send: [app-sync-failed]
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [app-health-degraded]
    trigger.on-health-restored: |
      - when: app.status.health.status == 'Healthy' && app.metadata.annotations["notified.notifications.argoproj.io"] != "" && app.metadata.annotations["notified.notifications.argoproj.io"].contains("on-health-degraded")
        send: [app-health-restored]

  subscriptions:
    - {recipients: [ntfy-sync:argocd], triggers: [on-sync-failed]}
    - {recipients: [ntfy-degraded:argocd], triggers: [on-health-degraded]}
    - {recipients: [ntfy-restored:argocd], triggers: [on-health-restored]}
