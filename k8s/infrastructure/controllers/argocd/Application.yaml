---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: argocd
  source:
    path: .
    repoURL: oci://ghcr.io/argoproj/argo-helm/argo-cd
    targetRevision: 9.4.2
    helm:
      valueFiles:
        - k8s/infrastructure/controllers/argocd/values.yaml
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
