# https://argo-cd.readthedocs.io/en/stable/getting_started/
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

components:
  - ../../../../common/images
  - ../../../../common/valkey

resources:
  - Namespace.yaml
  - GrafanaDashboard.yaml
  - CiliumNetworkPolicy.yaml

helmCharts:
  - name: argo-cd
    repo: oci://ghcr.io/argoproj/argo-helm
    version: 10.6.4
    releaseName: argocd
    namespace: argocd
    includeCRDs: true
    apiVersions: [monitoring.coreos.com/v1]  # Chart guards every ServiceMonitor behind .Capabilities.APIVersions.Has
    valuesFile: values.yaml
