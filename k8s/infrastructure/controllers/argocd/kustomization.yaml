# https://argo-cd.readthedocs.io/en/stable/getting_started/
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: argo-cd
    repo: oci://ghcr.io/argoproj/argo-helm # renovate: github-releases=argoproj/argo-helm
    version: 9.4.4
    releaseName: argocd
    namespace: argocd
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - Namespace.yaml
  - Service.yaml
  - GRPCRoute.yaml
  - GrafanaDashboard.yaml
  - service-monitors/argocd-application-controller.yaml
  - service-monitors/argocd-applicationset-controller.yaml
  - service-monitors/argocd-redis.yaml
  - service-monitors/argocd-repo-server.yaml
  - service-monitors/argocd-server.yaml
