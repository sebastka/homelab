# https://argo-cd.readthedocs.io/en/stable/getting_started/
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

components:
  - ../../../common/images
  - ../../../common/valkey

resources:
  - Namespace.yaml
  - Service.yaml
  - GRPCRoute.yaml
  # - GrafanaDashboard.yaml
  # - service-monitors/argocd-application-controller.yaml
  # - service-monitors/argocd-applicationset-controller.yaml
  # - service-monitors/argocd-redis.yaml
  # - service-monitors/argocd-repo-server.yaml
  # - service-monitors/argocd-server.yaml
  - SealedSecret.cluster-talmox.yaml
  - SealedSecret.oidc.yaml
  - SealedSecret.argocd-notifications-secret.yaml
  - CiliumNetworkPolicy.yaml

# OIDC broken from 9.4.3?
helmCharts:
  - name: argo-cd
    repo: oci://ghcr.io/argoproj/argo-helm
    version: 9.5.15  # renovate: datasource=helm registryUrl=oci://ghcr.io/argoproj/argo-helm depName=argo-cd
    releaseName: argocd
    namespace: argocd
    includeCRDs: true
    valuesFile: values.yaml
