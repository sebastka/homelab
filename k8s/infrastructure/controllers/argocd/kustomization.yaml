# https://argo-cd.readthedocs.io/en/stable/getting_started/
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 9.4.1
    releaseName: argocd
    namespace: argocd
    includeCRDs: true
    valuesFile: values.yaml

resources:
  # - Application.yaml
  - Namespace.yaml
  - Service.yaml
  - GRPCRoute.yaml
