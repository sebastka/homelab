---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trivy

resources:
  - Namespace.yaml
  - CiliumNetworkPolicy.yaml
  - GrafanaDashboard.yaml

# The chart's emptyDir for the server's DB has no size limit.
patches:
  - target: {group: apps, version: v1, kind: StatefulSet, name: trivy-server}
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: trivy-server}
      spec:
        template:
          spec:
            volumes:
              - {name: data, emptyDir: {sizeLimit: 5Gi}}

helmCharts:
  - name: trivy-operator
    repo: https://aquasecurity.github.io/helm-charts  # Charts after 0.32.1 are not pushed to ghcr.io/aquasecurity/helm-charts (OCI)
    version: 0.37.0
    releaseName: trivy-operator
    namespace: trivy
    includeCRDs: true
    valuesFile: values.yaml
