# https://artifacthub.io/packages/helm/cert-manager/cert-manager?modal=values
---

crds:
  enabled: true
  keep: false

config:
  enableGatewayAPI: true

extraArgs:
  - --dns01-recursive-nameservers=8.8.8.8:53,8.8.4.4:53

resources:
  requests:
    # cpu: 10m
    memory: 64Mi
  limits:
    memory: 64Mi
webhook:
  resources:
    requests:
      # cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi
cainjector:
  resources:
    requests:
      # cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi

prometheus:
  enabled: true
  servicemonitor:
    enabled: true
