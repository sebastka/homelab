# Ksops:
# - Encrypt: sops -e Secret.cloudflare-api-token.yaml > Secret.cloudflare-api-token.enc.yaml
# - Decrypt: sops -d Secret.cloudflare-api-token.enc.yaml > Secret.cloudflare-api-token.yaml
# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.cloudflare-api-token.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  template:
    type: Opaque
    metadata:
      name: cloudflare-api-token
      namespace: cert-manager
      annotations:
        kustomize.config.k8s.io/behavior: replace
  encryptedData:
    api-token: 
