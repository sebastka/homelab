---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: cluster-ca-bundle
spec:
  sources:
    - {secret: {name: cluster-root-ca-secret, key: ca.crt}}
    - {useDefaultCAs: true}
  target:
    configMap: {key: cluster-root-ca.crt}
    namespaceSelector:
      matchLabels:
        karlsen.fr/inject-cluster-ca: 'true'
