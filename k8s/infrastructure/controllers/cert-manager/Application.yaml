---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  project: cert-manager
  source:
    path: .
    repoURL: oci://quay.io/jetstack/charts/cert-manager
    targetRevision: 1.19.3
    helm:
      valueFiles:
        - k8s/infrastructure/controllers/cert-manager/values.yaml
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
