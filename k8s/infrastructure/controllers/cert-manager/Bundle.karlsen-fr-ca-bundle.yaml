---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: karlsen-fr-ca-bundle
spec:
  sources: [{secret: {name: trust-domain-root-ca-secret, key: ca.crt}}]
  target:
    secret: {key: karlsen-fr-self-signed-root-ca.crt}
    namespaceSelector:
      matchLabels:
        karlsen.fr/inject-self-signed-root-ca: "true"
