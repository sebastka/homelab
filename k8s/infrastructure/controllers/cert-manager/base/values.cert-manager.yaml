# yaml-language-server: $schema=values.cert-manager.schema.json
# https://artifacthub.io/packages/helm/cert-manager/cert-manager?modal=values
---

crds:
  enabled: true
  keep: true

config:
  enableGatewayAPI: true

extraArgs:
  - --dns01-recursive-nameservers=8.8.8.8:53,8.8.4.4:53

# disableAutoApproval: true
# approveSignerNames:
#   - clusterissuers.cert-manager.io/cloudflare-dns01-issuer

resources:
  requests: {memory: 48Mi}
  limits: {memory: 64Mi}
webhook:
  resources:
    requests: {memory: 48Mi}
    limits: {memory: 64Mi}
cainjector:
  resources:
    requests: {memory: 96Mi}
    limits: {memory: 128Mi}

prometheus:
  enabled: true
  servicemonitor: {enabled: true}
