# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.cloudflare-api-token.yaml >SealedSecret.cloudflare-api-token.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  encryptedData:
    api-token: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: cloudflare-api-token
      namespace: cert-manager
    type: Opaque
