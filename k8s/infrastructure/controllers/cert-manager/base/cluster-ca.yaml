# https://a-cup-of.coffee/blog/spiffe/
# cmctl -n cert-manager approve trust-manager-1
# cmctl -n cert-manager approve cluster-root-ca-1
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-root-ca
  namespace: cert-manager
spec:
  isCA: true
  secretName: cluster-root-ca-secret
  commonName: Karlsen Homelab Cluster Root CA
  # dnsNames: []
  subject: {organizations: [Karlsen], countries: ['NO'], organizationalUnits: [Homelab]}
  # Keep the key on renewal: leaves are not reissued when the CA is, so a new key would break
  # every leaf still signed by the old one (hubble's mTLS did exactly that in 2026-10).
  privateKey: {algorithm: ECDSA, size: 521, rotationPolicy: Never}
  issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: selfsigned-issuer}
  # usages: []
  duration: 87600h  # 10 years: must outlive every leaf it signs (hubble's last a year)
  renewBefore: 8760h
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cluster-root-ca
spec:
  ca: {secretName: cluster-root-ca-secret}
