---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sealed-secrets

components:
  - ../../../common/default-networkpolicy

resources:
  - Namespace.yaml
  # - Secret.certs.yaml
  - CiliumNetworkPolicy.yaml

helmCharts:
  - name: sealed-secrets
    repo: oci://registry-1.docker.io/bitnamicharts
    version: 2.18.1  # renovate: datasource=github-releases depName=bitnami-labs/sealed-secrets
    releaseName: sealed-secrets-controller
    namespace: sealed-secrets
    includeCRDs: true
    valuesFile: values.yaml
