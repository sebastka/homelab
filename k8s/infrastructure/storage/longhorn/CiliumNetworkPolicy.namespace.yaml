---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-longhorn-namespace
  namespace: longhorn-system
spec:
  endpointSelector: {}
  ingress:
    - {fromEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: longhorn-system}}]}
  egress:
    - {toEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: longhorn-system}}]}
    - {toEntities: [kube-apiserver]}
    - {toCIDR: [192.168.1.20/32], toPorts: [ports: [{port: '2049', protocol: TCP}]]}  # NFS backup/restore target (file01)
