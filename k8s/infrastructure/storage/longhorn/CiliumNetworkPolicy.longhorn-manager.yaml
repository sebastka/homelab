---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-longhorn-manager-ingress
  namespace: longhorn-system
spec:
  endpointSelector: {matchLabels: {app: longhorn-manager}}
  ingress:
    - {fromEntities: [host], toPorts: [ports: [{port: '9502', protocol: TCP}]]}  # Readiness probe
    - {fromEntities: [kube-apiserver], toPorts: [ports: [{port: '9502', protocol: TCP}, {port: '9503', protocol: TCP}]]}  # Admission webhook, recovery backend
