# yaml-language-server: $schema=
# https://github.com/longhorn/charts/blob/v1.11.x/charts/longhorn/values.yaml
# https://joshrnoll.com/installing-longhorn-on-talos-with-helm/
# https://www.johanneskueber.com/posts/longhorn_uservolumes_talos/
---
# values.yaml
defaultSettings:
  defaultReplicaCount: 2
  defaultDataLocality: best-effort
  defaultDataPath: /var/mnt/longhorn-data
  allowCollectingLonghornUsageMetrics: false
  upgradeChecker: false
  replicaAutoBalance: best-effort
  systemManagedCSIComponentsResourceLimits: '{"csi-attacher":{"requests":{"memory":"128Mi"},"limits":{"memory":"128Mi"}},"csi-provisioner":{"requests":{"memory":"128Mi"},"limits":{"memory":"128Mi"}},"csi-resizer":{"requests":{"memory":"128Mi"},"limits":{"memory":"128Mi"}},"csi-snapshotter":{"requests":{"memory":"128Mi"},"limits":{"memory":"128Mi"}},"longhorn-csi-plugin":{"requests":{"memory":"128Mi"},"limits":{"memory":"128Mi"}},"node-driver-registrar":{"requests":{"memory":"128Mi"},"limits":{"memory":"128Mi"}},"longhorn-liveness-probe":{"requests":{"memory":"128Mi"},"limits":{"memory":"128Mi"}}}'

longhornManager:
  resources:
    requests:
      # cpu: 100m
      memory: 1024Mi
    limits:
      # cpu: 500m
      memory: 1024Mi

persistence:
  reclaimPolicy: Retain
  defaultClassReplicaCount: 2
  defaultDataLocality: best-effort

# https://github.com/longhorn/longhorn/issues/8707
preUpgradeChecker:
  jobEnabled: false
  upgradeVersionCheck: false

# Longhorn 11.0 memory leak hotfix
# https://github.com/longhorn/longhorn/issues/12573#issuecomment-3917732660
image:
  longhorn:
    manager:
      tag: v1.11.0-hotfix-1
    instanceManager:
      tag: v1.11.0-hotfix-1
upgradeCheck:
  enabled: false
