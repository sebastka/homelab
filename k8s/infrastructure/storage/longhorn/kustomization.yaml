---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system

resources:
  - Namespace.yaml
  - HTTPRoute.yaml
  - SealedSecret.longhorn-crypto.yaml
  - StorageClass.longhorn-encrypted.yaml
  - VolumeSnapshotClass.yaml
  # - BackupTarget.yaml
  - RecurringJob.yaml
  # - GrafanaDashboard.control-plane.yaml
  # - GrafanaDashboard.data-plane.yaml
  - CiliumNetworkPolicy.namespace.yaml
  - CiliumNetworkPolicy.longhorn-manager.yaml
  - CiliumNetworkPolicy.longhorn-ui.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.11.2  # renovate: datasource=github-releases depName=longhorn/charts
    releaseName: longhorn
    namespace: longhorn-system
    includeCRDs: true
    valuesFile: values.yaml
