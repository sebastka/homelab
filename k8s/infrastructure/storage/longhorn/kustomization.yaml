---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - Namespace.yaml
  - HTTPRoute.yaml
  - BackupTarget.yaml
  - RecurringJob.yaml
  - GrafanaDashboard.control-plane.yaml
  - GrafanaDashboard.data-plane.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.11.0
    releaseName: longhorn
    namespace: longhorn-system
    includeCRDs: true
    valuesFile: values.yaml
