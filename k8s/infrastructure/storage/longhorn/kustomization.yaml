---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system

resources:
  - Namespace.yaml
  - HTTPRoute.yaml
  - SealedSecret.longhorn-crypto.yaml
  - StorageClass.longhorn-encrypted.yaml
  # - BackupTarget.yaml
  - Setting.yaml
  - RecurringJob.yaml
  - NetworkPolicy.yaml
  # - GrafanaDashboard.control-plane.yaml
  # - GrafanaDashboard.data-plane.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.11.1  # renovate: github-releases=longhorn/charts
    releaseName: longhorn
    namespace: longhorn-system
    includeCRDs: true
    valuesFile: values.yaml
