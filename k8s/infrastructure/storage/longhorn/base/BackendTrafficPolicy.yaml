# No time limit on a response (the gateway's default is 30s, until the last byte): the UI's WebSockets stay open as long as the page.
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: websocket-timeout
  namespace: longhorn-system
spec:
  mergeType: StrategicMerge  # Keeps the rest of the gateway's policy (the public one's per-route rate limit)
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: longhorn-httproute}
  timeout: {http: {requestTimeout: 0s, maxStreamDuration: 0s}}
