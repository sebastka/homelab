---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system

resources:
  - Namespace.yaml
  - HTTPRoute.yaml
  - SealedSecret.longhorn-crypto.yaml
  - StorageClass.longhorn-encrypted.yaml
  - VolumeSnapshotClass.yaml
  # - BackupTarget.yaml
  - RecurringJob.yaml
  # - GrafanaDashboard.control-plane.yaml
  # - GrafanaDashboard.data-plane.yaml
  - CiliumNetworkPolicy.yaml

patches:
  - target:
      kind: Deployment
      name: longhorn-ui
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: longhorn-ui
      spec:
        template:
          spec:
            containers:
              - name: longhorn-ui
                resources:
                  requests: {memory: 64Mi}
                  limits: {memory: 128Mi}

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.11.2  # renovate: datasource=helm registryUrl=https://charts.longhorn.io depName=longhorn
    releaseName: longhorn
    namespace: longhorn-system
    includeCRDs: true
    valuesFile: values.yaml
