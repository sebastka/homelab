# https://longhorn.io/docs/archives/1.3.0/advanced-resources/security/volume-encryption/
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-encrypted
parameters:
  backupTargetName: nfs-backup-target
  dataEngine: v1
  data-locality: best-effort
  encrypted: 'true'
  fromBackup: ''
  fsType: ext4
  numberOfReplicas: '2'
  staleReplicaTimeout: '30'
  # Reference the encryption secret for provisioning (volume creation)
  csi.storage.k8s.io/provisioner-secret-name: longhorn-crypto
  csi.storage.k8s.io/provisioner-secret-namespace: longhorn-system
  # Reference the encryption secret for staging (node operations)
  csi.storage.k8s.io/node-stage-secret-name: longhorn-crypto
  csi.storage.k8s.io/node-stage-secret-namespace: longhorn-system
  # Reference the encryption secret for publishing (pod mount operations)
  csi.storage.k8s.io/node-publish-secret-name: longhorn-crypto
  csi.storage.k8s.io/node-publish-secret-namespace: longhorn-system
allowVolumeExpansion: true
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
