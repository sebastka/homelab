---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: storage
  namespace: argocd
spec:
  sourceRepos: [https://github.com/sebastka/homelab.git]
  destinations:
    - {namespace: argocd, server: 'https://kubernetes.default.svc'}
    - {namespace: kube-system, server: 'https://kubernetes.default.svc'}
    - {namespace: longhorn-system, server: 'https://kubernetes.default.svc'}
    - {namespace: velero, server: 'https://kubernetes.default.svc'}
  clusterResourceWhitelist:
    - {group: '*', kind: '*'}
