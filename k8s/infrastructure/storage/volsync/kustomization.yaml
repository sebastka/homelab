---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: volsync-system

resources:
  - Namespace.yaml

helmCharts:
  - name: volsync
    repo: https://backube.github.io/helm-charts/
    version: 0.15.0  # renovate: github-releases=backube/helm-charts
    releaseName: volsync
    namespace: volsync-system
    includeCRDs: true
    valuesFile: values.yaml
