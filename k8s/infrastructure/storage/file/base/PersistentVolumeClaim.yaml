---
# Test data disk: btrfs labelled samsung_storage (formatted once from the VM), as file01's Samsung 9100 PRO will be
# when it is passed through. Never pruned or deleted by Argo.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-data
  namespace: file
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Block
  storageClassName: longhorn-encrypted
  resources:
    requests: {storage: 20Gi}
