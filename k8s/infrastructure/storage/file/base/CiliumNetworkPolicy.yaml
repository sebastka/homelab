---
# The VM (its virt-launcher pod), as its own nftables firewall (nixos: hosts/file/firewall.nix).
# The kubelet's NFS mounts come from the nodes (host, remote-node), which fromCIDR does not cover.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-file
  namespace: file
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: file}}
  ingress:
    - {fromCIDR: [192.168.0.0/24], toPorts: [ports: [{port: '22', protocol: TCP}]]}  # SSH: desktops
    - {fromCIDR: [192.168.0.0/16], toPorts: [ports: [{port: '2049', protocol: TCP}]]}  # NFS: the LAN
    - {fromEntities: [host, remote-node], toPorts: [ports: [{port: '2049', protocol: TCP}]]}  # NFS: kubelet mounts (PVs)
    - {fromEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: zabbix, app.kubernetes.io/name: zabbix-server}}], toPorts: [ports: [{port: '10050', protocol: TCP}]]}  # Zabbix passive checks
    - {fromEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: kubevirt, kubevirt.io: virt-api}}]}
  egress:
    - {toEntities: [world], toPorts: [ports: [{port: '443', protocol: TCP}, {port: '80', protocol: TCP}]]}  # Upgrades: GitHub, cache.nixos.org
    - {toEntities: [world], toPorts: [ports: [{port: '123', protocol: UDP}]]}  # NTP
    - {toEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}}], toPorts: [ports: [{port: '10443', protocol: TCP}]]}  # Attic (attic.karlsen.app), through the gateway
    - {toEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: zabbix, app.kubernetes.io/name: zabbix-server}}], toPorts: [ports: [{port: '10051', protocol: TCP}]]}  # Zabbix active checks
---
# CDI's upload server, while the root disk's image is uploaded
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cdi-upload
  namespace: file
spec:
  endpointSelector: {matchLabels: {cdi.kubevirt.io: cdi-upload-server}}
  ingress:
    - {fromEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: cdi, cdi.kubevirt.io: cdi-uploadproxy}}], toPorts: [ports: [{port: '8443', protocol: TCP}]]}
    - {fromEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: cdi, cdi.kubevirt.io: cdi-deployment}}], toPorts: [ports: [{port: '8443', protocol: TCP}]]}  # Progress
  # egress: []
