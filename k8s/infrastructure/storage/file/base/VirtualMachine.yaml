---
# The NFS server (NixOS: github.com/sebastka/nixos, hosts/file), replacing file01 (Proxmox VM on hera).
# Its root disk is a separate resource (DataVolume.yaml), so deleting or recreating the VM never takes it with it.
# Its data is hera's Samsung 9100 PRO itself, passed through: the VM only ever runs on hera.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: file
  namespace: file
spec:
  runStrategy: Always  # Waits for the root disk's upload on first start
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: file
        app.kubernetes.io/managed-by: kustomize
    spec:
      terminationGracePeriodSeconds: 180  # ACPI shutdown: NFS clients and btrfs flushed
      # Where the 9100 PRO is. Its host device resource would place it there anyway; this states it, and keeps the VM
      # Pending rather than anywhere else while hera is away.
      nodeSelector: {kubernetes.io/hostname: hera}
      domain:
        cpu: {cores: 2}
        memory: {guest: 4Gi}
        machine: {type: q35}
        devices:
          disks:
            - {name: root, bootOrder: 1, disk: {bus: virtio}}
          # file01's Samsung 9100 PRO (btrfs, samsung_storage), passed through whole: an NVMe drive in the VM, mounted
          # by its label (hosts/file/nfs.nix). Bound to vfio-pci on hera (talos: node/hera.home.karlsen.fr/03-vfio.yaml),
          # permitted in the KubeVirt resource (controllers/kubevirt).
          hostDevices:
            - {name: data, deviceName: samsung.com/ssd-9100-pro}
          interfaces:
            # Bridge binding: the VM takes its pod's address, so it sees the NFS clients' real addresses (masquerade
            # would show them all as 10.0.2.1). No live migration, which a passed-through disk rules out anyway.
            # No macAddress: the VM must keep its pod's MAC, which Cilium addresses the pod's traffic to; with any other
            # MAC the VM never sees its inbound traffic.
            - {name: default, bridge: {}}
          rng: {}
      networks:
        - {name: default, pod: {}}
      volumes:
        - {name: root, dataVolume: {name: file-root}}
