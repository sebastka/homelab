# yaml-language-server: $schema=https://raw.githubusercontent.com/vmware-tanzu/helm-charts/refs/heads/main/charts/velero/values.schema.json
# https://github.com/vmware-tanzu/helm-charts/blob/main/charts/velero/values.yaml
---


resources:
  requests: {memory: 512Mi}
  limits: {memory: 512Mi}

upgradeJobResources:
  requests: {memory: 128Mi}
  limits: {memory: 128Mi}

podSecurityContext:
  # runAsNonRoot: true
  # runAsUser: 65534
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

metrics:
  enabled: true
  serviceMonitor: {enabled: false}
  prometheusRule: {enabled: false}

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.0
    imagePullPolicy: IfNotPresent
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      readOnlyRootFilesystem: true
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  features: EnableCSI
  defaultSnapshotMoveData: false
  defaultVolumesToFsBackup: false
  # uploaderType: kopia  # Already default
  backupStorageLocation:
    - name: hetzner
      provider: aws
      bucket: sebastka-homelab
      default: true
      credential:
        name: hetzner-s3
        key: cloud
      config:
        region: hel1
        s3Url: https://hel1.your-objectstorage.com
        s3ForcePathStyle: "true"
  volumeSnapshotLocation:
    - name: default
      provider: velero.io/csi

deployNodeAgent: true
nodeAgent:
  disableHostPath: true
  useScratchEmptyDir: true
  resources:
    requests: {memory: 512Mi}
    limits: {memory: 512Mi}
  podSecurityContext:
    # runAsNonRoot: true
    # runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    # readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}
  # extraVolumes:
  #   - {name: tmp-volume, emptyDir: {}}
  #   - {name: nonexistant-volume, emptyDir: {}}  # kopia needs its config dir to be writable. "nonexistant" is the home for user "nobody"
  # extraVolumeMounts:
  #   - {name: tmp-volume, mountPath: /tmp}
  #   - {name: nonexistant-volume, mountPath: /nonexistant}

schedules:
  nightly-hetzner:
    disabled: false
    schedule: 00 4 * * *  # 04:00 UTC / 06:00 CEST
    # useOwnerReferencesInBackup: false
    template:
      ttl: 720h  # 30 days
      storageLocation: hetzner
      snapshotMoveData: true
      includedNamespaces: ['*']
      includedResources: [persistentvolumeclaims]
      labelSelector:
        matchLabels:
          backup.velero.io/nightly-hetzner: enabled
  test-hetzner:
    disabled: false
    schedule: 37 19 * * *
    # useOwnerReferencesInBackup: false
    template:
      ttl: 720h  # 30 days
      storageLocation: hetzner
      snapshotMoveData: true
      includedNamespaces: ['*']
      includedResources: [persistentvolumeclaims]
      labelSelector:
        matchLabels:
          backup.velero.io/nightly-hetzner: enabled
