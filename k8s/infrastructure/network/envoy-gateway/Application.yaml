# https://gateway.envoyproxy.io/v1.6/install/install-argocd/
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  project: envoy-gateway
  source:
    path: .
    repoURL: oci://docker.io/envoyproxy/gateway-helm
    targetRevision: 1.7.0
    helm:
      valueFiles:
        - k8s/infrastructure/network/envoy-gateway/values.yaml
  destination:
    namespace: envoy-gateway-system
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
