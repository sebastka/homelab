---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: default-envoyproxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Cluster
      envoyDeployment:
        pod:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: proxy
                        app.kubernetes.io/managed-by: envoy-gateway
                    topologyKey: kubernetes.io/hostname
  # logging:
  #   level:
  #     default: info  # warn
  # telemetry:
  #   accessLog:
  #     disable: false
  #     # format:
  #     #   type: json
