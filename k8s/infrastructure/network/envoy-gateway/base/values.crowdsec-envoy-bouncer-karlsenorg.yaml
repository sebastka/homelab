# yaml-language-server: $schema=values.crowdsec-envoy-bouncer-karlsenorg.schema.json
# https://github.com/kdwils/envoy-proxy-crowdsec-bouncer/blob/main/charts/envoy-proxy-bouncer/values.yaml
---

fullnameOverride: envoy-proxy-bouncer-karlsenorg

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

resources:
  requests: {memory: 64Mi}
  limits: {cpu: null, memory: 128Mi}  # cpu: null drops the chart's default 100m CPU limit

# https://github.com/kdwils/envoy-proxy-crowdsec-bouncer/blob/main/docs/examples/config/example.yaml
config:
  trustedProxies: ["10.244.0.0/16"]
  bouncer:
    enabled: true
    metrics: true
    lapiURL: http://crowdsec-service.crowdsec.svc.cluster.local:8080
    apiKeySecretRef: {name: crowdsec-secrets, key: bouncer-api-key-karlsenorg}
  waf:
    enabled: true
    appSecURL: http://crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
    apiKeySecretRef: {name: crowdsec-secrets, key: bouncer-api-key-karlsenorg}
  prometheus:
    enabled: true
    serviceMonitor: {enabled: true}
  captcha:
    enabled: true
    provider: turnstile
    siteKey: 0x4AAAAAADU9am0X6mW_Fcqg
    secretKeySecretRef: {name: crowdsec-secrets, key: turnstile-secret-key}
    signingKeySecretRef: {name: crowdsec-secrets, key: captcha-jwt-signing-key-karlsenorg}
    callbackURL: https://captcha.karlsen.org
    cookieDomain: karlsen.org
    cookieName: __Secure-crowdsec_captcha
    secureCookie: true
    disableChallengeReplayProtection: false
  # webhook: {}
  # templates: {}

httproute:
  enabled: true
  parentRefs:
    - {namespace: gateway, name: default, sectionName: https-wc-karlsen-org}
  hostnames: [captcha.karlsen.org]

referenceGrant:
  create: true
  fromNamespaces: [homepage]

grafana:
  dashboard:
    enabled: true
    folder: CrowdSec
