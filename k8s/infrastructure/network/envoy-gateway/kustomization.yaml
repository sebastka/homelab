# https://gateway.envoyproxy.io/docs/troubleshooting/admin-console/#accessing-the-admin-console
# Admin Console:
# - egctl x dashboard eg
# - kubectl port-forward -n envoy-gateway-system deployment/envoy-gateway 19000:19000

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-gateway-system

components:
  - ../../../common/valkey

patches:
  - target: {kind: CiliumNetworkPolicy, name: allow-valkey-ingress}
    patch: |
      - op: replace
        path: /spec/ingress/0/fromEndpoints/0/matchLabels/app.kubernetes.io~1name
        value: envoy-gateway-system

resources:
  - Namespace.yaml
  - EnvoyProxy.yaml
  - GatewayClass.yaml

helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: 1.7.3  # renovate: datasource=github-releases depName=envoyproxy/gateway
    releaseName: envoy-gateway
    namespace: envoy-gateway-system
    includeCRDs: true
    valuesFile: values.yaml
