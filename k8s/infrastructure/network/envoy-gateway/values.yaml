# yaml-language-server: $schema=
# https://artifacthub.io/packages/helm/envoy-gateway/gateway-helm?modal=values
---

deployment:
  envoyGateway:
    resources:
      requests: {memory: 512Mi}
      limits: {memory: 512Mi, cpu: 1}

certgen:
  job:
    resources:
      requests: {memory: 256Mi}
      limits: {memory: 256Mi, cpu: 1}

config:
  envoyGateway:
    rateLimit:
      backend:
        type: Redis
        redis:
          url: valkey:6379
