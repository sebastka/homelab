# https://docs.cilium.io/en/stable/network/lb-ipam/
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-arp-ip-pool
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  blocks:
    - cidr: 192.168.3.0/24
  serviceSelector:
    matchLabels:
      arp.cilium.io/ip-pool: default-arp-ip-pool
