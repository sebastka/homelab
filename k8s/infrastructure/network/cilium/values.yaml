# https://docs.cilium.io/en/latest/installation/k8s-install-helm/
# https://artifacthub.io/packages/helm/cilium/cilium?modal=values
---

cluster:
  name: talmox
  id: 1

kubeProxyReplacement: true

# Talos specific
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

l2announcements:
  enabled: true

ipam:
  mode: kubernetes

gatewayAPI:
  enabled: false  # Use Envoy Gateway instead
#   enableAlpn: true
#   enableAppProtocol: true
#   gatewayClass:
#     create: "true"
# #   hostNetwork:
# #     enabled: true

operator:
  rollOutPods: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Roll out cilium agent pods automatically when configmap is updated.
rollOutCiliumPods: true

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

k8sClientRateLimit:
  qps: 20
  burst: 100

# https://docs.cilium.io/en/stable/operations/performance/tuning/#ebpf-host-routing
# bpf:
#   masquerade: true
#   lbModeAnnotation: true

hubble:
  enabled: false
  # relay:
  #   enabled: true
  #   rollOutPods: true
  # ui:
  #   enabled: true
  #   rollOutPods: true

# -- Grafana dashboards for cilium-agent
dashboards:
  enabled: false
