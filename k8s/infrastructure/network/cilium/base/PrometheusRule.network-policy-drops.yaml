---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: network-policy-drops
  namespace: kube-system
spec:
  groups:
    - name: cilium.drops
      rules:
        - alert: NetworkPolicyDroppingPackets
          expr: |
            label_replace(
              label_replace(
                label_replace(
                  label_replace(
                    sum(rate(hubble_drop_total{reason="POLICY_DENIED"}[2m])) by (source_namespace, source_workload, destination_namespace, destination_workload, destination_ip, destination, direction),
                    "destination_namespace", "external", "destination_namespace", "^$"
                  ),
                  "source_namespace", "external", "source_namespace", "^$"
                ),
                "destination_workload", "unknown", "destination_workload", "^$"
              ),
              "source_workload", "unknown", "source_workload", "^$"
            ) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Network policy dropping {{ $labels.direction }} traffic"
            description: "Cilium is dropping {{ $labels.direction }} packets due to a network policy.\n\nSource: `{{ $labels.source_namespace }}`/`{{ $labels.source_workload }}`\nDestination: `{{ $labels.destination_namespace }}`/`{{ $labels.destination_workload }}`{{ if eq $labels.destination_namespace \"external\" }} (`{{ $labels.destination_ip }}`{{ if $labels.destination }} / `{{ $labels.destination }}`{{ end }}){{ end }}"
