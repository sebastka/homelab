---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../../../common/images

patches:
  - target:
      kind: Namespace
      name: cilium-spire
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cilium-spire
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/audit-version: latest
          pod-security.kubernetes.io/warn: privileged
          pod-security.kubernetes.io/warn-version: latest

resources:
  - CiliumLoadBalancerIPPool.yaml
  - CiliumL2AnnouncementPolicy.yaml
  - CiliumClusterwideNetworkPolicy.mtls.yaml
  - CiliumClusterwideNetworkPolicy.default-deny.yaml
  - VMRule.network-policy-drops.yaml
  - GrafanaDashboard.yaml

helmCharts:
  - name: cilium
    repo: oci://quay.io/cilium/charts
    version: 1.19.4  # renovate: datasource=helm registryUrl=oci://quay.io/cilium/charts depName=cilium
    releaseName: cilium
    namespace: kube-system
    includeCRDs: true
    valuesFile: values.yaml
