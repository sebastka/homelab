---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: network-policy-drops
  namespace: kube-system
spec:
  groups:
    - name: cilium.drops
      rules:
        - alert: NetworkPolicyDroppingPackets
          expr: |
            (
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      sum(rate(hubble_drop_total{reason="POLICY_DENIED"}[2m])) by (cluster, source_namespace, source_workload, destination_namespace, destination_workload, destination_ip, destination, direction),
                      "destination_namespace", "external", "destination_namespace", "^$"
                    ),
                    "source_namespace", "external", "source_namespace", "^$"
                  ),
                  "destination_workload", "unknown", "destination_workload", "^$"
                ),
                "source_workload", "unknown", "source_workload", "^$"
              ) > 0
              * on(destination_ip) group_left(pod)
              label_replace(kube_pod_info, "destination_ip", "$1", "pod_ip", "(.+)")
            )
            or ignoring(pod)
            (
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      sum(rate(hubble_drop_total{reason="POLICY_DENIED"}[2m])) by (cluster, source_namespace, source_workload, destination_namespace, destination_workload, destination_ip, destination, direction),
                      "destination_namespace", "external", "destination_namespace", "^$"
                    ),
                    "source_namespace", "external", "source_namespace", "^$"
                  ),
                  "destination_workload", "unknown", "destination_workload", "^$"
                ),
                "source_workload", "unknown", "source_workload", "^$"
              ) > 0
            )
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Network policy dropping {{ $labels.direction }} traffic"
            description: "Cilium is dropping {{ $labels.direction }} packets due to a network policy.\n\nCluster: `{{ $labels.cluster }}`\nSource: `{{ $labels.source_namespace }}`/`{{ $labels.source_workload }}`\nDestination: `{{ $labels.destination_namespace }}`/`{{ $labels.destination_workload }}`{{ if eq $labels.destination_namespace \"external\" }} (`{{ $labels.destination_ip }}`{{ if $labels.pod }} / pod `{{ $labels.pod }}`{{ end }}{{ if $labels.destination }} / `{{ $labels.destination }}`{{ end }}){{ end }}"
