# yaml-language-server: $schema=https://raw.githubusercontent.com/cilium/cilium/v1.19.1/install/kubernetes/cilium/values.schema.json
# https://artifacthub.io/packages/helm/cilium/cilium?modal=values
# https://github.com/cilium/cilium/tree/main/install/kubernetes/cilium
---

# cluster: {id: 1, name: XXX}  # Set in overlay

# Talos specific
kubeProxyReplacement: true
k8sServiceHost: localhost  # When kubeProxyReplacement=true
k8sServicePort: 7445  # When kubeProxyReplacement=true
ipam:
  mode: kubernetes  # https://docs.cilium.io/en/stable/network/concepts/ipam/
  multiPoolPreAllocation: ""
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: false
    resources:
      requests: {memory: 128Mi}
      limits: {memory: 128Mi}
  hostRoot: /sys/fs/cgroup

operator:
  rollOutPods: true
  prometheus:
    enabled: false
    metricsService: true
    port: 9963
    serviceMonitor: {enabled: false}
  dashboards:
    enabled: true
  resources:
    requests: {memory: 256Mi}
    limits: {memory: 256Mi}

# Roll out cilium agent pods automatically when ConfigMap is updated.
rollOutCiliumPods: true
resources:
  requests: {memory: 512Mi}
  limits: {memory: 512Mi}

# debug:
#  enabled: true

# https://docs.cilium.io/en/latest/network/bgp-control-plane/bgp-control-plane-v2/
# bgpControlPlane:
#   enabled: true
#   secretsNamespace:
#     name: cilium-secrets

l2announcements:
  enabled: true

# https://docs.cilium.io/en/stable/operations/performance/tuning/#ebpf-host-routing
bpf:
  masquerade: true  # Do not use with Istio Ambient
  lbModeAnnotation: true
  # tproxy: true

# ipMasqAgent:
#   enabled: true

loadBalancer:
  # https://cilium.io/blog/2022/04/12/cilium-standalone-L4LB-XDP/
  # https://cilium.io/blog/2021/05/20/cilium-110/#standalonelb
  standalone: true
  # https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/#maglev-consistent-hashing
  algorithm: maglev
  mode: dsr  # snat
  dsrDispatch: opt
  # acceleration: native
  l7:
    backend: envoy

cni:
  # exclusive: false  # Use with Istio
  resources:
    requests: {memory: 64Mi}
    limits: {memory: 64Mi}

# https://docs.cilium.io/en/stable/network/concepts/routing/
routingMode: native
# ipv4NativeRoutingCIDR: 10.244.0.0/16  # Set in overlay
autoDirectNodeRoutes: true

gatewayAPI:
  enabled: true
  # enableProxyProtocol: true
  enableAlpn: true
  enableAppProtocol: true
  # xffNumTrustedHops: 1
  gatewayClass:
    create: 'true'

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true
  strictMode:
    egress:
      enabled: true
      # cidr: 10.244.0.0/16  # Set in overlay

envoy:
  enabled: true
  prometheus:
    enabled: false
    port: "9964"
    serviceMonitor:
      enabled: false
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy: [NET_ADMIN, PERFMON, BPF]
  resources:
    requests: {memory: 256Mi}
    limits: {memory: 256Mi}

hubble:
  enabled: true
  metrics:
    enabled:
      - dns
      - 'drop:labelsContext=source_namespace,destination_namespace'
      - tcp
      - flow
      - port-distribution
      - icmp
      - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction;sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity"
    enableOpenMetrics: true
    port: 9965
    serviceMonitor: {enabled: false}
    dashboards: {enabled: true}
  relay:
    enabled: true
    rollOutPods: true
    resources:
      requests: {memory: 256Mi}
      limits: {memory: 512Mi}
    prometheus:
      enabled: false
      port: 9966
      serviceMonitor:
        enabled: false
  ui:
    enabled: false
    rollOutPods: true
    backend:
      resources:
        requests: {memory: 256Mi}
        limits: {memory: 256Mi}
    frontend:
      resources:
        requests: {memory: 256Mi}
        limits: {memory: 256Mi}

ingressController:
  enabled: false

k8sClientRateLimit:
  qps: 50
  burst: 100

clustermesh:
  apiserver:
    metrics:
      enabled: true
      port: 9962
      serviceMonitor: {enabled: false}
    resources:
      requests: {memory: 256Mi}
      limits: {memory: 256Mi}
    etcd:
      resources:
        requests: {memory: 256Mi}
        limits: {memory: 256Mi}
    kvstoremesh:
      resources:
        requests: {memory: 256Mi}
        limits: {memory: 256Mi}

# mTLS
authentication:
  enabled: true
  mutual:
    spire:
      enabled: true
      install:
        enabled: true
        server:
          dataStorage:
            enabled: false
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
        agent:
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}

prometheus:
  enabled: false
  metricsService: true
  port: 9962
  serviceMonitor:
    enabled: false
    trustCRDsExist: true

dashboards:
  enabled: true
