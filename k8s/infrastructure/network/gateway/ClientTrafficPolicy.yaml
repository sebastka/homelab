---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: internal-gateway-client-traffic-policy
  namespace: gateway
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: internal}
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: default-gateway-client-traffic-policy
  namespace: gateway
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: default}
  proxyProtocol:
    optional: false
