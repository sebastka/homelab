# https://gateway.envoyproxy.io/docs/tasks/security/restrict-ip-access/
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: envoy-default-security-policy
  namespace: gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default-gateway
  authorization:
    defaultAction: Allow
