---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: karlsen-org-certificate
  namespace: gateway
spec:
  secretName: karlsen-org-certificate
  dnsNames:
    - karlsen.org
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-dns01-issuer
  usages:
    - digital signature
    - key encipherment
