---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: karlsen-org-certificate
  namespace: gateway
spec:
  commonName: karlsen.org
  dnsNames:
    - karlsen.org
    - '*.karlsen.org'
  issuerRef:
    kind: Issuer
    name: cloudflare-dns01-issuer
  secretName: karlsen-org-certificate
