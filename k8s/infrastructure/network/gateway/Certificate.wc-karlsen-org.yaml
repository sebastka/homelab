---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wc-karlsen-org-certificate
  namespace: gateway
spec:
  secretName: wc-karlsen-org-certificate
  dnsNames:
    - '*.karlsen.org'
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-dns01-issuer
  usages:
    - digital signature
    - key encipherment
