---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: karlsen-fr-certificate
  namespace: gateway
spec:
  secretName: karlsen-fr-certificate
  dnsNames:
    - karlsen.fr
    - '*.karlsen.fr'
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-dns01-issuer
  usages:
    - digital signature
    - key encipherment
