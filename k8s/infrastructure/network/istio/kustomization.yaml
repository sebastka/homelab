---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: istio-system

helmCharts:
  - name: base
    repo: oci://gcr.io/istio-release/charts/
    version: 1.29.1  # renovate: github-releases=istio/istio
    releaseName: istio-base
    namespace: istio-system
    includeCRDs: true
    valuesFile: values.istio-base.yaml

  - name: istiod
    repo: oci://gcr.io/istio-release/charts/
    version: 1.29.1  # renovate: github-releases=istio/istio
    releaseName: istiod
    namespace: istio-system
    includeCRDs: true
    valuesFile: values.istiod.yaml

  - name: cni
    repo: oci://gcr.io/istio-release/charts/
    version: 1.29.1  # renovate: github-releases=istio/istio
    releaseName: istio-cni
    namespace: istio-system
    includeCRDs: true
    valuesFile: values.istio-cni.yaml

  - name: ztunnel
    repo: oci://gcr.io/istio-release/charts/
    version: 1.29.1  # renovate: github-releases=istio/istio
    releaseName: ztunnel
    namespace: istio-system
    includeCRDs: true
    valuesFile: values.ztunnel.yaml

resources:
  - Namespace.yaml
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.0/experimental-install.yaml
