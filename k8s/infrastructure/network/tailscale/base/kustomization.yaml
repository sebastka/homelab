---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailscale

resources:
  - Namespace.yaml
  - SealedSecret.operator-oauth.yaml
  - Connector.yaml

helmCharts:
  - name: tailscale-operator
    repo: https://pkgs.tailscale.com/helmcharts
    version: 1.102.3
    releaseName: tailscale
    namespace: tailscale
    includeCRDs: true
    valuesFile: values.yaml
