---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postgres

components:
  - ../../../../../common/dbdump2s3  # Nightly encrypted dumps to S3

resources:
  - ../../base
  - PersistentVolumeClaim.yaml
  - SealedSecret.postgres-superuser.yaml  # POSTGRES_PASSWORD (and password): only read on first start
  - SealedSecret.postgres-users.yaml      # One key per role in assets/users.csv
  - SealedSecret.dbdump2s3-s3.yaml        # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY for the backup bucket

configMapGenerator:
  - name: dbdump2s3-env
    literals: [DUMP_KIND=postgres, DB_HOST=postgres]
  - name: postgres-users-databases
    files: [databases.csv=assets/databases.csv, users.csv=assets/users.csv]

patches:
  # The backup reads the same CSVs and passwords as the ensure-databases Job
  - target: {kind: CronJob, name: db-backup}
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata: {name: db-backup}
      spec:
        schedule: '0 4 * * *'  # After mariadb's, so the two do not upload at the same time
        jobTemplate: {spec: {template: {spec: {volumes: [
          {name: users-databases-volume, configMap: {name: postgres-users-databases}},
          {name: passwords-volume, secret: {secretName: postgres-users}}
        ]}}}}
