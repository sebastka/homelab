# The data directory. Create the Longhorn volume postgres-data-pv (longhorn-encrypted) before the
# first sync. Longhorn snapshots and Velero copies of a running database are crash-consistent, which
# PostgreSQL recovers from (WAL replay); the nightly logical dumps (dbdump2s3) are the portable
# copy.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: postgres
  labels:
    app.kubernetes.io/name: postgres
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/group1: enabled
    backup.velero.io/nightly-hetzner: enabled
spec:
  accessModes: [ReadWriteOncePod]
  resources: {requests: {storage: 30Gi}}
  storageClassName: longhorn-encrypted
  volumeName: postgres-data-pv
