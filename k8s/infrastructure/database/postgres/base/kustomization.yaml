---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postgres

components:
  - ../../../../common/images

# The script only. The database and user lists live in the overlay: they are authoritative, and
# ensure-databases.sh DROPS whatever they do not list, so a base able to generate an empty one
# would be a base able to drop every database.
configMapGenerator:
  - {name: postgres-scripts, files: [ensure-databases.sh=assets/ensure-databases.sh]}

resources:
  - Namespace.yaml
  - ServiceAccount.yaml
  - Deployment.yaml
  - Service.yaml
  - CiliumNetworkPolicy.yaml
  - Job.ensure-databases.yaml
