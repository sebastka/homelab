# Run:
# kubectl -n databases-backup create job --from=cronjob/postgres-backup postgres-backup
# kubectl -n databases-backup logs jobs/postgres-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: databases-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
spec:
  schedule: '0 3 * * *'  # 03:00 UTC = 04:00 CET
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Replace
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-backup
        app.kubernetes.io/component: backup
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: postgres-backup
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: postgres-backup
              image: docker.io/library/postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
              command: ['/bin/ash', '-c']
              args:
                - |
                  set -eu
                  echo "$POSTGRES_DB_CSV" | sed 1d | grep -v '^#' | sed '/^$/d' | while IFS=, read username password host port database; do
                    filename="${database}.$(date +'%Y-%m-%d--%H-%M-%S')"

                    export PGPASSWORD="$password"
                    pg_dump --host="$host" --port="$port" --username="$username" --format=custom --file="/mnt/backup/postgres/${filename}.dump" "$database"
                    printf -- '%s - Database "%s" dumped to "/mnt/backup/postgres/%s.dump". Done\n\n' "$(date +'%Y-%m-%d %H:%M:%S')" "$database" "$filename"
                  done
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {memory: 256Mi}
                limits: {memory: 256Mi}
              envFrom:
                - secretRef: {name: postgres-secrets}
              volumeMounts:
                - {name: tmp-empty, mountPath: /tmp}
                - {name: backup-target-volume, mountPath: /mnt/backup}
          volumes:
            - {name: tmp-empty, emptyDir: {}}
            - {name: backup-target-volume, persistentVolumeClaim: {claimName: databases-backup-pvc}}
