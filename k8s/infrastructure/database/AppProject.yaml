---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: database
  namespace: argocd
spec:
  sourceRepos: [git@github.com:sebastka/homelab.git]
  destinations:
    - { namespace: default, name: talmox }
    - { namespace: mariadb, name: talmox }
    - { namespace: postgres, name: talmox }
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
