---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: database
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/sebastka/homelab.git
  destinations:
    - namespace: argocd
      server: '*'
    - namespace: cnpg-system
      server: '*'
    - namespace: cnpg-database
      server: '*'
    - namespace: databases-backup
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
