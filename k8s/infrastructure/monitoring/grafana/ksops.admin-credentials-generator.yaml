# Encrypt: sops -e Secret.admin-credentials.yaml > Secret.admin-credentials.enc.yaml
# Decrypt: sops -d Secret.admin-credentials.enc.yaml > Secret.admin-credentials.yaml
---
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: admin-credentials-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - Secret.admin-credentials.enc.yaml
