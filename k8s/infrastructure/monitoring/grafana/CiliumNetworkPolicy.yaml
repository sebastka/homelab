---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: grafana
spec:
  endpointSelector: {matchLabels: {app: grafana}}
  ingress:
    - {fromEntities: [host], toPorts: [ports: [{port: '3000', protocol: TCP}]]}  # Host probes
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}], toPorts: [ports: [{port: '3000', protocol: TCP}]]}  # Envoy Gateway
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: grafana, app.kubernetes.io/name: grafana-operator}], toPorts: [ports: [{port: '3000', protocol: TCP}]]}  # grafana-operator
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-egress
  namespace: grafana
spec:
  endpointSelector: {matchLabels: {app: grafana}}
  egress:
    - {toEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: prometheus}], toPorts: [ports: [{port: '9090', protocol: TCP}]]}  # Prometheus datasource
    - {toEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: alertmanager}], toPorts: [ports: [{port: '9093', protocol: TCP}]]}  # Alertmanager datasource
    - {toEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: loki, app.kubernetes.io/name: loki}}], toPorts: [ports: [{port: '3100', protocol: TCP}]]}  # Loki datasource
    - {toEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}}], toPorts: [ports: [{port: '10443', protocol: TCP}]]}  # Needed for OIDC / Authelia
    - {toFQDNs: [{matchName: grafana.com}, {matchPattern: '*.grafana.com'}], toPorts: [ports: [{port: '443', protocol: TCP}]]}  # Grafana plugin catalog / update checks
    - {toFQDNs: [{matchName: storage.googleapis.com}], toPorts: [ports: [{port: '443', protocol: TCP}]]}  # Google Cloud Storage for Grafana plugins
    - {toFQDNs: [{matchName: secure.gravatar.com}], toPorts: [ports: [{port: '443', protocol: TCP}]]}  # Google Cloud Storage for Grafana plugins
