---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    app: grafana
    dashboards: grafana
spec:
  disableDefaultAdminSecret: true
  config:
    log:
      mode: console
    analytics:
      reporting_enabled: 'false'  # Anonymous usage stats to stats.grafana.org
    # auth:
    #   disable_login_form: "true"
    server:
      root_url: https://grafana.talmox.hera.home.karlsen.fr
    auth.generic_oauth:
      enabled: 'true'
      name: Authelia
      icon: signin
      client_id: grafana
      scopes: openid profile email groups
      empty_scopes: 'false'
      auth_url: https://auth.karlsen.fr/api/oidc/authorization
      token_url: https://auth.karlsen.fr/api/oidc/token
      api_url: https://auth.karlsen.fr/api/oidc/userinfo
      signout_redirect_url: https://auth.karlsen.fr/logout
      login_attribute_path: email
      groups_attribute_path: groups
      name_attribute_path: name
      use_pkce: 'true'
      allow_assign_grafana_admin: "true"
      role_attribute_path: contains(groups[*], 'k8s_admins') && 'Admin' || 'Viewer'
      auth_style: InHeader
      # auto_login: "true"
  version: 'docker.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f'  # renovate: datasource=docker
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              resources:
                requests: {memory: 384Mi}
                limits: {memory: 1024Mi}
              env:
                - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: admin-credentials, key: username}}}
                - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: admin-credentials, key: password}}}
                - {name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: oidc, key: client-secret}}}
                - {name: GF_PLUGINS_PREINSTALL_SYNC, value: 'victoriametrics-logs-datasource@0.32.0'}  # renovate: datasource=custom.grafana-plugins depName=victoriametrics-logs-datasource
