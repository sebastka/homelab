# Streamable HTTP keeps a response stream open (server-sent events): no overall request timeout
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: mcp-stream-timeout
  namespace: grafana
spec:
  mergeType: StrategicMerge  # Merge with the Gateway-scoped policy so its settings still apply here.
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp-grafana}
  timeout: {http: {requestTimeout: 0s, maxStreamDuration: 0s}}
