# mcp-grafana's --server-auth-token (MCP_GRAFANA_SERVER_TOKEN), and the Authorization header the
# gateway injects on the MCP route (HTTPRouteFilter.yaml, credentialInjection: key "credential")
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mcp-server-token
  namespace: grafana
spec:
  encryptedData:
    credential: 
    token: 
  template:
    metadata:
      name: mcp-server-token
      namespace: grafana
    type: Opaque
