---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-grafana
  namespace: grafana
spec:
  parentRefs:
    - {namespace: gateway, name: internal, sectionName: https-wc-talmox-hera-home-karlsen-fr}
  hostnames: [mcp-grafana.talmox.hera.home.karlsen.fr]
  rules:
    - {matches: [path: {type: PathPrefix, value: /mcp}], filters: [{type: ExtensionRef, extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: inject-server-token}}], backendRefs: [{name: mcp-grafana, kind: Service, port: 80}]}
