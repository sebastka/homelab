# https://github.com/grafana/mcp-grafana
# MCP server over Grafana's API, for AI assistants (Claude Code): Streamable HTTP on /mcp, behind
# the internal gateway with an API key (SecurityPolicy.yaml). Read-only: a Viewer service
# account (GrafanaServiceAccount.yaml) and --disable-write.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-grafana
  namespace: grafana
  annotations:
    reloader.stakater.com/auto: 'true'  # Token Secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-grafana
      app.kubernetes.io/component: mcp
      app.kubernetes.io/part-of: grafana
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-grafana
        app.kubernetes.io/component: mcp
        app.kubernetes.io/part-of: grafana
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: mcp-grafana
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # mcp-grafana, by name in the image
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp-grafana
          # Dockerfile: https://github.com/grafana/mcp-grafana/blob/main/Dockerfile
          image: docker.io/grafana/mcp-grafana:2.1.1@sha256:71a3f4e6f412d253611314233df709ec2571fb50e39742d23fa2940f670646dc
          # The image's entrypoint selects the SSE transport: replaced, not appended to
          command: [/app/mcp-grafana]
          args:
            - --transport=streamable-http
            - --address=0.0.0.0:8000
            - --healthz-address=0.0.0.0:8001  # Probes carry the pod IP as Host, which --allowed-hosts rejects
            - --allowed-hosts=mcp-grafana.talmox.hera.home.karlsen.fr
            - --disable-write
            - --usage-stats=disabled
            # Read tools for what this Grafana has: dashboards, the VictoriaMetrics (Prometheus) and
            # Alertmanager datasources, alert rules
            - --enabled-tools=search,datasource,prometheus,alerting,dashboard,folder,annotations,navigation
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 32Mi}
            limits: {memory: 128Mi}
          env:
            - {name: GRAFANA_URL, value: 'http://grafana-service.grafana.svc.cluster.local.:3000'}
            - {name: GRAFANA_SERVICE_ACCOUNT_TOKEN, valueFrom: {secretKeyRef: {name: mcp-grafana-token, key: token}}}
            # Callers must present it as a bearer token; the gateway injects it (HTTPRouteFilter.yaml)
            - {name: MCP_GRAFANA_SERVER_TOKEN, valueFrom: {secretKeyRef: {name: mcp-server-token, key: token}}}
          ports:
            - {name: http, protocol: TCP, containerPort: 8000}
            - {name: healthz, protocol: TCP, containerPort: 8001}
          startupProbe: {httpGet: {port: healthz, path: /healthz}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {port: healthz, path: /healthz}, periodSeconds: 60}
          readinessProbe: {httpGet: {port: healthz, path: /healthz}, periodSeconds: 30}
