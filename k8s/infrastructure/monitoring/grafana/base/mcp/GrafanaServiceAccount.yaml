# Grafana service account for the MCP server, with a non-expiring token the operator writes to the
# mcp-grafana-token Secret (key: token). Viewer: dashboards, datasource queries, alert rules.
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: mcp-grafana
  namespace: grafana
spec:
  instanceName: grafana
  name: mcp-grafana
  role: Viewer
  tokens:
    - {name: mcp-grafana, secretName: mcp-grafana-token}
