---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mcp-grafana
  namespace: grafana
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: mcp-grafana}}
  ingress:
    - {fromEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}}], toPorts: [ports: [{port: '8000', protocol: TCP}]]}  # Envoy Gateway
  egress:
    - {toEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: grafana, app: grafana}], toPorts: [ports: [{port: '3000', protocol: TCP}]]}  # Grafana API
