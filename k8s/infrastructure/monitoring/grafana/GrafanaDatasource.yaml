---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      app: grafana
  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    url: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428
    isDefault: true
    jsonData:
      timeInterval: 30s
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
  namespace: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      app: grafana
  datasource:
    name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://vmalertmanager-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:9093
    isDefault: false
    jsonData:
      handleGrafanaManagedAlerts: false
      implementation: prometheus
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
  namespace: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      app: grafana
  datasource:
    name: Victoria Logs
    type: loki
    access: proxy
    url: http://victoria-logs-single-server.victoria-logs.svc.cluster.local:9428/select
    jsonData:
      timeout: 60
      maxLines: 1000
