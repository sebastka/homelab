# yaml-language-server: $schema=
# https://artifacthub.io/packages/helm/portainer/portainer?modal=values
# https://github.com/portainer/k8s/blob/master/charts/portainer/README.md
---

service:
  type: ClusterIP

tls:
  force: false

image:
  tag: latest

ingress:
  enabled: false

persistence:
  enabled: true
  existingClaim: portainer-pvc

resources:
  requests: {memory: 256Mi}
  limits: {memory: 256Mi}
