# 1. Restore volume:              Longhorn UI -> Backups -> Restore latest backup -> Name: longhorn-portainer-pv
# 2. Create PV from volume:       Longhorn UI -> Volumes -> longhorn-portainer-pv -> Create PV/PVC -> Create PV only
# 3. Add RecurringJob group1:     kubectl -n longhorn-system label volume/longhorn-portainer-pv recurring-job-group.longhorn.io/group1=enabled
# 3. Remove RecurringJob default: kubectl -n longhorn-system label volume/longhorn-portainer-pv recurring-job-group.longhorn.io/default-
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portainer-data-pvc
  namespace: portainer
  labels:
    recurring-job-group.longhorn.io/group1: enabled
spec:
  accessModes: [ReadWriteOncePod]
  resources: {requests: {storage: 1Gi}}
  storageClassName: longhorn-encrypted
  volumeName: portainer-data-pv
