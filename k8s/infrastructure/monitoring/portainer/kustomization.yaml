---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portainer

resources:
  - Namespace.yaml
  - PersistentVolumeClaim.yaml
  - HTTPRoute.yaml

helmCharts:
  - name: portainer
    repo: https://portainer.github.io/k8s
    version: 2.39.0  # renovate: github-releases=portainer/k8s
    releaseName: portainer
    namespace: portainer
    includeCRDs: true
    valuesFile: values.yaml
