# yaml-language-server: $schema=
# https://github.com/VictoriaMetrics/helm-charts/blob/master/charts/victoria-metrics-k8s-stack/values.yaml
# https://docs.victoriametrics.com/operator/
---

victoria-metrics-operator:
  enabled: false  # Managed by victoria-metrics-operator-crds app

vmsingle:
  enabled: true
  spec:
    image: {repository: docker.io/victoriametrics/victoria-metrics}
    retentionPeriod: "30d"
    storage:
      storageClassName: longhorn-encrypted
      volumeName: victoriametrics-data-pv
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 20Gi}}
    # Without a CPU limit, it would size its per-CPU buffers for every core of the node (12-16) and
    # get OOMKilled while ingesting vmagent's backlog after a restart
    extraEnvs: [{name: GOMAXPROCS, value: '2'}]
    # Steady state 850-950Mi of RSS with 30d of retention; it caches up to 60% of the limit
    resources:
      requests: {memory: 1536Mi}
      limits: {memory: 2048Mi}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}

vmagent:
  enabled: true
  spec:
    image: {repository: docker.io/victoriametrics/vmagent}
    externalLabels: {cluster: talmox}
    nodeScrapeSelector: {}
    nodeScrapeNamespaceSelector: {}
    # kube-apiserver's /metrics is ~24MB uncompressed, over the 16MB default.
    extraArgs: {promscrape.maxScrapeSize: 64MiB}
    # Without a CPU limit, it would open 2 remote-write queues per core of the node (24 on t01)
    # and flood vmsingle with its backlog after a restart
    extraEnvs: [{name: GOMAXPROCS, value: '2'}]
    resources:
      requests: {memory: 128Mi}
      limits: {memory: 512Mi}
  rbac:
    namespaced: false

vmalert:
  enabled: true
  spec:
    image: {repository: docker.io/victoriametrics/vmalert}
    resources:
      requests: {memory: 128Mi}
      limits: {memory: 192Mi}

alertmanager:
  enabled: true
  spec:
    image: {repository: docker.io/prom/alertmanager}
    secrets: [alertmanager-ntfy]
    resources:
      requests: {memory: 64Mi}
      limits: {memory: 92Mi}
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: [severity = critical]
        target_matchers: [severity =~ "warning|info"]
        equal: [namespace, alertname]
      - source_matchers: [severity = warning]
        target_matchers: [severity = info]
        equal: [namespace, alertname]
    route:
      group_by: ['...']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: ntfy
      routes:
        - {receiver: "null", matchers: [alertname = Watchdog]}
        - {receiver: "null", matchers: [alertname = RecordingRulesNoData, severity = info]}
    receivers:
      - name: "null"
      - name: ntfy
        webhook_configs:
          - url_file: /etc/vm/secrets/alertmanager-ntfy/url
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/vm/secrets/alertmanager-ntfy/token
              http_headers:
                X-Template: {values: [prometheus]}
                X-Priority: {values: ['4']}
                X-Tags: {values: [victoriametrics, alertmanager]}
                X-Markdown: {values: ['1']}

grafana:
  enabled: false

defaultDashboards:
  defaultTimezone: Europe/Oslo
  grafanaOperator:
    enabled: true
    spec:
      instanceSelector:
        matchLabels:
          app: grafana
      allowCrossNamespaceImport: true

defaultRules:
  create: true

kubeProxy:
  enabled: false  # Cilium replaces kube-proxy

# https://github.com/siderolabs/talos/discussions/7214
kubeControllerManager:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          # Talos serves kube-controller-manager's metrics with a self-signed certificate valid for 127.0.0.1 only.
          tlsConfig: {insecureSkipVerify: true}
          relabelConfigs:
            - {sourceLabels: [__meta_kubernetes_pod_node_name], targetLabel: nodename}
          metricRelabelConfigs:
            - {action: labeldrop, regex: pod}

# etcd runs on the hosts, so the chart scrapes it via a headless Service plus a
# hand-written Endpoints. ArgoCD excludes Endpoints/EndpointSlice by default, so
# that object is never created and the Service has no backends. Scraped with a
# per-cluster VMStaticScrape in overlays/<cluster>/ instead.
kubeEtcd: {enabled: false}

kubeScheduler:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          # Talos serves kube-scheduler's metrics with a self-signed certificate valid for 127.0.0.1 only.
          tlsConfig: {insecureSkipVerify: true}
          relabelConfigs:
            - {sourceLabels: [__meta_kubernetes_pod_node_name], targetLabel: nodename}
          metricRelabelConfigs:
            - {action: labeldrop, regex: pod}

kubelet:
  vmScrape:
    spec:
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_node_name]
          targetLabel: node
        - sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - targetLabel: job
          replacement: kubelet

nodeExporter:
  enabled: true

prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
