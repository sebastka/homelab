---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mcp-victoriametrics
  namespace: monitoring
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: mcp-victoriametrics}}
  ingress:
    - {fromEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}}], toPorts: [ports: [{port: '8080', protocol: TCP}]]}  # Envoy Gateway
  # egress: vmsingle, through allow-intra-namespace
