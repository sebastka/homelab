---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - ../../base

helmCharts:
  - name: victoria-metrics-k8s-stack
    repo: oci://ghcr.io/victoriametrics/helm-charts
    version: 0.82.0  # renovate: datasource=helm registryUrl=oci://ghcr.io/victoriametrics/helm-charts depName=victoria-metrics-k8s-stack
    releaseName: victoria-metrics-k8s-stack
    namespace: monitoring
    includeCRDs: false
    valuesFile: ../../base/values.yaml
    valuesInline:
      kubeEtcd: {endpoints: [192.168.1.201, 192.168.1.202, 192.168.1.203]}
