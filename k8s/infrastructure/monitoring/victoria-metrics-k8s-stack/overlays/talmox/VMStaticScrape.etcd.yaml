---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: kube-etcd
  namespace: monitoring
spec:
  jobName: kube-etcd  # Matches the label the old VMServiceScrape produced
  targetEndpoints:
    # The control plane nodes (talos/clusters/talmox/topf.yaml): hera, hestia, dike
    - {targets: ['192.168.0.40:2381', '192.168.0.50:2381', '192.168.0.60:2381'], scheme: http}
