# yaml-language-server: $schema=
# https://github.com/VictoriaMetrics/helm-charts/blob/master/charts/victoria-metrics-k8s-stack/values.yaml
# https://docs.victoriametrics.com/operator/
---

victoria-metrics-operator:
  enabled: false  # Managed by victoria-metrics-operator-crds app

vmsingle:
  enabled: true
  spec:
    retentionPeriod: "90d"
    storage:
      storageClassName: longhorn-encrypted
      volumeName: victoriametrics-data-pv
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 10Gi}}
    resources:
      requests: {memory: 256Mi}
      limits: {memory: 1Gi}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}

vmagent:
  enabled: true
  rbac:
    namespaced: false
  spec:
    externalLabels: {cluster: talmox}
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    resources:
      requests: {memory: 128Mi}
      limits: {memory: 512Mi}

vmalert:
  enabled: true
  spec:
    resources:
      requests: {memory: 64Mi}
      limits: {memory: 128Mi}

alertmanager:
  enabled: true
  spec:
    secrets: [alertmanager-ntfy]
    resources:
      requests: {memory: 64Mi}
      limits: {memory: 64Mi}
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: [severity = critical]
        target_matchers: [severity =~ "warning|info"]
        equal: [namespace, alertname]
      - source_matchers: [severity = warning]
        target_matchers: [severity = info]
        equal: [namespace, alertname]
    route:
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: ntfy
      routes:
        - {receiver: "null", matchers: [alertname = Watchdog]}
    receivers:
      - name: "null"
      - name: ntfy
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/url
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/token
              http_headers:
                X-Template: {values: [prometheus]}
                X-Priority: {values: ['4']}
                X-Tags: {values: [prometheus]}
                X-Markdown: {values: ['1']}

grafana:
  enabled: false

defaultDashboards:
  defaultTimezone: Europe/Oslo
  grafanaOperator:
    enabled: true
    spec:
      instanceSelector:
        matchLabels:
          app: grafana
      allowCrossNamespaceImport: true

defaultRules:
  create: true

kubeProxy:
  enabled: false  # Cilium replaces kube-proxy

# https://github.com/siderolabs/talos/discussions/7214
kubeControllerManager:
  enabled: true
  serviceMonitor:
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

kubeEtcd:
  enabled: true
  service:
    selector:
      # etcd doesn't run as a container,
      # but most probably runs on the same nodes that host a controller
      k8s-app: kube-controller-manager
  serviceMonitor:
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

kubeScheduler:
  enabled: true
  serviceMonitor:
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

nodeExporter:
  enabled: true

prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
