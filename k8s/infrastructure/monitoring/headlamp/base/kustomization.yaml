---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headlamp

resources:
  - Namespace.yaml
  - HTTPRoute.yaml
  - CiliumNetworkPolicy.yaml

helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    version: 0.45.0
    releaseName: headlamp
    namespace: headlamp
    includeCRDs: true
    valuesFile: values.yaml
