---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headlamp

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: headlamp

resources:
  - Namespace.yaml
  - HTTPRoute.yaml

helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    version: 0.40.1  # renovate: github-releases=kubernetes-sigs/headlamp
    releaseName: headlamp
    namespace: headlamp
    includeCRDs: true
    valuesFile: values.yaml
