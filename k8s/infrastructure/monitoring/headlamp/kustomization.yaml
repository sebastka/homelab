---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headlamp

resources:
  - Namespace.yaml
  - HTTPRoute.yaml

helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    version: 0.42.0  # renovate: datasource=github-releases depName=kubernetes-sigs/headlamp
    releaseName: headlamp
    namespace: headlamp
    includeCRDs: true
    valuesFile: values.yaml
