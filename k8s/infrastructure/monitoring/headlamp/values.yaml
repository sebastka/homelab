# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/headlamp/refs/heads/main/charts/headlamp/values.schema.json
# https://artifacthub.io/packages/helm/headlamp/headlamp?modal=values
---

config:
  oidc:
    clientID: '358737465722334937'
    issuerURL: https://karlsen-xzy0yv.zitadel.cloud
    meUserInfoURL: https://karlsen-xzy0yv.zitadel.cloud/oidc/v1/userinfo
    scopes: email
    usePKCE: true

  # pluginsDir: "/headlamp/plugins"
  # enableHelm: false
  # watchPlugins: false
  # # tlsCertPath: "/headlamp-cert/headlamp-ca.crt"
  # # tlsKeyPath: "/headlamp-cert/headlamp-tls.key"
  # # Extra arguments that can be given to the container. See charts/headlamp/README.md for more information.
  # extraArgs: []

httproute:
  enabled: false
  parentRefs:
    - kind: Gateway
      name: internal
      namespace: gateway
      sectionName: https-wc-talmox-hera-home-karlsen-fr
  hostnames:
    - headlamp.talmox.hera.home.karlsen.fr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80

resources:
  requests:
    # cpu: 100m
    memory: 64Mi
  limits:
    # cpu: 100m
    memory: 64Mi

pluginsManager:
  enabled: false
  resources:
    requests:
      # cpu: 500m
      memory: 512Mi
    limits:
      # cpu: 1000m
      memory: 1Gi
