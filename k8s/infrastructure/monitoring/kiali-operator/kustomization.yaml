---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kiali-operator

resources:
  - Namespace.yaml
  # - HTTPRoute.yaml

helmCharts:
  - name: kiali-operator
    repo: https://kiali.org/helm-charts
    version: 2.23.0  # renovate: github-releases=kiali/kiali
    releaseName: kiali-operator
    namespace: kiali-operator
    includeCRDs: true
    valuesFile: values.yaml
