# yaml-language-server: $schema=
# https://github.com/VictoriaMetrics/helm-charts/blob/master/charts/victoria-logs-single/values.yaml
---

server:
  image: {repository: docker.io/victoriametrics/victoria-logs}
  retentionPeriod: 7d
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 512Mi}
  persistentVolume:
    enabled: true
    existingClaim: victorialogs-data-pvc
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}

serviceMonitor:
  enabled: true
