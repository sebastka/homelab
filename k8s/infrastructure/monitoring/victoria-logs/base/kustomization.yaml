---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: victoria-logs

configMapGenerator:
  - {name: kubernetes-logs-dashboard, options: {disableNameSuffixHash: true}, files: [kubernetes-logs.json=assets/kubernetes-logs.json]}

resources:
  - Namespace.yaml
  - CiliumNetworkPolicy.yaml
  - PersistentVolumeClaim.yaml
  - HTTPRoute.yaml
  - GrafanaDashboard.yaml

helmCharts:
  - name: victoria-logs-single
    repo: oci://ghcr.io/victoriametrics/helm-charts
    version: 0.13.9
    releaseName: victoria-logs-single
    namespace: victoria-logs
    includeCRDs: true
    valuesFile: values.yaml
