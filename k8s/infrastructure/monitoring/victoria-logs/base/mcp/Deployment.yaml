# https://github.com/VictoriaMetrics/mcp-victorialogs
# MCP server over VictoriaLogs' query APIs, for AI assistants (Claude Code): Streamable HTTP on
# /mcp, behind the internal gateway with an API key (SecurityPolicy.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-victorialogs
  namespace: victoria-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-victorialogs
      app.kubernetes.io/component: mcp
      app.kubernetes.io/part-of: victoria-logs
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-victorialogs
        app.kubernetes.io/component: mcp
        app.kubernetes.io/part-of: victoria-logs
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # mcp, by name in the image
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp-victorialogs
          image: ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0@sha256:753bb4fbe402ca1a782842f44636830f9895736f11d7fe783b924f8a0daf083d
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 32Mi}
            limits: {memory: 256Mi}
          env:
            - {name: MCP_SERVER_MODE, value: http}
            - {name: MCP_LISTEN_ADDR, value: ':8080'}
            - {name: VL_INSTANCE_ENTRYPOINT, value: 'http://victoria-logs-single-server.victoria-logs.svc.cluster.local.:9428'}
            # Its embedded documentation search index takes ~65Mi of memory
            - {name: MCP_DISABLED_TOOLS, value: documentation}
          ports:
            - {name: http, protocol: TCP, containerPort: 8080}
          startupProbe: {httpGet: {port: http, path: /health/readiness}, periodSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {port: http, path: /health/liveness}, periodSeconds: 60}
          readinessProbe: {httpGet: {port: http, path: /health/readiness}, periodSeconds: 30}
