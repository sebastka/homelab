# Streamable HTTP keeps a response stream open (server-sent events): no overall request timeout
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: mcp-stream-timeout
  namespace: victoria-logs
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp-victorialogs}
  timeout: {http: {requestTimeout: 0s, maxStreamDuration: 0s}}
