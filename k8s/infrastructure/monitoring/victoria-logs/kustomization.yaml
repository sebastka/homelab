---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: victoria-logs

resources:
  - Namespace.yaml
  - CiliumNetworkPolicy.yaml
  - PersistentVolumeClaim.yaml
  - HTTPRoute.yaml

helmCharts:
  - name: victoria-logs-single
    repo: oci://ghcr.io/victoriametrics/helm-charts
    version: 0.12.5  # renovate: datasource=helm registryUrl=oci://ghcr.io/victoriametrics/helm-charts depName=victoria-logs-single
    releaseName: victoria-logs-single
    namespace: victoria-logs
    includeCRDs: true
    valuesFile: values.yaml
