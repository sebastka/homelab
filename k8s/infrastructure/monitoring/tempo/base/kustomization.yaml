---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tempo

resources:
  - Namespace.yaml
  - CiliumNetworkPolicy.yaml
  - GrafanaDatasource.yaml

helmCharts:
  - name: tempo
    repo: oci://ghcr.io/grafana-community/helm-charts
    version: 2.2.1  # renovate: datasource=helm registryUrl=oci://ghcr.io/grafana-community/helm-charts depName=tempo
    releaseName: tempo
    namespace: tempo
    valuesFile: values.yaml
