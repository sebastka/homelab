---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metrics-server

resources:
  - Namespace.yaml
  - CiliumNetworkPolicy.yaml

helmCharts:
  - name: metrics-server
    repo: https://kubernetes-sigs.github.io/metrics-server/
    version: 3.14.0  # renovate: datasource=helm registryUrl=https://kubernetes-sigs.github.io/metrics-server/ depName=metrics-server
    releaseName: metrics-server
    namespace: metrics-server
    includeCRDs: true
    valuesFile: values.yaml
