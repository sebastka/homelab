---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: zabbix
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      # app.kubernetes.io/version: stable
      app.kubernetes.io/component: server
      app.kubernetes.io/part-of: zabbix
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: zabbix
      labels:
        app.kubernetes.io/name: backend
        # app.kubernetes.io/version: stable
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: zabbix
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1997
        runAsGroup: 1995
        fsGroup: 1995
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
        sysctls:
          - {name: net.ipv4.ping_group_range, value: '0 1995'}
      initContainers:
        # /var/lib/zabbix is an emptyDir (read-only root filesystem), which hides the directories the
        # image ships there; since 7.4.15 the entrypoint copies ssl/ssl_ca into ssl/ssl_ca_internal and
        # fails without them. Seed the emptyDir with the image's own layout.
        - name: seed-var-lib
          image: docker.io/zabbix/zabbix-server-pgsql:alpine-7.4.16@sha256:546f7cae8f04b287ab4ffd3cc81193f2ea99f2da1d0564217b65d93438f44454
          command: [cp, -R, /var/lib/zabbix/., /seed/]  # Not -a: a non-root user cannot preserve the image's ownership
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 16Mi}
            limits: {memory: 32Mi}
          volumeMounts:
            - {name: var-lib-volume, mountPath: /seed}
      containers:
        - name: backend
          # Dockerfile: https://github.com/zabbix/zabbix-docker/blob/7.4/Dockerfiles/server-pgsql/alpine/Dockerfile
          image: docker.io/zabbix/zabbix-server-pgsql:alpine-7.4.16@sha256:546f7cae8f04b287ab4ffd3cc81193f2ea99f2da1d0564217b65d93438f44454
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          envFrom:
            - secretRef: {name: zabbix-secrets}
          ports:
            - {name: zabbix-server, protocol: TCP, containerPort: 10051}
          startupProbe: {tcpSocket: {port: 10051}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: 10051}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {tcpSocket: {port: 10051}, initialDelaySeconds: 10, periodSeconds: 120}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: var-lib-volume, mountPath: /var/lib/zabbix}
      volumes:
        - {name: tmp-volume, emptyDir: {}}
        - {name: var-lib-volume, emptyDir: {}}
