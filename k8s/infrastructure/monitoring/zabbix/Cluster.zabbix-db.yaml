---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zabbix-db
  namespace: cnpg-database
spec:
  instances: 1
  postgresql: {parameters: {timezone: Europe/Oslo}}
  bootstrap:
    initdb:
      database: zabbix
      owner: zabbix
      secret: {name: zabbix-db-credentials}
  managed: {services: {disabledDefaultServices: [ro, r]}}
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 128Mi}
  storage:
    size: 10Gi
    pvcTemplate:
      accessModes: [ReadWriteOncePod]
      storageClassName: longhorn-encrypted
      volumeMode: Filesystem
      volumeName: zabbix-db-pv
