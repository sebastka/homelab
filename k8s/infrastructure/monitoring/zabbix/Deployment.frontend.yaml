---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: zabbix
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/version: '7.4.9'
      app.kubernetes.io/component: frontend
      app.kubernetes.io/part-of: zabbix
    # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: zabbix
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/version: '7.4.9'
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: zabbix
      # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: frontend
      hostAliases: [{ip: 192.168.2.12, hostnames: [zabbix.talmox.hera.home.karlsen.fr]}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1997
        runAsGroup: 1995
        fsGroup: 1995
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          # Dockerfile: https://github.com/zabbix/zabbix-docker/blob/7.4/Dockerfiles/web-nginx-pgsql/alpine/Dockerfile
          image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4.9
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          envFrom:
            - secretRef: {name: zabbix-secrets}
            - configMapRef: {name: zabbix-env}
          ports:
            - {name: http, protocol: TCP, containerPort: 8080}
            - {name: https, protocol: TCP, containerPort: 8443}
