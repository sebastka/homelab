# yaml-language-server: $schema=
# https://github.com/kyverno/policy-reporter/blob/main/charts/policy-reporter/values.yaml
---

ui:
  enabled: true

resources:
  limits: {memory: 128Mi}
  requests: {memory: 128Mi}

plugin:
  kyverno:
    enabled: true
    resources:
      limits: {memory: 128Mi}
      requests: {memory: 128Mi}
  trivy:
    enabled: true
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    resources:
      limits: {memory: 128Mi}
      requests: {memory: 128Mi}
    dbVolume:
      persistentVolumeClaim:
        claimName: trivy-plugindb-pvc

target:
  loki:
    host: http://loki.loki:3100
    skipExistingOnStartup: true

monitoring:
  enabled: true
