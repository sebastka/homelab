---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-trivy-plugin-ingress
  namespace: policy-reporter
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: policy-reporter-trivy-plugin}}
  ingress:
    - {fromEntities: [host], toPorts: [ports: [{port: '8080', protocol: TCP}]]}  # Host probes
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: policy-reporter, app.kubernetes.io/name: policy-reporter-ui}], toPorts: [ports: [{port: '8080', protocol: TCP}]]}  # UI
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-trivy-plugin-egress
  namespace: policy-reporter
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: policy-reporter-trivy-plugin}}
  egress:
    - {toEntities: [kube-apiserver]}  # VulnerabilityReport reads
    - {toEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: policy-reporter, app.kubernetes.io/name: policy-reporter}], toPorts: [ports: [{port: '8080', protocol: TCP}]]}  # policy-reporter core
    - toFQDNs:
        - {matchName: mirror.gcr.io}                         # Trivy DB (GCR mirror)
        - {matchName: ghcr.io}                               # Trivy DB (OCI registry)
        - {matchName: pkg-containers.githubusercontent.com}  # Trivy DB blobs (GitHub CDN)
        - {matchName: cveawg.mitre.org}                      # CVE AWG API
        - {matchName: api.github.com}                        # GitHub advisory API
      toPorts:
        - ports: [{port: '443', protocol: TCP}]
