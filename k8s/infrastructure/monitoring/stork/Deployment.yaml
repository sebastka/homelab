---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stork
  namespace: stork
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stork
  template:
    metadata:
      namespace: stork
      labels:
        app.kubernetes.io/name: stork
        app.kubernetes.io/version: v1
    spec:
      serviceAccountName: stork
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: stork-installer
          image: alpine/curl:8.17.0
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux

              # Clean up volumes
              for d in etc-initd-volume \
                      etc-stork-volume \
                      lib-systemd-system-volume \
                      usr-bin-volume \
                      usr-lib-stork-server-volume \
                      usr-share-stork-volume \
                      usr-share-man-man8-volume;
              do
                [ ! -d "/$d" ] || { rm -rf "/$d"/* "/$d"/.[!.]*; }
              done

              # Install Stork (https://dl.cloudsmith.io/public/isc/stork/setup.alpine.sh)
              curl -sL https://dl.cloudsmith.io/public/isc/stork/rsa.6914F776A579B428.key >/etc/apk/keys/stork@isc-6914F776A579B428.rsa.pub
              printf -- 'https://dl.cloudsmith.io/public/isc/stork/alpine/v3.23/main\n' >>/etc/apk/repositories
              apk add --no-cache isc-stork-server isc-stork-server-hook-ldap
              env | grep '^STORK_' >/etc/stork/server.env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 24Mi}
          envFrom:
            - configMapRef: {name: stork-env}
            - secretRef: {name: stork-secrets}
          volumeMounts:
            - {name: etc-initd-volume, mountPath: /etc/init.d}
            - {name: etc-stork-volume, mountPath: /etc/stork}
            - {name: lib-systemd-system-volume, mountPath: /lib/systemd/system}
            - {name: usr-bin-volume, mountPath: /usr/bin}
            - {name: usr-lib-stork-server-volume, mountPath: /usr/lib/stork-server}
            - {name: usr-share-stork-volume, mountPath: /usr/share/stork}
            - {name: usr-share-man-man8-volume, mountPath: /usr/share/man/man8}
      containers:
        - name: stork
          image: alpine:3.23.3
          command: ['stork-server', '--use-env-file']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: etc-initd-volume, mountPath: /etc/init.d, readOnly: true}
            - {name: etc-stork-volume, mountPath: /etc/stork, readOnly: true}
            - {name: lib-systemd-system-volume, mountPath: /lib/systemd/system, readOnly: true}
            - {name: usr-bin-volume, mountPath: /usr/bin, readOnly: true}
            - {name: usr-lib-stork-server-volume, mountPath: /usr/lib/stork-server, readOnly: true}
            - {name: usr-share-stork-volume, mountPath: /usr/share/stork, readOnly: true}
            - {name: usr-share-man-man8-volume, mountPath: /usr/share/man/man8, readOnly: true}
      volumes:
        - {name: etc-initd-volume, emptyDir: {}}
        - {name: etc-stork-volume, emptyDir: {}}
        - {name: lib-systemd-system-volume, emptyDir: {}}
        - {name: usr-bin-volume, emptyDir: {}}
        - {name: usr-lib-stork-server-volume, emptyDir: {}}
        - {name: usr-share-stork-volume, emptyDir: {}}
        - {name: usr-share-man-man8-volume, emptyDir: {}}
