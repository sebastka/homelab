---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stork
  namespace: stork
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stork
  template:
    metadata:
      namespace: stork
      labels:
        app.kubernetes.io/name: stork
        app.kubernetes.io/version: v1
    spec:
      serviceAccountName: stork
      securityContext:
        # runAsNonRoot: true
        # runAsUser: 100
        # runAsGroup: 101
        # fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: stork
          image: index.docker.io/library/alpine:3.23.3
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux
              # https://dl.cloudsmith.io/public/isc/stork/setup.alpine.sh
              wget -O /etc/apk/keys/stork@isc-6914F776A579B428.rsa.pub https://dl.cloudsmith.io/public/isc/stork/rsa.6914F776A579B428.key
              printf -- 'https://dl.cloudsmith.io/public/isc/stork/alpine/v3.23/main\n' >>/etc/apk/repositories
              apk add --no-cache isc-stork-server isc-stork-server-hook-ldap
              env | grep '^STORK_' >/etc/stork/server.env
              stork-server --use-env-file
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: stork-env}
            - secretRef: {name: stork-secrets}
