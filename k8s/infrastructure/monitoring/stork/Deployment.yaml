# https://hub.docker.com/hardened-images/catalog/dhi/nginx/images/nginx%2Fdebian-13%2Fmainline/sha256-12e286038641ad2919be50aec641eb6eabfc7f68d1ad8a8991cf6b8a922b2bf2/specifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: stork
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stork
  template:
    metadata:
      namespace: stork
      labels:
        app.kubernetes.io/name: stork
        app: stork
    spec:
      # imagePullSecrets:
      #   - name: dhi-io-registry
      securityContext:
        # runAsNonRoot: true
        # runAsUser: 65532
        # runAsGroup: 65532
        # fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # resources:
      #   requests:
      #     cpu: 10m
      #     memory: 12Mi
      #   limits:
      #     cpu: 100m
      #     memory: 24Mi
      initContainers:
        - name: stork-installer
          image: index.docker.io/library/alpine:latest
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux
              for dir in /etc/stork /usr/share/stork; do [ ! -d "$dir" ] || { rm -rf "$dir"/* $dir"/.[!.]*; }; done
              for file in /etc/init.d/isc-stork-server /lib/systemd/system/isc-stork-server.service /usr/bin/stork-server /usr/bin/stork-tool /usr/share/man/man8/stork-server.8 /usr/share/man/man8/stork-tool.8; do [ ! -f "$file" ] || rm -f "$file"; done
              apk add --no-cache bash curl ca-certificates
              curl -1sLf \
                'https://dl.cloudsmith.io/public/isc/stork/setup.alpine.sh' \
                | bash
              apk add --no-cache isc-stork-server
              apk info -L isc-stork-server
              cat /etc/passwd
              cat /etc/group
              sleep 3600
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: etc-stork-volume
              mountPath: /etc/stork
            - name: etc-initd-volume
              mountPath: /etc/init.d/isc-stork-server
              subPath: isc-stork-server
            - name: lib-systemd-system-volume
              mountPath: /lib/systemd/system/isc-stork-server.service
              subPath: isc-stork-server.service
            - name: usr-bin-stork-server-volume
              mountPath: /usr/bin/stork-server
              subPath: stork-server
            - name: usr-bin-stork-tool-volume
              mountPath: /usr/bin/stork-tool
              subPath: stork-tool
            - name: usr-share-man-stork-server-volume
              mountPath: /usr/share/man/man8/stork-server.8
              subPath: stork-server.8
            - name: usr-share-man-stork-tool-volume
              mountPath: /usr/share/man/man8/stork-tool.8
              subPath: stork-tool.8
            - name: usr-share-stork-volume
              mountPath: /usr/share/stork
      containers:
        - name: stork
          image: index.docker.io/library/alpine:latest
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux
              sleep
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # resources:
          #   requests:
          #     cpu: 10m
          #     memory: 12Mi
          #   limits:
          #     cpu: 100m
          #     memory: 24Mi
          ports:
            - name: http
              containerPort: 8080
      volumes:
        - name: etc-stork-volume
          emptyDir: {}
        - name: etc-initd-volume
          emptyDir: {}
        - name: lib-systemd-system-volume
          emptyDir: {}
        - name: usr-bin-stork-server-volume
          emptyDir: {}
        - name: usr-bin-stork-tool-volume
          emptyDir: {}
        - name: usr-share-man-stork-server-volume
          emptyDir: {}
        - name: usr-share-man-stork-tool-volume
          emptyDir: {}
        - name: usr-share-stork-volume
          emptyDir: {}
