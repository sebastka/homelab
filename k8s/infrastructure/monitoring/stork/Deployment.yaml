# https://hub.docker.com/hardened-images/catalog/dhi/nginx/images/nginx%2Fdebian-13%2Fmainline/sha256-12e286038641ad2919be50aec641eb6eabfc7f68d1ad8a8991cf6b8a922b2bf2/specifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: stork
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stork
  template:
    metadata:
      namespace: stork
      labels:
        app.kubernetes.io/name: stork
        app: stork
    spec:
      imagePullSecrets:
        - name: dhi-io-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # resources:
      #   requests:
      #     cpu: 10m
      #     memory: 12Mi
      #   limits:
      #     cpu: 100m
      #     memory: 24Mi
      initContainers:
        - name: stork-installer
          image: dhi.io/debian-base:trixie
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux
              apt-get update
              apt-get install -y curl ca-certificates
              curl -s -o /etc/apt/keyrings/isc.asc https://dl.cloudsmith.io/public/isc/stork/gpg.77F64EC28053D1FB.key
              printf -- 'Types: deb\nURIs: https://dl.cloudsmith.io/public/isc/stork/deb/debian\nSuites: trixie\nComponents: main\nArchitectures: amd64\nSigned-By: /etc/apt/keyrings/isc.asc\n' > /etc/apt/sources.list.d/isc-stork.sources
              apt-get update
              apt-get install -y stork-server
              dpkg -L stork-server
              cat /etc/passwd
              cat /etc/group
              sleep 3600
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: stork
          image: dhi.io/debian-base:trixie
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux
              sleep
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # resources:
          #   requests:
          #     cpu: 10m
          #     memory: 12Mi
          #   limits:
          #     cpu: 100m
          #     memory: 24Mi
          ports:
            - name: http
              containerPort: 8080
