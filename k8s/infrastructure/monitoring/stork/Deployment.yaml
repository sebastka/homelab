# https://hub.docker.com/hardened-images/catalog/dhi/nginx/images/nginx%2Fdebian-13%2Fmainline/sha256-12e286038641ad2919be50aec641eb6eabfc7f68d1ad8a8991cf6b8a922b2bf2/specifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: stork
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stork
  template:
    metadata:
      namespace: stork
      labels:
        app.kubernetes.io/name: stork
        app: stork
    spec:
      # imagePullSecrets:
      #   - name: dhi-io-registry
      securityContext:
        # runAsNonRoot: true
        # runAsUser: 65532
        # runAsGroup: 65532
        # fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # resources:
      #   requests:
      #     cpu: 10m
      #     memory: 12Mi
      #   limits:
      #     cpu: 100m
      #     memory: 24Mi
      initContainers:
        - name: stork-installer
          image: index.docker.io/library/alpine:edge
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux
              sudo apk add --no-cache bash curl ca-certificates
              curl -1sLf \
                'https://dl.cloudsmith.io/public/isc/stork/setup.alpine.sh' \
                | sudo -E bash
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: stork
          image: index.docker.io/library/alpine:edge
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux
              sleep
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # resources:
          #   requests:
          #     cpu: 10m
          #     memory: 12Mi
          #   limits:
          #     cpu: 100m
          #     memory: 24Mi
          ports:
            - name: http
              containerPort: 8080
