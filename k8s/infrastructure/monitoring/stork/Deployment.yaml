# https://hub.docker.com/hardened-images/catalog/dhi/nginx/images/nginx%2Fdebian-13%2Fmainline/sha256-12e286038641ad2919be50aec641eb6eabfc7f68d1ad8a8991cf6b8a922b2bf2/specifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: stork
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stork
  template:
    metadata:
      namespace: stork
      labels:
        app.kubernetes.io/name: stork
        app: stork
    spec:
      # imagePullSecrets:
      #   - name: dhi-io-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # resources:
      #   requests:
      #     cpu: 10m
      #     memory: 12Mi
      #   limits:
      #     cpu: 100m
      #     memory: 24Mi
      initContainers:
        - name: stork-installer
          image: index.docker.io/library/alpine:latest
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux
              apk add --no-cache curl
              [ ! -d /tmp/stork-files ] || { rm -rf /tmp/stork-files/* /tmp/stork-files/.[!.]*; }
              mkdir -p /tmp/stork-files/etc/apk/keys
              curl -s -o /tmp/stork-files/etc/apk/keys/stork@isc-6914F776A579B428.rsa.pub 'https://dl.cloudsmith.io/public/isc/stork/rsa.6914F776A579B428.key' > /etc/apk/keys/stork@isc-6914F776A579B428.rsa.pub
              apk add --no-cache -root /tmp/stork-files --repository https://dl.cloudsmith.io/public/isc/stork/alpine/v3.23/main isc-stork-server              
              sleep 3600
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: stork-files-volume
              mountPath: /tmp/stork-files
      containers:
        - name: stork
          image: index.docker.io/library/alpine:latest
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux
              sleep
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # resources:
          #   requests:
          #     cpu: 10m
          #     memory: 12Mi
          #   limits:
          #     cpu: 100m
          #     memory: 24Mi
          ports:
            - name: http
              containerPort: 8080
      volumes:
        - name: stork-files-volume
          emptyDir: {}
