---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stork
  namespace: stork
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stork
      app.kubernetes.io/version: v2.4.0
      app.kubernetes.io/component: server
      app.kubernetes.io/part-of: stork
    # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: stork
      labels:
        app.kubernetes.io/name: stork
        app.kubernetes.io/version: v2.4.0
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: stork
      # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: stork
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: stork
          image: ghcr.io/sebastka/stork:2.4.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          envFrom:
            - configMapRef: {name: stork-env}
            - secretRef: {name: stork-secrets}
          ports:
            - {name: http, protocol: TCP, containerPort: 8080}
          startupProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 10, periodSeconds: 120}
