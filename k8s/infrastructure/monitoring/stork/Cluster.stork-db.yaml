---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: stork-db
  namespace: cnpg-database
spec:
  instances: 1
  postgresql: {parameters: {timezone: Europe/Oslo}}
  bootstrap:
    initdb:
      database: stork
      owner: stork-server
      secret: {name: stork-db-credentials}
  managed: {services: {disabledDefaultServices: [ro, r]}}
  storage:
    size: 2Gi
    pvcTemplate:
      accessModes: [ReadWriteOncePod]
      storageClassName: longhorn-encrypted
      volumeMode: Filesystem
      volumeName: stork-db-pv
