# Ksops:
# - Encrypt: sops -e Secret.stork-env.yaml > Secret.stork-env.enc.yaml
# - Decrypt: sops -d Secret.stork-env.enc.yaml > Secret.stork-env.yaml
# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.stork-env.yaml > SealedSecret.stork-env.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: stork-env
  namespace: stork
spec:
  template:
    type: Opaque
    metadata:
      name: stork-env
      namespace: stork
      annotations:
        kustomize.config.k8s.io/behavior: replace
  encryptedData:
    server-env: 
