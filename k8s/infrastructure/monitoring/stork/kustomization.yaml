# https://kb.isc.org/docs/stork-quickstart-guide#debian-apt-compatible
# https://github.com/isc-projects/stork/tree/master/docker
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: stork
      app: stork

resources:
  - Namespace.yaml
  - SealedSecret.dhi-io-registry.yaml
  - SealedSecret.stork-env.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
