---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: stork
      app: stork

generators:
  - ksops.dhi-io-registry-secret-generator.yaml
  - ksops.stork-env-secret-generator.yaml

resources:
  - Namespace.yaml
  - Secret.dhi-io-registry.enc.yaml
  - Secret.stork-env.enc.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
