# https://kb.isc.org/docs/stork-quickstart-guide#debian-apt-compatible
# https://github.com/isc-projects/stork/tree/master/docker
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace: stork

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {namespace: stork, name: stork-env, envs: [assets/stork.env]}

resources:
  - Namespace.yaml
  - SealedSecret.stork-db-credentials.yaml
  - SealedSecret.stork-secrets.yaml
  - Cluster.stork-db.yaml
  - ServiceAccount.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
