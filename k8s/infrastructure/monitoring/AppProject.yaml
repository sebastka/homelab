---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
spec:
  sourceRepos: [https://github.com/sebastka/homelab.git]
  destinations:
    - {namespace: argocd, server: '*'}
    - {namespace: kube-system, server: '*'}
    - {namespace: grafana, server: '*'}
    - {namespace: headlamp, server: '*'}
    - {namespace: kite-system, server: '*'}
    - {namespace: metrics-server, server: '*'}
    - {namespace: monitoring, server: '*'}
    - {namespace: portainer, server: '*'}
    - {namespace: stork, server: '*'}
    - {namespace: zabbix, server: '*'}
  clusterResourceWhitelist:
    - {group: '*', kind: '*'}
