---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
spec:
  sourceRepos: [https://github.com/sebastka/homelab.git]
  destinations:
    - {namespace: argocd,         name: talmox}
    - {namespace: kube-system,    name: talmox}
    - {namespace: alloy,          name: talmox}
    - {namespace: grafana,        name: talmox}
    - {namespace: headlamp,       name: talmox}
    - {namespace: metrics-server, name: talmox}
    - {namespace: monitoring,     name: talmox}
    - {namespace: stork,          name: talmox}
    - {namespace: victoria-logs,  name: talmox}
    - {namespace: zabbix,         name: talmox}
  clusterResourceWhitelist:
    - {group: '*', kind: '*'}
