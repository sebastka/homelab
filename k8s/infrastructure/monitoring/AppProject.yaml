---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/sebastka/homelab.git
  destinations:
    - namespace: argocd
      server: '*'
    - namespace: kube-system
      server: '*'
    - namespace: metrics-server
      server: '*'
    - namespace: kube-prometheus-stack
      server: '*'
    - namespace: portainer
      server: '*'
    - namespace: headlamp
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
