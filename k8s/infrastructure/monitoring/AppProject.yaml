---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
spec:
  sourceRepos: [https://github.com/sebastka/homelab.git]
  destinations:
    - {namespace: argocd, server: 'https://kubernetes.default.svc'}
    - {namespace: kube-system, server: 'https://kubernetes.default.svc'}
    - {namespace: alloy, server: 'https://kubernetes.default.svc'}
    - {namespace: grafana, server: 'https://kubernetes.default.svc'}
    - {namespace: headlamp, server: 'https://kubernetes.default.svc'}
    - {namespace: loki, server: 'https://kubernetes.default.svc'}
    - {namespace: metrics-server, server: 'https://kubernetes.default.svc'}
    - {namespace: monitoring, server: 'https://kubernetes.default.svc'}
    - {namespace: stork, server: 'https://kubernetes.default.svc'}
    - {namespace: thanos, server: 'https://kubernetes.default.svc'}
    - {namespace: zabbix, server: 'https://kubernetes.default.svc'}
  clusterResourceWhitelist:
    - {group: '*', kind: '*'}
