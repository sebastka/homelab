    repo: oci://ghcr.io/aquasecurity/helm-charts/
    version: 0.32.0  # renovate: github-releases=aquasecurity/helm-charts
    releaseName: trivy-operator
    namespace: trivy-system
    includeCRDs: true
    valuesFile: values.yaml
