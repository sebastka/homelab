# yaml-language-server: $schema=
# https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack?modal=values
# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
---

namespaceOverride: monitoring

prometheus:
  networkPolicy:
    enabled: true
    flavor: cilium
    cilium:
      egress:
        - toEntities: [kube-apiserver]             # service discovery + secret reads
        - toEntities: [host, remote-node]          # kubelet metrics
          toPorts:
            - ports: [{port: '10250', protocol: TCP}]
        - toEntities: [cluster]                    # pod scraping across all namespaces
      ingress:
        - fromEntities: [host]                     # health probes
          toPorts:
            - ports: [{port: '9090', protocol: TCP}]
        - fromEndpoints:
          - matchLabels: {k8s:io.kubernetes.pod.namespace: grafana}
          toPorts:
            - ports: [{port: '9090', protocol: TCP}]
  prometheusSpec:
    externalLabels:
      cluster: talmox
    podMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    retention: 30d
    retentionSize: 9GB
    resources:
      requests: {memory: 2048Mi}
      limits: {memory: 2048Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-encrypted
          volumeName: prometheus-data-pv
          accessModes: [ReadWriteOncePod]
          resources: {requests: {storage: 10Gi}}

prometheusOperator:
  networkPolicy:
    enabled: true
    flavor: cilium
  resources:
    requests: {memory: 64Mi}
    limits: {memory: 64Mi}
  admissionWebhooks:
    deployment:
      resources:
        requests: {memory: 64Mi}
        limits: {memory: 64Mi}
    patch:
      resources:
        requests: {memory: 64Mi}
        limits: {memory: 64Mi}
  prometheusConfigReloader:
    resources:
      requests: {memory: 64Mi}
      limits: {memory: 64Mi}

# https://github.com/siderolabs/talos/discussions/7214
kubeControllerManager:
  enabled: true
  serviceMonitor:
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

kubeEtcd:
  enabled: true
  service:
    selector:
      # etcd doesn't run as a container,
      # but most probably runs on the same nodes that host a controller
      k8s-app: kube-controller-manager
  serviceMonitor:
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

kubeProxy:
  # Cilium replaces Kube Proxy
  enabled: false

kubeScheduler:
  enabled: true
  serviceMonitor:
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

nodeExporter:
  enabled: true

kube-state-metrics:
  networkPolicy:
    enabled: true
    flavor: cilium

grafana:
  enabled: false
  forceDeployDatasources: false
  forceDeployDashboards: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Europe/Oslo
  operator:
    dashboardsConfigMapRefEnabled: true
    matchLabels:
      app: grafana
    folder: Kubernetes

alertmanager:
  alertmanagerSpec:
    resources:
      requests: {memory: 64Mi}
      limits: {memory: 64Mi}

thanosRuler:
  thanosRulerSpec:
    resources:
      requests: {memory: 64Mi}
      limits: {memory: 64Mi}
