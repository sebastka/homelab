# yaml-language-server: $schema=
# https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack?modal=values
# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
---

namespaceOverride: monitoring

prometheus:
  thanosService: {enabled: true}
  networkPolicy:
    enabled: true
    flavor: cilium
    cilium:
      ingress:
        - {fromEntities: [host], toPorts: [ports: [{port: '9090', protocol: TCP}]]}  # health probes
        - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: thanos}], toPorts: [ports: [{port: '10901', protocol: TCP}]]}
      egress:
        - {toEntities: [kube-apiserver]}  # service discovery + secret reads
        - {toEntities: [host, remote-node], toPorts: [ports: [{port: '10250', protocol: TCP}]]}  # kubelet metrics
        - {toEntities: [cluster]}  # pod scraping across all namespaces
  prometheusSpec:
    thanos:
      image: quay.io/thanos/thanos:v0.41.0@sha256:cf3e9b292e4302ad4a4955b56379703aea39516607d382a57604a3d003c35d10  # renovate: datasource=docker depName=quay.io/thanos/thanos
    # externalLabels: {cluster: XXX}  # Patch for each cluster
    podMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    retention: 30d
    retentionSize: 9GB
    resources:
      requests: {memory: 2048Mi}
      limits: {memory: 2048Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-encrypted
          volumeName: prometheus-data-pv
          accessModes: [ReadWriteOncePod]
          resources: {requests: {storage: 10Gi}}

prometheusOperator:
  networkPolicy:
    enabled: true
    flavor: cilium
  resources:
    requests: {memory: 64Mi}
    limits: {memory: 64Mi}
  admissionWebhooks:
    deployment:
      resources:
        requests: {memory: 64Mi}
        limits: {memory: 64Mi}
    patch:
      resources:
        requests: {memory: 64Mi}
        limits: {memory: 64Mi}
  prometheusConfigReloader:
    resources:
      requests: {memory: 64Mi}
      limits: {memory: 64Mi}

# https://github.com/siderolabs/talos/discussions/7214
kubeControllerManager:
  enabled: true
  serviceMonitor:
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

kubeEtcd:
  enabled: true
  service:
    selector:
      # etcd doesn't run as a container,
      # but most probably runs on the same nodes that host a controller
      k8s-app: kube-controller-manager
  serviceMonitor:
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

kubeProxy:
  # Cilium replaces Kube Proxy
  enabled: false

kubeScheduler:
  enabled: true
  serviceMonitor:
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        separator: ;
        regex: ^(.*)$
        targetLabel: nodename
        replacement: $1
        action: replace
    metricRelabelings:
      - action: labeldrop
        regex: pod

nodeExporter:
  enabled: false  # Managed by victoria-metrics-k8s-stack

prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node

kube-state-metrics:
  networkPolicy:
    enabled: true
    flavor: cilium

grafana:
  enabled: false
  forceDeployDatasources: false
  forceDeployDashboards: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Europe/Oslo
  operator:
    dashboardsConfigMapRefEnabled: true
    matchLabels:
      app: grafana
    folder: Kubernetes

alertmanager:
  enabled: false
  alertmanagerSpec:
    secrets: [alertmanager-ntfy]
    resources:
      requests: {memory: 64Mi}
      limits: {memory: 64Mi}
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: [severity = critical]
        target_matchers: [severity =~ "warning|info"]
        equal: [namespace, alertname]
      - source_matchers: [severity = warning]
        target_matchers: [severity = info]
        equal: [namespace, alertname]
    route:
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: ntfy
      routes:
        - {receiver: "null", matchers: [alertname = Watchdog]}
    receivers:
      - name: "null"
      - name: ntfy
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/url
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/token
              http_headers:
                X-Template: {values: [prometheus]}
                X-Priority: {values: ['4']}
                X-Tags: {values: [prometheus]}
                X-Markdown: {values: ['1']}

thanosRuler:
  thanosRulerSpec:
    resources:
      requests: {memory: 64Mi}
      limits: {memory: 64Mi}
