---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

patches:
  - target: {group: monitoring.coreos.com, version: v1, kind: Prometheus, name: kube-prometheus-stack-prometheus}
    patch: |-
      - {op: add, path: /spec/externalLabels, value: {cluster: talmox}}

resources:
  - Namespace.yaml
  - HTTPRoute.yaml
  - CiliumNetworkPolicy.alertmanager.yaml
  - CiliumNetworkPolicy.node-exporter.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: oci://ghcr.io/prometheus-community/charts
    version: 85.1.1  # renovate: datasource=github-releases depName=prometheus-community/helm-charts
    releaseName: kube-prometheus-stack
    namespace: monitoring
    includeCRDs: false
    valuesFile: values.yaml
