---

trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  scanJobPodTemplateContainerSecurityContext:
    readOnlyRootFilesystem: false  # Avoid issues with shared /tmp volumes
  scanJobPodTemplateLabels: 'app.kubernetes.io/name=trivy-scan-job,app.kubernetes.io/component=scan-job'

operator:
  builtInTrivyServer: true
  scanJobsConcurrentLimit: 3
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true  # Should be covered vby Kyverno as well
  # infraAssessmentScannerEnabled: false
  # clusterComplianceEnabled: false
  scanJobTTL: 10m

service:
  headless: false

trivy:
  ignoreUnfixed: true
  storageClassName: longhorn
  storageSize: 5Gi
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 512Mi}
  server:
    resources:
      requests: {memory: 512Mi}
      limits: {memory: 1Gi}
    podSecurityContext:
      seccompProfile: {type: RuntimeDefault}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}

# Talos doesn't use systemd — strip /etc/systemd and /lib/systemd mounts
# which don't exist on the host and cause mkdir failures at OCI spec time.
nodeCollector:
  volumeMounts:
    - {name: var-lib-etcd, mountPath: /var/lib/etcd, readOnly: true}
    - {name: var-lib-kubelet, mountPath: /var/lib/kubelet, readOnly: true}
    - {name: var-lib-kube-scheduler, mountPath: /var/lib/kube-scheduler, readOnly: true}
    - {name: var-lib-kube-controller-manager, mountPath: /var/lib/kube-controller-manager, readOnly: true}
    - {name: etc-systemd, mountPath: /etc/systemd}
    - {name: lib-systemd, mountPath: /lib/systemd}
    - {name: etc-kubernetes, mountPath: /etc/kubernetes, readOnly: true}
    - {name: etc-cni-netd, mountPath: /etc/cni/net.d/, readOnly: true}
  volumes:
    - {name: var-lib-etcd, hostPath: {path: /var/lib/etcd}}
    - {name: var-lib-kubelet, hostPath: {path: /var/lib/kubelet}}
    - {name: var-lib-kube-scheduler, hostPath: {path: /var/lib/kube-scheduler}}
    - {name: var-lib-kube-controller-manager, hostPath: {path: /var/lib/kube-controller-manager}}
    - {name: etc-systemd, emptyDir: {}}
    - {name: lib-systemd, emptyDir: {}}
    - {name: etc-kubernetes, hostPath: {path: /etc/kubernetes}}
    - {name: etc-cni-netd, hostPath: {path: /etc/cni/net.d/}}

serviceMonitor:
  enabled: true
