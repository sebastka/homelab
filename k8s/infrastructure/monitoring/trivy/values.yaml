# yaml-language-server: $schema=
# https://github.com/aquasecurity/trivy-operator/blob/main/deploy/helm/values.yaml
---

trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  scanJobPodTemplateContainerSecurityContext:
    readOnlyRootFilesystem: false  # Avoid issues with shared /tmp volumes
  scanJobPodTemplateLabels: 'app.kubernetes.io/name=trivy-scan-job,app.kubernetes.io/component=scan-job'

operator:
  builtInTrivyServer: true
  scanJobsConcurrentLimit: 3
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true  # Should be covered vby Kyverno as well
  # infraAssessmentScannerEnabled: false
  # clusterComplianceEnabled: false
  scanJobTTL: 10m

service:
  headless: false

trivy:
  ignoreUnfixed: true
  storageClassName: longhorn
  storageSize: 5Gi
  resources:
    requests: {memory: 128Mi}
    limits: {memory: 512Mi}
  server:
    resources:
      requests: {memory: 512Mi}
      limits: {memory: 1Gi}
    podSecurityContext:
      seccompProfile: {type: RuntimeDefault}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}

serviceMonitor:
  enabled: true
