---
groups:
  - name: log-errors
    rules:
      - alert: HighLogErrorRate
        expr: |
          sum by (namespace, pod) (
            rate({namespace=~".+", namespace!~"kube-system|cilium-spire"}
              |~ "(?i)\\b(error|exception|fatal|panic)\\b"
              [5m]
            )
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High error rate in logs for {{ $labels.pod }}
          description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is logging errors at {{ $value | printf \"%.2f\" }}/s"
      - alert: CriticalLogErrorRate
        expr: |
          sum by (namespace, pod) (
            rate({namespace=~".+", namespace!~"kube-system|cilium-spire"}
              |~ "(?i)\\b(error|exception|fatal|panic)\\b"
              [5m]
            )
          ) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Critical error rate in logs for {{ $labels.pod }}
          description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is logging errors at {{ $value | printf \"%.2f\" }}/s"
