---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: loki-logs
  namespace: loki
spec:
  allowCrossNamespaceImport: true
  folder: Loki
  resyncPeriod: 10m
  instanceSelector:
    matchLabels:
      app: grafana
  configMapRef:
    name: loki-dashboards-loki-logs
    key: loki-logs.json
