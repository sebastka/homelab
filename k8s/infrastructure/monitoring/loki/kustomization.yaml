---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loki

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {name: loki-rules, files: [log-errors.yaml=assets/log-errors.yaml]}

resources:
  - Namespace.yaml
  - HTTPRoute.yaml
  - CiliumNetworkPolicy.yaml
  - GrafanaDashboard.yaml

helmCharts:
  - name: loki
    repo: oci://ghcr.io/grafana-community/helm-charts
    version: 18.11.7  # renovate: datasource=helm registryUrl=oci://ghcr.io/grafana-community/helm-charts depName=loki
    releaseName: loki
    namespace: loki
    includeCRDs: true
    valuesFile: values.yaml
