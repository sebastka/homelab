# yaml-language-server: $schema=https://raw.githubusercontent.com/grafana-community/helm-charts/refs/heads/main/charts/loki/values.schema.json
# https://artifacthub.io/packages/helm/grafana-community/loki
# https://github.com/grafana-community/helm-charts/blob/main/charts/loki/values.yaml
---

deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  schemaConfig:
    configs:
      - from: 2026-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  rulerConfig:
    storage: {type: local, local: {directory: /etc/loki/rules}}
    rule_path: /tmp/loki/ruler-temp
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
    enable_alertmanager_v2: true
    ring: {kvstore: {store: inmemory}}
    enable_api: true
  limits_config:
    retention_period: 168h  # 7 days
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40
    per_stream_rate_limit: 10MB
    per_stream_rate_limit_burst: 20MB

test: {enabled: false}
lokiCanary: {enabled: false}

gateway: {enabled: false}  # Disable nginx gateway: not needed for monolithic mode.
# route: {}  # Traffic is only internal, so not needed, unless we want to uke logcli

singleBinary:
  replicas: 1
  resources:
    requests: {memory: 256Mi}
    limits: {memory: 512Mi}
  extraVolumes:
    - {name: loki-rules, configMap: {name: loki-rules}}
  extraVolumeMounts:
    - {name: loki-rules, mountPath: /etc/loki/rules/fake, readOnly: true}
  persistence:
    enabled: true
    storageClass: longhorn-encrypted
    size: 10Gi
    accessModes: [ReadWriteOncePod]

# Disable unused distributed components.
# For Distributed mode, configure individual component replicas instead.
read:    {replicas: 0}
write:   {replicas: 0}
backend: {replicas: 0}

monitoring:
  dashboards: {enabled: true}
  serviceMonitor:
    enabled: true
    clusterLabel: null  # cluster label comes from Prometheus externalLabels via Thanos remote_write
