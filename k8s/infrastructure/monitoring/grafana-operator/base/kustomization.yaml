---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana

resources:
  - Namespace.yaml
  - CiliumNetworkPolicy.yaml

helmCharts:
  - name: grafana-operator
    repo: oci://ghcr.io/grafana/helm-charts
    version: 5.25.0  # renovate: datasource=helm registryUrl=oci://ghcr.io/grafana/helm-charts depName=grafana-operator
    releaseName: grafana-operator
    namespace: grafana
    includeCRDs: true
    valuesFile: values.yaml
