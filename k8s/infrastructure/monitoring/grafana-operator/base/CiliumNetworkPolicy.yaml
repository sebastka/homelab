---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-operator
  namespace: grafana
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: grafana-operator}}
  # ingress: []
  egress:
    - {toEntities: [kube-apiserver]}
    - {toEndpoints: [matchLabels: {app: grafana, k8s:io.kubernetes.pod.namespace: grafana}], toPorts: [ports: [{port: '3000', protocol: TCP}]]}  # Grafana API
    - {toFQDNs: [{matchName: grafana.com}, {matchName: raw.githubusercontent.com}], toPorts: [ports: [{port: '443', protocol: TCP}]]}  # grafanaCom dashboard fetch
