---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &x-project monitoring
  namespace: argocd
  labels:
    karlsen.fr/project: *x-project
spec:
  generators:
    - git:
        repoURL: https://github.com/sebastka/homelab.git
        revision: HEAD
        directories:
          - path: k8s/infrastructure/monitoring/*/overlays/*
          - {path: k8s/infrastructure/monitoring/tempo/overlays/*, exclude: true}
  template:
    metadata:
      name: '{{ path[3] }}-{{ path[5] }}'
      labels:
        karlsen.fr/cluster: '{{ path[5] }}'
        karlsen.fr/project: *x-project
    spec:
      project: *x-project
      sources:
        - {repoURL: https://github.com/sebastka/homelab.git, targetRevision: HEAD, path: '{{ path }}'}
      destination: {namespace: fallback, name: '{{ path[5] }}'}
      syncPolicy:
        automated: {allowEmpty: false, enabled: true, prune: true, selfHeal: true}
        # managedNamespaceMetadata:
        retry: {backoff: {duration: 5s, factor: 2, maxDuration: 3m}, limit: 5, refresh: true}
        syncOptions: [ServerSideApply=true]
