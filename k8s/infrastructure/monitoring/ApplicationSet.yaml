---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &x-project monitoring
  namespace: argocd
  labels:
    fr.karlsen: *x-project
spec:
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions: [{key: monitoring.karlsen.fr/app, operator: In, values: [prometheus-operator-crds, grafana-operator]}]
        - matchExpressions: [{key: monitoring.karlsen.fr/app, operator: In, values: [kube-prometheus-stack, loki]}]
        - matchExpressions: [{key: monitoring.karlsen.fr/app, operator: In, values: [thanos, alloy]}]
        - matchExpressions: [{key: monitoring.karlsen.fr/app, operator: In, values: [grafana, headlamp, hubble, metrics-server, policy-reporter, stork, zabbix]}]  # trivy
  generators:
    - git:
        repoURL: https://github.com/sebastka/homelab.git
        revision: HEAD
        directories:
          - path: k8s/infrastructure/monitoring/*
          - {path: k8s/infrastructure/monitoring/trivy, exclude: true}
  template:
    metadata:
      name: '{{ path.basename }}'
      labels:
        fr.karlsen: *x-project
        monitoring.karlsen.fr/app: '{{ path.basename }}'
    spec:
      project: *x-project
      sources:
        - {repoURL: https://github.com/sebastka/homelab.git, targetRevision: HEAD, path: '{{ path }}'}
      destination: {name: in-cluster, namespace: argocd}
      syncPolicy:
        syncOptions:
          # - ApplyOutOfSyncOnly
          - ServerSideApply=true
        automated:
          prune: true
          selfHeal: true
          enabled: true
