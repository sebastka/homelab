# yaml-language-server: $schema=
# https://github.com/VictoriaMetrics/helm-charts/blob/master/charts/victoria-metrics-operator/values.yaml
# https://docs.victoriametrics.com/operator/
---

configReloader:
  image: {repository: docker.io/victoriametrics/operator}

crds:
  plain: false  # Rendered from templates; plain: true makes CRDs immutable (no auto-upgrade)
  cleanup: {enabled: false}  # Prevent CRD deletion on helm uninstall
  upgrade:
    enabled: true
    resources:
      requests: {memory: 128Mi}
      limits: {memory: 256Mi}

serviceMonitor:
  enabled: true
  vm: true  # Creates VMServiceScrape instead of ServiceMonitor

resources:
  requests: {memory: 128Mi}
  limits: {memory: 256Mi}
