# yaml-language-server: $schema=
# https://github.com/VictoriaMetrics/helm-charts/blob/master/charts/victoria-metrics-operator/values.yaml
# https://docs.victoriametrics.com/operator/
---

configReloader:
  image:
    repository: docker.io/victoriametrics/operator
    tag: config-reloader-v0.75.0  # renovate: datasource=docker depName=docker.io/victoriametrics/operator versioning=regex:^config-reloader-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$

crds:
  plain: false  # Rendered from templates; plain: true makes CRDs immutable (no auto-upgrade)
  cleanup: {enabled: false}  # Prevent CRD deletion on helm uninstall
  upgrade:
    enabled: true
    resources:
      requests: {memory: 128Mi}
      limits: {memory: 256Mi}

# Without cert-manager, the chart generates a new webhook CA and certificate on every render: each
# new revision ArgoCD renders replaces the caBundle and the Secret while the running operator keeps
# serving the previous certificate, and every VM resource fails admission until it restarts.
admissionWebhooks:
  certManager: {enabled: true}

serviceMonitor:
  enabled: true
  vm: true  # Creates VMServiceScrape instead of ServiceMonitor

resources:
  requests: {memory: 128Mi}
  limits: {memory: 256Mi}
