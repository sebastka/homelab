---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-bootstrap-egress
  namespace: light-ldap
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: bootstrap}}
  egress:
    - {toEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: light-ldap, app.kubernetes.io/name: light-ldap}], toPorts: [ports: [{port: '17170', protocol: TCP}]]}
    - {toFQDNs: [matchName: www.karlsen.fr], toPorts: [ports: [{port: '443', protocol: TCP}]]}
