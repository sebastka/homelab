---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jwk-ecdsa
  namespace: light-ldap
spec:
  secretName: jwk-ecdsa
  dnsNames:
    - light-ldap.light-ldap.svc.cluster.local
    - light-ldap.light-ldap.svc
    - light-ldap
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cluster-root-ca
  privateKey:
    algorithm: ECDSA
    encoding: PKCS8
    size: 256
  usages:
    - digital signature
    - key encipherment
