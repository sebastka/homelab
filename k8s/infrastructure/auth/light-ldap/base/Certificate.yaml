---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jwk-ecdsa
  namespace: light-ldap
spec:
  # isCA: false
  secretName: jwk-ecdsa
  # commonName:
  dnsNames: [light-ldap.light-ldap.svc.cluster.local, light-ldap.light-ldap.svc, light-ldap]
  # subject: {}
  privateKey: {algorithm: ECDSA, size: 256, encoding: PKCS8}
  issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: cluster-root-ca}
  usages: [digital signature, key encipherment]
  # duration:
  # renewBefore:
