---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: light-ldap
  namespace: light-ldap
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: light-ldap
      app.kubernetes.io/version: stable
      app.kubernetes.io/component: ldap-server
      app.kubernetes.io/part-of: light-ldap
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: light-ldap
      labels:
        app.kubernetes.io/name: light-ldap
        app.kubernetes.io/version: stable
        app.kubernetes.io/component: ldap-server
        app.kubernetes.io/part-of: light-ldap
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: light-ldap
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: light-ldap
          # Dockerfile: https://github.com/lldap/lldap/blob/main/Dockerfile
          image: docker.io/lldap/lldap:v0.6.3-alpine-rootless@sha256:ba2c50930ea998eefd5454aa678a7977448019248b1827da87d330df0b71c284
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          envFrom:
            - configMapRef: {name: lldap-env}
            - secretRef: {name: lldap-secrets}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          ports:
            - {name: http, containerPort: 17170}
            - {name: ldap, containerPort: 3890}
            - {name: ldaps, containerPort: 6360}
          startupProbe: {exec: {command: [/app/lldap, healthcheck]}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {exec: {command: [/app/lldap, healthcheck]}, initialDelaySeconds: 5, periodSeconds: 120}
          readinessProbe: {exec: {command: [/app/lldap, healthcheck]}, initialDelaySeconds: 10, periodSeconds: 120}
          volumeMounts:
            # - {name: tmp-volume, mountPath: /tmp}
            - {name: lldap-config, mountPath: /data/lldap_config.toml, subPath: lldap_config.toml, readOnly: true}
            - {name: jwk-ecdsa-volume, mountPath: /secrets/jwk-ecdsa/tls.key, subPath: tls.key, readOnly: true}
            - {name: jwk-ecdsa-volume, mountPath: /secrets/jwk-ecdsa/tls.crt, subPath: tls.crt, readOnly: true}
      volumes:
        # - {name: tmp-volume, emptyDir: {}}
        - {name: lldap-config, configMap: {name: lldap-config}}
        - {name: jwk-ecdsa-volume, secret: {secretName: jwk-ecdsa}}
