---
apiVersion: v1
kind: Service
metadata:
  name: light-ldap
  namespace: light-ldap
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: light-ldap
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

    - name: ldap
      protocol: TCP
      port: 389
      targetPort: ldap
