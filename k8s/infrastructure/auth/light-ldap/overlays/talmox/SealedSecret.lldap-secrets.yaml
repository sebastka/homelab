---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lldap-secrets
  namespace: light-ldap
spec:
  encryptedData:
    LLDAP_DATABASE_URL: 
    LLDAP_JWT_SECRET: 
    LLDAP_KEY_SEED: 
    LLDAP_LDAP_USER_PASS: 
    LLDAP_SMTP_OPTIONS__PASSWORD: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: lldap-secrets
      namespace: light-ldap
