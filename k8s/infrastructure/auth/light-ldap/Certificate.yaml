---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jwk-ecdsa
  namespace: light-ldap
spec:
  secretName: jwk-ecdsa
  dnsNames: [ldap.karlsen.fr]
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-dns01-issuer
  privateKey:
    algorithm: ECDSA
    encoding: PKCS8
    size: 256
  usages:
    - digital signature
    - key encipherment
