# Seal secret:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.client-secrets.yaml >SealedSecret.client-secrets.yaml
# - kubeseal --cert "$(dirname "$(readlink -f "$TALOSCONFIG")")/seal.crt" -o yaml -f Secret.client-secrets.yaml >SealedSecret.client-secrets.yaml
# Unseal secret
# - kubeseal --cert "$(dirname "$(readlink -f "$TALOSCONFIG")")/seal.crt" --recovery-unseal --recovery-private-key "$(dirname "$(readlink -f "$TALOSCONFIG")")/seal.key" -o yaml -f SealedSecret.client-secrets.yaml

# How to generate client secrets for OIDC:
# https://www.authelia.com/integration/openid-connect/frequently-asked-questions/#how-do-i-generate-a-client-identifier-or-client-secret
# Client ID: docker run --rm authelia/authelia:latest authelia crypto rand --length 72 --charset rfc3986
# Client secret: docker run --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: client-secrets
  namespace: authelia
spec:
  encryptedData:
    argocd: 
    forgejo: 
    harbor: 
    mas: 
    portainer: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: client-secrets
      namespace: authelia
