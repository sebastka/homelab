# cmctl -n authelia approve jwk-ecdsa-1
# cmctl -n authelia approve jwk-rsa-1
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jwk-ecdsa
  namespace: authelia
spec:
  # isCA: false
  secretName: jwk-ecdsa
  # commonName:
  dnsNames: [auth.karlsen.fr]
  # subject: {}
  privateKey: {algorithm: ECDSA, size: 256, encoding: PKCS8}
  issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: cloudflare-dns01-issuer}
  usages: [digital signature, key encipherment]
  # duration:
  # renewBefore:
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jwk-rsa
  namespace: authelia
spec:
  # isCA: false
  secretName: jwk-rsa
  # commonName:
  dnsNames: [auth.karlsen.fr]
  # subject: {}
  privateKey: {algorithm: RSA, size: 2048, encoding: PKCS8}
  issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: cloudflare-dns01-issuer}
  usages: [digital signature, key encipherment]
  # duration:
  # renewBefore:
