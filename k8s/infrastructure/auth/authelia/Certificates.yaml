# cmctl -n authelia approve jwk-ecdsa-1
# cmctl -n authelia approve jwk-rsa-1
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jwk-ecdsa
  namespace: authelia
spec:
  secretName: jwk-ecdsa
  dnsNames: [auth.karlsen.fr]
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-dns01-issuer
  privateKey:
    algorithm: ECDSA
    encoding: PKCS8
    size: 256
  usages:
    - digital signature
    - key encipherment
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jwk-rsa
  namespace: authelia
spec:
  secretName: jwk-rsa
  dnsNames: [auth.karlsen.fr]
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-dns01-issuer
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  usages:
    - digital signature
    - key encipherment
