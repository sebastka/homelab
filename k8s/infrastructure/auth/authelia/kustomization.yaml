---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authelia

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {namespace: authelia, name: authelia-configuration, files: [configuration.yaml=assets/configuration.yaml]}

resources:
  - Namespace.yaml
  # - Secret.jwk.yaml
  - Certificates.yaml
  - SealedSecret.authelia-secrets.yaml
  - SealedSecret.client-secrets.yaml
  - ServiceAccount.yaml
  - Deployment.valkey.yaml
  - Deployment.authelia.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
