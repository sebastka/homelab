# Seal secret:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.paperless-secrets.yaml >SealedSecret.bootstrap-secrets.yaml
# - kubeseal --cert "$(dirname "$(readlink -f "$TALOSCONFIG")")/seal.crt" -o yaml -f Secret.bootstrap-secrets.yaml >SealedSecret.bootstrap-secrets.yaml
# Unseal secret
# - kubeseal --cert "$(dirname "$(readlink -f "$TALOSCONFIG")")/seal.crt" --recovery-unseal --recovery-private-key "$(dirname "$(readlink -f "$TALOSCONFIG")")/seal.key" -o yaml -f SealedSecret.bootstrap-secrets.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: bootstrap-secrets
  namespace: lldap
spec:
  encryptedData:
    LLDAP_SEBASTIAN_PASSWORD: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: bootstrap-secrets
      namespace: lldap
