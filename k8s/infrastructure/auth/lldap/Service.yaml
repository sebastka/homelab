---
apiVersion: v1
kind: Service
metadata:
  name: lldap
  namespace: lldap
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

    - name: ldap
      protocol: TCP
      port: 389
      targetPort: ldap

    - name: ldaps
      protocol: TCP
      port: 636
      targetPort: ldaps
