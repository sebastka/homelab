---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lldap

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {namespace: lldap, name: lldap-config, files: [lldap_config.toml=assets/lldap_config.toml]}
  - {namespace: lldap, name: lldap-env, envs: [assets/lldap.env]}
  - {namespace: lldap, name: bootstrap-env, envs: [assets/bootstrap.env]}

resources:
  - Namespace.yaml
  - SealedSecret.lldap-secrets.yaml
  - SealedSecret.bootstrap-schemas.yaml
  - ServiceAccount.yaml
  - Job.bootstrap.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - TCPRoute.yaml
