---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: lldap
      app: lldap

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {name: lldap-config, namespace: lldap, files: [lldap_config.toml=assets/lldap_config.toml]}
  - {name: lldap-env, namespace: lldap, envs: [assets/lldap.env]}
  - {name: bootstrap-env, namespace: lldap, envs: [assets/bootstrap.env]}

resources:
  - Namespace.yaml
  - SealedSecret.lldap-secrets.yaml
  - SealedSecret.bootstrap-schemas.yaml
  # - Secret.ldap-karlsen-fr-certificate.yaml
  - Certificate.ldap-karlsen-fr.yaml
  - Job.bootstrap.yaml
  - Deployment.yaml
  - Service.web.yaml
  - Service.ldap.yaml
  - HTTPRoute.yaml
  - TCPRoute.yaml
  - TLSRoute.yaml
