---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
  namespace: lldap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: lldap
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: init-schemas
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/jq/Dockerfile
          image: ghcr.io/sebastka/jq:2026.4.24  # renovate: docker=ghcr.io/sebastka/jq
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              rm -rf /mnt/generated-schemas/* /mnt/generated-schemas/.[!.]*
              jq -n \
                  --arg LLDAP_SEBASTIAN_PASSWORD "$LLDAP_SEBASTIAN_PASSWORD" \
                  -f /mnt/schemas/users.jq \
                  >/mnt/generated-schemas/users.json
              
              # Temp:
              cat /mnt/generated-schemas/users.json | jq
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 24Mi}
          envFrom:
            - secretRef: {name: bootstrap-secrets}
          volumeMounts:
            - {name: generated-schemas-volume, mountPath: /mnt/generated-schemas}
            - {name: bootstrap-schemas-volume, mountPath: /mnt/schemas/users.jq, subPath: users.jq, readOnly: true}
      containers:
        - name: lldap-bootstrap
          # Dockerfile: https://github.com/lldap/lldap/blob/main/Dockerfile
          image: docker.io/lldap/lldap:2026-02-27-alpine-rootless  # renovate: docker=ghcr.io/lldap/lldap
          command: [/app/bootstrap.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          envFrom:
            - configMapRef: {name: lldap-env}
            - secretRef: {name: lldap-secrets}
            - configMapRef: {name: bootstrap-env}
          env:
            - {name: LLDAP_ADMIN_USERNAME, valueFrom: {configMapKeyRef: {name: lldap-env, key: LLDAP_LDAP_USER_DN}}}
            - {name: LLDAP_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: lldap-secrets, key: LLDAP_LDAP_USER_PASS}}}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: lldap-config-volume, mountPath: /data/lldap_config.toml, subPath: lldap_config.toml, readOnly: true}
            - {name: bootstrap-schemas-volume, mountPath: /bootstrap/group-schemas/group-schemas.json, subPath: group-schemas.json, readOnly: true}
            - {name: bootstrap-schemas-volume, mountPath: /bootstrap/group-configs/groups.json, subPath: groups.json, readOnly: true}
            - {name: bootstrap-schemas-volume, mountPath: /bootstrap/user-schemas/user-schemas.json, subPath: user-schemas.json, readOnly: true}
            - {name: generated-schemas-volume, mountPath: /bootstrap/user-configs/users.json, subPath: users.json, readOnly: true}
      volumes:
        - {name: tmp-volume, emptyDir: {}}
        - {name: generated-schemas-volume, emptyDir: {}}
        - {name: lldap-config-volume, configMap: {name: lldap-config}}
        - {name: bootstrap-schemas-volume, configMap: {name: bootstrap-schemas}}
