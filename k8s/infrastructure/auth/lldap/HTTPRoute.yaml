---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: lldap
  labels:
    security-policy: httproute-allow-all
spec:
  parentRefs:
    - {namespace: gateway, name: internal, sectionName: https-wc-karlsen-fr}
    # - {namespace: gateway, name: external, sectionName: https-wc-karlsen-fr}
  hostnames:
    - ldap.karlsen.fr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: lldap-web
          port: 80
