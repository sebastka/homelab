---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ldap
  namespace: lldap
spec:
  parentRefs:
    - {namespace: gateway, name: default, sectionName: ldap}
    - {namespace: gateway, name: default, sectionName: ldaps}
  rules:
    - backendRefs: [{name: lldap, kind: Service, port: 389}]
