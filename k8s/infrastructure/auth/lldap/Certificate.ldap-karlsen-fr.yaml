---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ldap-karlsen-fr-certificate
  namespace: lldap
spec:
  secretName: ldap-karlsen-fr-certificate
  dnsNames:
    - ldap.karlsen.fr
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-dns01-issuer
  usages:
    - digital signature
    - key encipherment
