---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: auth
  namespace: argocd
spec:
  sourceRepos: [https://github.com/sebastka/homelab.git]
  destinations:
    - {namespace: argocd,     server: talmox}
    - {namespace: light-ldap, server: talmox}
    - {namespace: authelia,   server: talmox}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}         # Needed by users
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}  # Needed by users
