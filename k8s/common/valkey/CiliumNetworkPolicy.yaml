# Shared by every namespace that pulls in this component. An empty `fromEndpoints` selector in a
# namespaced CiliumNetworkPolicy means "any endpoint in this namespace": exactly the reach valkey
# should have, with no per-consumer upkeep.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-valkey
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: valkey}}
  ingress:
    - {fromEndpoints: [{}], toPorts: [ports: [{port: '6379', protocol: TCP}]]}
  # egress: []
