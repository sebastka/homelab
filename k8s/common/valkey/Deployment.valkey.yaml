---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  # namespace:
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/version: stable
      app.kubernetes.io/component: key-value-store
      # app.kubernetes.io/part-of:
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      # namespace:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/version: stable
        app.kubernetes.io/component: key-value-store
        # app.kubernetes.io/part-of:   # Do not set, since selectors are immutable
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: valkey
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          # Dockerfile: https://github.com/valkey-io/valkey-container/blob/mainline/9.0/alpine/Dockerfile
          image: index.docker.io/valkey/valkey:9.1.0-alpine3.23
          args: [--save, ""]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 64Mi}
          # env:
          #   - {name: VALKEY_EXTRA_FLAGS, value: '--save 60 1 --loglevel warning'}
          ports:
            - {name: valkey, protocol: TCP, containerPort: 6379}
          lifecycle: {preStop: {exec: {command: [sleep, '30']}}}
          startupProbe: {tcpSocket: {port: 6379}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: 6379}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {tcpSocket: {port: 6379}, initialDelaySeconds: 10, periodSeconds: 120}
