# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.pma-config.yaml >SealedSecret.pma-config.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pma-config
  namespace: phpmyadmin
spec:
  encryptedData:
    config.secret.inc.php: 
    config.user.inc.php: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: pma-config
      namespace: phpmyadmin
