---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      namespace: phpmyadmin
      labels:
        app.kubernetes.io/name: phpmyadmin
        app: phpmyadmin
    spec:
      imagePullSecrets:
        - name: dhi-io-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          # cpu: 10m
          memory: 128Mi
        limits:
          # cpu: 100m
          memory: 256Mi
      containers:
        - name: nginx
          # Dockerfile: https://hub.docker.com/hardened-images/catalog/dhi/nginx/images/nginx%2Falpine-3.23%2Fmainline/sha256-838bfb5a32b0d803389b6ee72ed411c066b3b49301ecdd8e0d7469bca06c2f77/specifications
          image: dhi.io/nginx:1-alpine3.23
          command: [nginx]
          args: ['-c', '/etc/nginx/nginx.custom.conf', '-g', 'daemon off;']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - {name: nginx-tmp-volume,    mountPath: /tmp}
            - {name: nginx-config-volume, mountPath: /etc/nginx/nginx.custom.conf, subPath: 'nginx.custom.conf', readOnly: true}
            - {name: nginx-config-volume, mountPath: /etc/nginx/conf.d/site.conf,  subPath: 'site.conf',         readOnly: true}
        - name: php-fpm
          image: docker.io/phpmyadmin:5.2.3-fpm-alpine
          # command: [nginx]
          # args: ['-c', '/etc/nginx/nginx.custom.conf', '-g', 'daemon off;']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          # ports:
          #   - name: php-fpm
          #     containerPort: 9000
          volumeMounts:
            # - {name: phpfpm-tmp-volume,    mountPath: /tmp}
            # - {name: phpfpm-config-volume, mountPath: /opt/php-8.5/etc/php/conf.d/readonly.conf, subPath: 'php-readonly.conf',    readOnly: true}
            # - {name: phpfpm-config-volume, mountPath: /opt/php-8.5/etc/php-fpm.d/readonly.conf,  subPath: 'phpfpm-readonly.conf', readOnly: true}
      volumes:
        - {name: git-volume, emptyDir: {}}
        - {name: nginx-tmp-volume, emptyDir: {}}
        - {name: phpfpm-tmp-volume, emptyDir: {}}
        - {name: nginx-config-volume, configMap: {name: nginx-config}}
        - {name: phpfpm-config-volume, configMap: {name: phpfpm-config}}

# /docker-entrypoint.sh: line 5: /etc/phpmyadmin/config.secret.inc.php: Read-only file system
# chgrp: /etc/phpmyadmin/config.secret.inc.php: No such file or directory
# touch: /etc/phpmyadmin/config.user.inc.php: Read-only file system
