# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.harbor-secrets.yaml >SealedSecret.harbor-secrets.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-secrets
  namespace: harbor
spec:
  encryptedData:
    HARBOR_ADMIN_PASSWORD: 
    REDIS_PASSWORD: 
    REDIS_USERNAME: 
    password: 
    secretKey: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: harbor-secrets
      namespace: harbor
    type: Opaque
