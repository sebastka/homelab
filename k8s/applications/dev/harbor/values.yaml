# yaml-language-server: $schema=
# https://artifacthub.io/packages/helm/harbor/harbor/1.18.2?modal=values
---

expose:
  type: clusterIP
  tls:
    enabled: false
  # route:
  #   parentRefs:
  #     - {namespace: gateway, name: internal, sectionName: https-wc-karlsen-app}
  #     # - {namespace: gateway, name: external, sectionName: https-wc-karlsen-app}
  #   hosts:
  #     - harbor.karlsen.app

externalURL: https://harbor.karlsen.app

persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      existingClaim: harbor-registry-pvc
    jobservice:
      jobLog:
        existingClaim: harbor-joblog-pvc
    trivy:
      existingClaim: harbor-trivy-pvc

existingSecretAdminPassword: harbor-secrets
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD

internalTLS:
  enabled: false

ipFamily:
  ipv6:
    enabled: false
  ipv4:
    enabled: true

# imagePullSecrets:
#   - name: docker-registry-secret
#   - name: internal-registry-secret

updateStrategy:
  type: Recreate

logLevel: info  # debug, info, warning, error or fatal

existingSecretSecretKey: harbor-secrets  # secretKey (16 chars)

metrics:
  enabled: true

trace:
  enabled: false

nginx:
  replicas: 1
  revisionHistoryLimit: 1
  resources:
    requests: {memory: 64Mi}
    limits: {memory: 64Mi}

portal:
  replicas: 1
  revisionHistoryLimit: 1
  resources:
    requests: {memory: 256Mi}
    limits: {memory: 256Mi}

core:
  replicas: 1
  revisionHistoryLimit: 1
  resources:
    requests: {memory: 256Mi}
    limits: {memory: 256Mi}

jobservice:
  replicas: 1
  revisionHistoryLimit: 1
  resources:
    requests: {memory: 512Mi}
    limits: {memory: 512Mi}

registry:
  replicas: 1
  revisionHistoryLimit: 1
  registry:
    resources:
      requests: {memory: 256Mi}
      limits: {memory: 256Mi}

trivy:
  enabled: true
  debugMode: true
  resources:
    requests: {memory: 512Mi}
    limits: {memory: 512Mi}

database:
  type: external
  external:
    host: db02.hera.home.karlsen.fr
    port: '5432'
    username: harbor
    existingSecret: harbor-secrets  # password
    coreDatabase: harbor-core

# 2207 - Using 'redis.external.existingSecret' causes nil pointer exception
# https://github.com/goharbor/harbor-helm/issues/2207
redis:
  type: internal
  internal:
    resources:
      requests: {memory: 32Mi}
      limits: {memory: 32Mi}
  # external:
  #   addr: redis01.hera.home.karlsen.fr:6379
  #   username: harbor
  #   password:
  #   # existingSecret: harbor-secrets  # REDIS_USERNAME - REDIS_PASSWORD

exporter:
  replicas: 1
  revisionHistoryLimit: 1
  resources:
    requests:
      # cpu: 100m
      memory: 256Mi
    limits:
      # cpu: 100m
      memory: 256Mi
