# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.forgejo-database.yaml >SealedSecret.forgejo-database.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-database
  namespace: forgejo
spec:
  encryptedData:
    DB_TYPE: 
    HOST: 
    NAME: 
    PASSWD: 
    USER: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: forgejo-database
      namespace: forgejo
    type: Opaque
