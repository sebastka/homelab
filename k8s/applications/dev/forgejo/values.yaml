# yaml-language-server: $schema=https://code.forgejo.org/forgejo-helm/forgejo-helm/raw/branch/main/values.schema.json
# https://artifacthub.io/packages/helm/forgejo-helm/forgejo?modal=values
# https://forgejo.org/docs/latest/admin/config-cheat-sheet
---

replicaCount: 1

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    labels:
      arp.cilium.io/announce-service: default-arp-l2-announcement-policy
      arp.cilium.io/ip-pool: default-arp-ip-pool
    annotations:
      lbipam.cilium.io/ips: 192.168.2.13
      service.cilium.io/forwarding-mode: snat
    type: LoadBalancer
    externalTrafficPolicy: Local
    port: 22

ingress:
  enabled: false

httproute:
  enabled: false
tcpRoute:
  enabled: false

resources:
  requests: {memory: 128Mi}
  limits: {memory: 512Mi}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

persistence:
  enabled: true
  create: false
  claimName: forgejo-data-pvc

initContainers:
  resources:
    requests: {memory: 64Mi}
    limits: {memory: 128Mi}

signing:
  enabled: true
  existingSecret: forgejo-gpg

# https://forgejo.org/docs/latest/admin/config-cheat-sheet/
gitea:
  additionalConfigSources:
    - secret:
        secretName: forgejo-appini
  admin:
    username: forgejo
    password: changeme
    email: postmaster@karlsen.fr
    passwordMode: initialOnlyRequireReset
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  oauth:
    - name: authelia
      provider: openidConnect
      # key: forgejo
      existingSecret: authelia-secrets  # Expected keys: key, secret
      # existingSecretKey:
      autoDiscoverUrl: https://auth.karlsen.fr/.well-known/openid-configuration
      skip-local-2fa: true
      scopes: openid email profile groups sshPublicKey
      attributeSSHPublicKey: sshPublicKey
      groupClaimName: groups
      adminGroup: forgejo_admins
      # allowUsernameChange: false  # Buggy. Run: forgejo admin auth update-oauth --id <id> --allow-username-change=false
  config:
    # APP_NAME: 'Forgejo: Beyond coding. We forge.'
    # APP_SLOGAN
    RUN_MODE: prod
    repository:
      DEFAULT_BRANCH: master
      # ACCESS_CONTROL_ALLOW_ORIGIN
    cors:
      ENABLE: 'true'
      ALLOW_ORIGIN: 'https://git.karlsen.fr'
      X_FRAME_OPTIONS: DENY
    ui:
      EXPLORE_PAGING_NUM: 20
    server:
      PROTOCOL: http
      DOMAIN: git.karlsen.fr
      ROOT_URL: https://git.karlsen.fr
      # LANDING_PAGE: /sebastian
      START_SSH_SERVER: 'true'
      SSH_SERVER_USE_PROXY_PROTOCOL: 'false'
      SSH_CREATE_AUTHORIZED_KEYS_FILE: 'true'
    database:
      DB_TYPE: mysql
      HOST: db01.hera.home.karlsen.fr
      NAME: forgejo
      USER: forgejo
    security:
      INSTALL_LOCK: 'true'
      GLOBAL_TWO_FACTOR_REQUIREMENT: all
      REVERSE_PROXY_LIMIT: '1'
      REVERSE_PROXY_TRUSTED_PROXIES: 10.244.0.0/16
      COOKIE_REMEMBER_NAME: __Host-forgejo_remember_token
      # COOKIE_REMEMBER_SAMESITE: strict  # Made up?
      # COOKIE_REMEMBER_SECURE: 'true'  # Made up?
      DISABLE_GIT_HOOKS: 'true'
      MIN_PASSWORD_LENGTH: 48
      PASSWORD_COMPLEXITY: lower,upper,digit
      PASSWORD_CHECK_PWN: 'false'
    service:
      REGISTER_EMAIL_CONFIRM: 'true'
      REGISTER_MANUAL_CONFIRM: 'true'
      DISABLE_REGISTRATION: 'false'
      ALLOW_ONLY_EXTERNAL_REGISTRATION: 'true'
      SHOW_REGISTRATION_BUTTON: 'false'
      ENABLE_NOTIFY_MAIL: 'true'
      ENABLE_INTERNAL_SIGNIN: 'false'
      DEFAULT_KEEP_EMAIL_PRIVATE: 'true'
    mailer:
      ENABLED: 'true'
      PROTOCOL: smtps
      SMTP_PORT: '465'
    openid:
      ENABLE_OPENID_SIGNIN: 'false'
      ENABLE_OPENID_SIGNUP: 'true'
      WHITELISTED_URIS: auth.karlsen.fr
    oauth2_client:
      OPENID_CONNECT_SCOPES: email profile groups sshPublicKey
      USERNAME: nickname  # userid, nickname, email
      UPDATE_AVATAR: 'true'
      ACCOUNT_LINKING: 'disabled'  # 'disabled', 'login', 'auto'
    cache:
      ADAPTER: memory
    session:
      PROVIDER: db
      COOKIE_SECURE: 'true'
      COOKIE_NAME: __Host-forgejo_session
      # DOMAIN: git.karlsen.fr  # Do not use with __Host- prefix
      SAME_SITE: strict  # https://codeberg.org/forgejo/forgejo/issues/1205
