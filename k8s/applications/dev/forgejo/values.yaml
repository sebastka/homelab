# yaml-language-server: $schema=
# https://artifacthub.io/packages/helm/forgejo-helm/forgejo?modal=values
# https://forgejo.org/docs/latest/admin/config-cheat-sheet
---

# Set up Valkey:
# - https://artifacthub.io/packages/helm/forgejo-helm/forgejo#session-cache-and-queue
# - https://artifacthub.io/packages/helm/forgejo-helm/forgejo#external-database

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

ingress:
  enabled: false

httproute:
  enabled: false
tcpRoute:
  enabled: false

resources:
  requests:
    # cpu: 100m
    memory: 128Mi
  limits:
    # cpu: 100m
    memory: 128Mi

persistence:
  enabled: true
  create: false
  claimName: forgejo-shared-storage-pvc

initContainers:
  resources:
    requests:
      # cpu: 100m
      memory: 128Mi
    limits:
      # cpu: 100m
      memory: 128Mi

signing:
  enabled: true
  existingSecret: forgejo-gpg

gitea:
  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-database
          key: PASSWD
  admin:
    username: forgejo
    password: changeme
    email: postmaster@karlsen.fr
    passwordMode: initialOnlyRequireReset
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
  # oauth: []
  config:
    database:
      DB_TYPE: mysql
      HOST: db01.hera.home.karlsen.fr
      NAME: forgejo
      USER: forgejo
