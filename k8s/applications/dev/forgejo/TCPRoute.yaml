---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: forjeo-ssh
  namespace: forjeo
spec:
  parentRefs:
    - {namespace: gateway, name: internal, sectionName: ssh}
    - {namespace: gateway, name: external, sectionName: ssh}
  rules:
    - backendRefs:
        - name: forjeo
          port: 3000
