---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ssh
  namespace: forgejo
spec:
  parentRefs:
    - {namespace: gateway, name: internal, sectionName: ssh}
    - {namespace: gateway, name: external, sectionName: ssh}
  rules:
    - backendRefs: [{name: forgejo-ssh, kind: Service, port: 22}]
