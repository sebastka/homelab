---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: forgejo-ssh
  namespace: forgejo
spec:
  parentRefs:
    - {namespace: gateway, name: internal, sectionName: ssh}
    - {namespace: gateway, name: external, sectionName: ssh}
  rules:
    - backendRefs:
        - name: forgejo-forgejo-ssh
          port: 22
