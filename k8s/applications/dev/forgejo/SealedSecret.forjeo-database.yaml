# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.forjeo-database.yaml >SealedSecret.forjeo-database.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forjeo-database
  namespace: forjeo
spec:
  encryptedData:
    DB_TYPE: 
    HOST: 
    NAME: 
    PASSWD: 
    USER: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: forjeo-database
      namespace: forjeo
    type: Opaque
