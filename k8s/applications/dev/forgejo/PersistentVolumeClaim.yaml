---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forjeo-shared-storage-pvc
  namespace: forjeo
  labels:
    app.kubernetes.io/name: forjeo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn-static
  volumeName: forjeo-shared-storage-pv
