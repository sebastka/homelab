# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.forgejo-admin-secret.yaml >SealedSecret.forgejo-admin-secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-admin-secret
  namespace: forgejo
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: forgejo-admin-secret
      namespace: forgejo
    type: Opaque
