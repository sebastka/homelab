# https://artifacthub.io/packages/helm/forgejo/forgejo
# https://forgejo.io/docs/installation/helm/
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - Namespace.yaml
  - SealedSecret.forgejo-database.yaml
  - SealedSecret.forgejo-gpg.yaml
  - PersistentVolumeClaim.yaml
  - HTTPRoute.yaml
  - TCPRoute.yaml

helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: 16.2.0
    releaseName: forgejo
    namespace: forgejo
    includeCRDs: true
    valuesFile: values.yaml
