# https://artifacthub.io/packages/helm/forgejo/forgejo
# https://forgejo.io/docs/installation/helm/
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo

components:
  - ../../../common/images

resources:
  - Namespace.yaml
  - SealedSecret.authelia-secrets.yaml
  - SealedSecret.forgejo-appini.yaml
  - SealedSecret.forgejo-gpg.yaml
  - PersistentVolumeClaim.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
  - CiliumNetworkPolicy.yaml

helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: 17.1.5  # renovate: datasource=gitea-releases registryUrl=https://code.forgejo.org depName=forgejo-helm/forgejo-helm
    releaseName: forgejo
    namespace: forgejo
    includeCRDs: true
    valuesFile: values.yaml
