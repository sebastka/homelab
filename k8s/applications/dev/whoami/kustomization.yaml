---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: whoami

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: whoami

resources:
  - Namespace.yaml
  - ServiceAccount.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
