# https://github.com/sebastka/tlsrpt
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tlsrpt

configMapGenerator:
  - {name: tlsrpt-env, envs: [assets/tlsrpt.env]}

resources:
  - Namespace.yaml
  - ServiceAccount.yaml
  - SealedSecret.tlsrpt.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
  - CiliumNetworkPolicy.yaml
