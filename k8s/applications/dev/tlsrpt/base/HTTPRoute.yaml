# `set` rather than `add`: the app (hono secureHeaders) already sends most of these, with other values.
# The script-src-elem hash is the theme bootstrap inline <script> in src/web/index.html - update it when that script changes.
# form-action includes auth.karlsen.fr: POST /auth/logout redirects to the provider's end_session_endpoint when advertised.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: tlsrpt
spec:
  parentRefs:
    - {namespace: gateway, name: default, sectionName: https-wc-karlsen-app}
  hostnames: [tlsrpt.karlsen.app]
  rules:
    - matches: [path: {type: PathPrefix, value: /}]
      backendRefs: [{name: web, kind: Service, port: 80}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Content-Security-Policy, value: "default-src 'none'; frame-ancestors 'none'; form-action 'self' https://auth.karlsen.fr; base-uri 'none'; script-src-elem 'self' 'sha256-BY7d96euUoLYsbxlEL+Ek8yQObLRJ9krNuQtKx40Hrw='; style-src-elem 'self'; img-src 'self' data:; connect-src 'self';"}
              - {name: Strict-Transport-Security, value: 'max-age=31536000; includeSubDomains; preload'}
              - {name: X-Content-Type-Options, value: nosniff}
              - {name: X-Frame-Options, value: DENY}
              - {name: Cross-Origin-Resource-Policy, value: same-origin}
              # - {name: Cross-Origin-Embedder-Policy, value: require-corp}  # Disabled in the app (crossOriginEmbedderPolicy: false)
              - {name: Cross-Origin-Opener-Policy, value: same-origin}
              - {name: Referrer-Policy, value: no-referrer}
              - {name: Permissions-Policy, value: 'accelerometer=(), autoplay=(), camera=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()'}
              # - {name: Integrity-Policy, value: 'blocked-destinations=(script style),sources=(inline)'}  # Vite emits no integrity attributes
              # - {name: Reporting-Endpoints, value: ''}
