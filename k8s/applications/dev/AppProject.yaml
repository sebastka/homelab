---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: argocd
spec:
  sourceRepos: [https://github.com/sebastka/homelab.git]
  destinations:
    - {namespace: default,  name: talmox}
    - {namespace: argocd,   name: talmox}
    - {namespace: whoami,   name: talmox}
    - {namespace: harbor,   name: talmox}
    - {namespace: forgejo,  name: talmox}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
