---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: argocd
spec:
  sourceRepos: [https://github.com/sebastka/homelab.git]
  destinations:
    - {namespace: argocd, server: 'https://kubernetes.default.svc'}
    - {namespace: whoami, server: 'https://kubernetes.default.svc'}
    - {namespace: harbor, server: 'https://kubernetes.default.svc'}
    - {namespace: forgejo, server: 'https://kubernetes.default.svc'}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: '', kind: PersistentVolume}
