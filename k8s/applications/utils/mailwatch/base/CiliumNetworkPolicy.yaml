# MailWatch checks arbitrary domains, so the check traffic cannot be pinned to FQDNs: port 25
# to every MX, HTTPS for MTA-STS, BIMI and RDAP, 53 to every authoritative nameserver (SOA
# probes), and the submission/IMAP servers it finds via config, SRV and autoconfig. The checks
# resolve through DNS_RESOLVERS, not kube-dns, so toFQDNs would never learn those addresses.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mailwatch
  namespace: mailwatch
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: mailwatch}}
  ingress:
    - {fromEntities: [host], toPorts: [ports: [{port: '3000', protocol: TCP}]]}  # Host probes
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}], toPorts: [ports: [{port: '3000', protocol: TCP}]]}  # Envoy Gateway
  egress:
    - {toEndpoints: [{matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}}], toPorts: [ports: [{port: '10443', protocol: TCP}]]}  # OIDC (auth.karlsen.fr) and our own MTA-STS/BIMI hosts, via the Gateway
    - {toFQDNs: [matchName: db01.hera.home.karlsen.fr], toPorts: [ports: [{port: '3306', protocol: TCP}]]}  # MariaDB
    - {toCIDR: [192.168.0.1/32], toPorts: [ports: [{port: '53', protocol: UDP}, {port: '53', protocol: TCP}]]}  # DNSBL_RESOLVERS (unbound on helios: Spamhaus refuses public resolvers)
    - {toEntities: [world], toPorts: [ports: [{port: '53', protocol: UDP}, {port: '53', protocol: TCP}]]}  # DNS_RESOLVERS (1.1.1.1, 8.8.8.8) and authoritative nameserver probes
    - {toEntities: [world], toPorts: [ports: [{port: '25', protocol: TCP}]]}  # SMTP probes of every MX
    - {toEntities: [world], toPorts: [ports: [{port: '443', protocol: TCP}]]}  # MTA-STS policies, BIMI logos/certificates, RDAP
    - {toEntities: [world], toPorts: [ports: [{port: '465', protocol: TCP}, {port: '587', protocol: TCP}]]}  # Submission: delivery tests and submission server checks
    - {toEntities: [world], toPorts: [ports: [{port: '993', protocol: TCP}]]}  # IMAP: report mailboxes, delivery test recipients, IMAP server checks
