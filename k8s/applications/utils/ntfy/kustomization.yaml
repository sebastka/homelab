---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ntfy

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {namespace: ntfy, name: ntfy-config, files: [server.yaml=assets/server.yaml]}

components:
  - ../../../common/default-networkpolicy

resources:
  - Namespace.yaml
  - ServiceAccount.yaml
  - PersistentVolumeClaim.yaml
  - SealedSecret.ntfy-secrets.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
  - CiliumNetworkPolicy.yaml
