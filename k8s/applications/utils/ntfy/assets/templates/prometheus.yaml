---
title: |
  {{ if eq .status "firing" }}🔥{{ else }}✅{{ end }} {{ .commonLabels.alertname }}
markdown: true
message: |
  {{ range .alerts -}}
  {{ with .annotations.summary }}{{ . }}
  {{ end -}}
  {{ with .annotations.description }}{{ . }}
  {{ end -}}
  Severity: {{ .labels.severity }}{{ with .labels.namespace }} | namespace: {{ . }}{{ end }}
  {{ end -}}
