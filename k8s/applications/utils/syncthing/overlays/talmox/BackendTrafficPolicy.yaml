# The web UI long-polls /rest/events for up to 60s: past Envoy's default 15s request timeout, the UI shows
# "Syncthing seems to be down" every time a poll is cut
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gui-long-poll-timeout
  namespace: syncthing
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: gui}
  timeout: {http: {requestTimeout: 120s}}
