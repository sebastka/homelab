---
apiVersion: v1
kind: Service
metadata:
  name: gui
  namespace: syncthing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: syncthing
  ports:
    - {name: http, protocol: TCP, port: 80, targetPort: gui}
---
# Sync connections (TLS, mutually authenticated by device ID): the LAN and the tailnet reach this
# address directly; the router forwards TCP and UDP 22000 from the internet to it.
apiVersion: v1
kind: Service
metadata:
  name: sync
  namespace: syncthing
  labels:
    arp.cilium.io/announce-service: default-arp-l2-announcement-policy
    arp.cilium.io/ip-pool: default-arp-ip-pool
  annotations:
    lbipam.cilium.io/ips: 192.168.2.14
    service.cilium.io/forwarding-mode: snat
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: syncthing
  ports:
    - {name: sync-tcp, protocol: TCP, port: 22000, targetPort: sync-tcp}
    - {name: sync-quic, protocol: UDP, port: 22000, targetPort: sync-quic}
