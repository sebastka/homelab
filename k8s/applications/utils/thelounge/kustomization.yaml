---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: thelounge

configMapGenerator:
  - {name: thelounge-config, files: [config.js=assets/config.js]}

resources:
  - Namespace.yaml
  - ServiceAccount.yaml
  - SealedSecret.thelounge-secrets.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - PersistentVolumeClaim.yaml
  - SealedSecret.oidc.yaml
  - SecurityPolicy.yaml
  - CiliumNetworkPolicy.yaml
