---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-thelounge-ingress
  namespace: thelounge
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: thelounge}}
  ingress:
    - {fromEntities: [host], toPorts: [ports: [{port: '9000', protocol: TCP}]]}  # Host probes
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}], toPorts: [ports: [{port: '9000', protocol: TCP}]]}  # Envoy Gateway
    - {fromEntities: [world], toPorts: [ports: [{port: '9001', protocol: TCP}]]}  # identd-tcp

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-thelounge-egress
  namespace: thelounge
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: thelounge}}
  egress:
    - {toEntities: [world], toPorts: [ports: [{port: '6667', protocol: TCP}, {port: '6697', protocol: TCP}]]}  # irc
    - {toEntities: [world], toPorts: [ports: [{port: '80', protocol: TCP}, {port: '443', protocol: TCP}]]}  # prefetch
    - {toEndpoints: [{matchLabels: {'k8s:io.kubernetes.pod.namespace': light-ldap, app.kubernetes.io/name: light-ldap}}], toPorts: [ports: [{port: '636', protocol: TCP}]]}  # ldaps
