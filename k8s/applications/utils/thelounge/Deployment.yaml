# https://github.com/thelounge/thelounge
# https://github.com/thelounge/thelounge-docker
# https://hub.docker.com/r/thelounge/thelounge/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thelounge
  namespace: thelounge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thelounge
  template:
    metadata:
      namespace: thelounge
      labels:
        app.kubernetes.io/name: thelounge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: thelounge
          # Dockerfile: https://github.com/thelounge/thelounge-docker/blob/master/Dockerfile
          image: ghcr.io/thelounge/thelounge:4.4.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
          ports:
            - {name: http, containerPort: 9000, protocol: TCP}
            - {name: identd-tcp, containerPort: 9001, protocol: TCP}
            - {name: identd-udp, containerPort: 9001, protocol: UDP}
          volumeMounts:
            - {name: opt-thelounge, mountPath: /var/opt/thelounge}
      volumes:
        - {name: opt-thelounge, persistentVolumeClaim: {claimName: thelounge-data-pvc}}
