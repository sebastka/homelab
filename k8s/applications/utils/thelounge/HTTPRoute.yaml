---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thelounge-httproute
  namespace: thelounge
spec:
  parentRefs:
    - kind: Gateway
      name: internal
      namespace: gateway
      sectionName: https-wc-talmox-hera-home-karlsen-fr
  hostnames:
    - thelounge.talmox.hera.home.karlsen.fr
  rules:
    - backendRefs:
        - name: thelounge-service
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
