---
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: subnet-router-local
  namespace: tailscale
  labels:
    app.kubernetes.io/name: subnet-router-local
    app.kubernetes.io/instance: tailscale
    app.kubernetes.io/part-of: tailscale
spec:
  hostname: subnet-router-local
  subnetRouter:
    advertiseRoutes:
      - 10.244.0.0/16
      - 10.96.0.0/12
      - 192.168.2.0/24
      - 192.168.3.0/24
      - 192.168.4.0/24
      - 192.168.5.0/24
      - 192.168.6.0/24
