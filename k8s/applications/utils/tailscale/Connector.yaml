  namespace: tailscale2
  labels:
    app.kubernetes.io/name: subnet-router-local2
spec:
  hostname: subnet-router-local2
  subnetRouter:
    advertiseRoutes:
      - 10.244.0.0/16
      - 10.96.0.0/12
      - 192.168.2.0/24
      - 192.168.3.0/24
      - 192.168.4.0/24
      - 192.168.5.0/24
      - 192.168.6.0/24
