---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: tailscale
      app: tailscale

generators:
  - ./ksops.tailscale-auth-generator.yaml

resources:
  - Namespace.yaml
  - Secret.tailscale-auth.enc.yaml
  - Rbac.yaml
  - Deployment.yaml
