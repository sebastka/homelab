server {
    listen 8080 default_server;
    server_name sankeymatic.karlsen.app;

    location ~ /(\.ht|\.git|wp) {
        deny  all;
    }

    location / {
        root   /app;
        index  index.html;
    }

    error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    return 404;

    location ~ /(\.ht|\.git|wp) {
        deny  all;
    }

    error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
