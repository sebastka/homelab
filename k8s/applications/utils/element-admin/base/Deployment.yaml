---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-admin
  namespace: element-admin
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: element-admin
      # app.kubernetes.io/version: git
      app.kubernetes.io/component: matrix-client
      app.kubernetes.io/part-of: element-admin
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: element-admin
      labels:
        app.kubernetes.io/name: element-admin
        # app.kubernetes.io/version: git
        app.kubernetes.io/component: matrix-client
        app.kubernetes.io/part-of: element-admin
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: element-admin
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: element-admin
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/element-admin/Dockerfile
          image: ghcr.io/sebastka/element-admin:2026.11.1@sha256:3896e3b0a5581ec8b04480b45fc0eb399272e3d5ca053f1fb3c03f29c6ac1b86
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 128Mi}
          ports:
            - {name: http, protocol: TCP, containerPort: 8080}
          startupProbe: {httpGet: {port: 8080, path: /health}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {port: 8080, path: /health}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {httpGet: {port: 8080, path: /health}, initialDelaySeconds: 10, periodSeconds: 120}
          env:
            - {name: TZ, value: Europe/Oslo}
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: tmp-volume, mountPath: /tmp,                           subPath: sys-tmp,      readOnly: false}
            - {name: tmp-volume, mountPath: /run/nginx,                     subPath: run,          readOnly: false}
            - {name: tmp-volume, mountPath: /var/lib/nginx/tmp,             subPath: nginx-tmp,    readOnly: false}
      volumes:
        - {name: nginx-conf, configMap: {name: element-admin-nginx}}
        - {name: tmp-volume, emptyDir: {}}
