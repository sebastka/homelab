---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: element-admin

configMapGenerator:
  - {namespace: element-admin, name: element-admin-nginx, files: [default.conf=assets/default.conf]}

resources:
  - Namespace.yaml
  - ServiceAccounts.yaml
  - Deployment.yaml
  - Services.yaml
  - HTTPRoute.yaml
  - CiliumNetworkPolicy.yaml
