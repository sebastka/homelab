# Element Admin's nginx site. The image ships only the built assets and a placeholder that returns
# 503, so this file is what actually serves the app: see the image's README.
#
# listen 8080 only, no IPv6: talmox is a single-stack IPv4 cluster (podSubnets 10.244.0.0/16), and
# nginx refuses to start on a `listen [::]:` it cannot bind. Upstream's image generates this at
# start-up to cover both; here it is simply known.

server {
    listen 8080;
    server_name _;
    http2 on;

    root /dist;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_static on;

    include /etc/nginx/security_headers.conf;

    location /assets {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security_headers.conf;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /;
        include /etc/nginx/security_headers.conf;

        # The built index.html carries a literal APP_CONFIG_PLACEHOLDER, which upstream's image
        # replaced from a start-up script. Rewriting it per request instead keeps the value here,
        # beside the rest of the configuration, and means nothing has to pre-render a copy: that
        # would pin the hashed asset names in index.html and go stale on the next image build.
        #
        # Base64 of {"serverName": "karlsen.fr"}, as the app expects.
        sub_filter 'APP_CONFIG_PLACEHOLDER' 'ewogICJzZXJ2ZXJOYW1lIjogImthcmxzZW4uZnIiCn0K';
        sub_filter_once on;
        sub_filter_types text/html;

        # sub_filter cannot rewrite a file nginx sends precompressed, and every asset here has a
        # .gz companion, so index.html.gz would be served untouched and leak the placeholder to
        # any client accepting gzip, which is all of them. Responses are still compressed, just by
        # gzip rather than gzip_static; /assets keeps its precompressed files.
        gzip_static off;
    }

    location = /health {
        allow all;
        access_log off;
        default_type application/json;
        return 200 '{"status": "ok"}';
    }

    error_page 500 502 503 504 /50x.html;
}
