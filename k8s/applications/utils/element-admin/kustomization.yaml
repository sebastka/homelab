---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: element-admin

generatorOptions:
  disableNameSuffixHash: true

# configMapGenerator:
#   - {namespace: element-admin, name: element-admin-config, files: [config.json=assets/config.json]}

resources:
  - Namespace.yaml
  - ServiceAccounts.yaml
  - Deployment.yaml
  - Services.yaml
  - HTTPRoute.yaml
