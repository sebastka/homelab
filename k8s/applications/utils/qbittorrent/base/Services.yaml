---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: qbittorrent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - {name: http, protocol: TCP, port: 80, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: vuetorrent
  namespace: qbittorrent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vuetorrent
  ports:
    - {name: http, protocol: TCP, port: 80, targetPort: http}
---
# Peers: 192.168.2.17:6882, forwarded from the WAN by the router (sebastka/nixos: hosts/helios, qbittorrentTorrent)
apiVersion: v1
kind: Service
metadata:
  name: torrent
  namespace: qbittorrent
  labels:
    arp.cilium.io/announce-service: default-arp-l2-announcement-policy
    arp.cilium.io/ip-pool: default-arp-ip-pool
  annotations:
    lbipam.cilium.io/ips: 192.168.2.17
    service.cilium.io/forwarding-mode: snat
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - {name: torrent-tcp, protocol: TCP, port: 6882, targetPort: torrent-tcp}
    - {name: torrent-udp, protocol: UDP, port: 6882, targetPort: torrent-udp}
