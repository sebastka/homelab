# One domain for both: qBittorrent's API (/api/) and VueTorrent, its Web UI (everything else). The same origin is
# what qBittorrent's session cookie and CSRF check (Origin/Referer against Host) need.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: qbittorrent
spec:
  parentRefs:
    - {namespace: gateway, name: default, sectionName: https-wc-karlsen-app}
  hostnames: [qbittorrent.karlsen.app]
  rules:
    - matches: [path: {type: PathPrefix, value: /api/}]
      backendRefs: [{name: web, kind: Service, port: 80}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Strict-Transport-Security, value: 'max-age=31536000; includeSubDomains; preload'}
    - matches: [path: {type: PathPrefix, value: /}]
      backendRefs: [{name: vuetorrent, kind: Service, port: 80}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Strict-Transport-Security, value: 'max-age=31536000; includeSubDomains; preload'}
