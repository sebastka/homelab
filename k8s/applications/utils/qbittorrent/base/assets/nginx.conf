# VueTorrent's static files. qBittorrent's API (/api/) is routed to qBittorrent by the HTTPRoute, on the same domain:
# its session cookie and CSRF check (Origin/Referer against Host) need the same origin.
# Replaces the image's nginx.conf: on a read-only root filesystem, the PID, temporary files and logs go elsewhere.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    access_log /dev/stdout;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080 default_server;
        root /webui/vuetorrent/public;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;  # Keeps the Referer on its own /api/ calls: qBittorrent's CSRF check

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
