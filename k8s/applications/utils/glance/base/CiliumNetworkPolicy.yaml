---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-glance
  namespace: glance
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: glance}}
  ingress:
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}], toPorts: [ports: [{port: '8080', protocol: TCP}]]}  # Envoy Gateway
  egress:
    - {toEntities: [world]}  # cluster, host
