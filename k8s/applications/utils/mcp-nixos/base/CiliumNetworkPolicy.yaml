---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mcp-nixos
  namespace: mcp-nixos
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: mcp-nixos}}
  ingress:
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}], toPorts: [ports: [{port: '8000', protocol: TCP}]]}  # Envoy Gateway
  egress:
    # Its sources: search.nixos.org, nixhub.io, FlakeHub, noogle.dev, wiki.nixos.org, nix.dev, GitHub...
    - {toEntities: [world], toPorts: [ports: [{port: '443', protocol: TCP}]]}
