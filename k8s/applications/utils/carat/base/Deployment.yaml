---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carat
  namespace: carat
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carat
      # app.kubernetes.io/version:
      app.kubernetes.io/component: web
      app.kubernetes.io/part-of: carat
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: carat
      labels:
        app.kubernetes.io/name: carat
        # app.kubernetes.io/version:
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: carat
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: carat
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: carat
          image: ghcr.io/sebastka/carat:2026.10.22-cedf1b3@sha256:a1d1ea15237093e43e5be9cb53b2bf9888ca2083e38f542e6718009313320b7d
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 48Mi}
            limits: {memory: 64Mi}
          env:
            - {name: LISTEN_HOST, value: 0.0.0.0}  # server.mjs defaults to loopback
            - {name: PORT, value: '8080'}
            - {name: PERSIST_DIR, value: /mnt/data/carat}
          ports:
            - {name: http, protocol: TCP, containerPort: 8080}
          startupProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 10, periodSeconds: 120}
          volumeMounts:
            - {name: carat-data-volume,  mountPath: /mnt/data/carat,  subPath: data, readOnly: false}
      volumes:
        - {name: carat-data-volume,  persistentVolumeClaim: {claimName: carat-data-pvc}}
