---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-carat
  namespace: carat
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: carat}}
  ingress:
    - {fromEntities: [host], toPorts: [ports: [{port: '8080', protocol: TCP}]]}  # Host probes
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}], toPorts: [ports: [{port: '8080', protocol: TCP}]]}  # Envoy Gateway
  # egress: []  # Serves dist/ and reads/writes the PVC - it talks to nothing off-pod
