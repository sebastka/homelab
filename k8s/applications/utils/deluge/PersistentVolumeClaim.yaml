---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluged-config-pvc
  namespace: deluge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeName: deluged-config-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluge-web-config-pvc
  namespace: deluge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeName: deluge-web-config-pv
