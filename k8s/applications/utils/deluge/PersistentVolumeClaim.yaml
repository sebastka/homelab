---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluge-daemon-config-pvc
  namespace: deluge
spec:
  accessModes: [ReadWriteOncePod]
  resources: {requests: {storage: 1Gi}}
  storageClassName: longhorn-static
  volumeName: deluge-daemon-config-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluge-client-config-pvc
  namespace: deluge
spec:
  accessModes: [ReadWriteOncePod]
  resources: {requests: {storage: 1Gi}}
  storageClassName: longhorn-static
  volumeName: deluge-client-config-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deluge-downloads-pvc
  namespace: deluge
spec:
  accessModes: [ReadWriteOncePod]
  resources: {requests: {storage: 1Gi}}
  storageClassName: nfs-static
  volumeName: deluge-downloads-pv
