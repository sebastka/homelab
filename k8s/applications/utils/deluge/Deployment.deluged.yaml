---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluged
  namespace: deluge
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deluged
      app.kubernetes.io/version: '2.2.0'
      app.kubernetes.io/component: server
      app.kubernetes.io/part-of: deluge
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: deluge
      labels:
        app.kubernetes.io/name: deluged
        app.kubernetes.io/version: '2.2.0'
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: deluge
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: deluged
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: deluged-init
          # Dockerfile: https://github.com/home-operations/containers/blob/main/apps/deluge/Dockerfile
          image: ghcr.io/home-operations/deluge:2.2.0
          imagePullPolicy: Always
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eu
              mkdir -p /config/plugins/.python-eggs
              rm -f /config/auth /config/core.conf /config/autoadd.conf # /config/label.conf
              cp /tmp/core.conf /tmp/autoadd.conf /config/
              printf -- '%s:%s:10\n' "$DELUGED_USERNAME" "$DELUGED_PASSWORD" \
                >/config/auth
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 24Mi}
          envFrom:
            - secretRef: {name: deluge-credentials}
          volumeMounts:
            - {name: deluged-conf-volume, mountPath: /tmp/core.conf, subPath: core.conf}
            - {name: deluged-conf-volume, mountPath: /tmp/autoadd.conf, subPath: autoadd.conf}
            # - {name: deluged-conf-volume, mountPath: /tmp/label.conf, subPath: label.conf}
            - {name: deluged-config-volume, mountPath: /config}
      containers:
        - name: deluged
          # Dockerfile: https://github.com/home-operations/containers/blob/main/apps/deluge/Dockerfile
          image: ghcr.io/home-operations/deluge:2.2.0
          imagePullPolicy: Always
          command: 
            - /usr/bin/deluged
            - --config=/config
            - --loglevel=info
            - --pidfile=/tmp/deluged.pid
            - --do-not-daemonize
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 512Mi}
          ports:
            - {name: daemon, containerPort: 58846, protocol: TCP}
            - {name: torrent-tcp, containerPort: 6881, protocol: TCP}
            - {name: torrent-udp, containerPort: 6881, protocol: UDP}
          startupProbe: {tcpSocket: {port: 58846}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: 58846}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {tcpSocket: {port: 58846}, initialDelaySeconds: 10, periodSeconds: 120}
          env:
            - {name: TZ, value: Europe/Oslo}
            # - {name: DELUGE_BIN, value: deluged}
          volumeMounts:
            - {name: deluged-config-volume, mountPath: /config}
            - {name: downloads-volume, mountPath: /downloads}
            - {name: tmp-volume, mountPath: /tmp}
      volumes:
        - {name: deluged-conf-volume, configMap: {name: deluged-conf}}
        - {name: deluged-config-volume, persistentVolumeClaim: {claimName: deluged-config-pvc}}
        - {name: downloads-volume, persistentVolumeClaim: {claimName: deluge-downloads-pvc}}
        - {name: tmp-volume, emptyDir: {}}
