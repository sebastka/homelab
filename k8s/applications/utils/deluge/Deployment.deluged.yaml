---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluged
  namespace: deluge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deluged
      app.kubernetes.io/version: '2.2.0'
      app.kubernetes.io/component: server
      app.kubernetes.io/part-of: deluge
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: deluge
      labels:
        app.kubernetes.io/name: deluged
        app.kubernetes.io/version: '2.2.0'
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: deluge
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: deluged
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: deluged
          # Dockerfile: https://github.com/home-operations/containers/blob/main/apps/deluge/Dockerfile
          image: ghcr.io/home-operations/deluge:2.2.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 512Mi}
          ports:
            - {name: daemon, containerPort: 58846, protocol: TCP}
            - {name: torrent-tcp, containerPort: 6881, protocol: TCP}
            - {name: torrent-udp, containerPort: 6881, protocol: UDP}
          env:
            - {name: TZ, value: Europe/Oslo}
            - {name: DELUGE_BIN, value: deluged}
          volumeMounts:
            - {name: deluged-config-volume, mountPath: /config}
            - {name: deluged-core-conf-volume, mountPath: /config/core.conf, subPath: core.conf, readOnly: true}
            - {name: deluged-auth-volume, mountPath: /config/auth, subPath: auth, readOnly: true}
            - {name: downloads-volume, mountPath: /downloads}
      volumes:
        - {name: deluged-config-volume, persistentVolumeClaim: {claimName: deluged-config-pvc}}
        - {name: deluged-core-conf-volume, configMap: {name: deluged-core-conf}}
        - {name: deluged-auth-volume, secret: {secretName: deluged-auth}}
        - {name: downloads-volume, persistentVolumeClaim: {claimName: deluge-downloads-pvc}}
