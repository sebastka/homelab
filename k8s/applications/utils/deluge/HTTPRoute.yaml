---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deluge-httproute
  namespace: deluge
spec:
  parentRefs:
    - {namespace: gateway, name: internal, sectionName: https-wc-karlsen-app}
  hostnames:
    - deluge.karlsen.app
  rules:
    - backendRefs:
        - name: http
          port: 8112
      matches:
        - path:
            type: PathPrefix
            value: /
