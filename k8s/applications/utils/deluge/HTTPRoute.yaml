---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deluge-httproute
  namespace: deluge
spec:
  parentRefs:
    - kind: Gateway
      name: internal
      namespace: gateway
      sectionName: https-wc-talmox-hera-home-karlsen-fr
  hostnames:
    - deluge.talmox.hera.home.karlsen.fr
  rules:
    - backendRefs:
        - name: http
          port: 8112
      matches:
        - path:
            type: PathPrefix
            value: /
