---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge-web
  namespace: deluge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deluge-web
      app.kubernetes.io/version: '2.2.0'
      app.kubernetes.io/component: client
      app.kubernetes.io/part-of: deluge
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: deluge
      labels:
        app.kubernetes.io/name: deluge-web
        app.kubernetes.io/version: '2.2.0'
        app.kubernetes.io/component: client
        app.kubernetes.io/part-of: deluge
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: deluge-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: deluge-web
          # Dockerfile: https://github.com/home-operations/containers/blob/main/apps/deluge/Dockerfile
          image: ghcr.io/home-operations/deluge:2.2.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          ports:
            - {name: http, containerPort: 8112}
          env:
            - {name: TZ, value: Europe/Oslo}
            - {name: DELUGE_BIN, value: deluge-web}
          volumeMounts:
            - {name: deluge-web-config-volume, mountPath: /config}
      volumes:
        - {name: deluge-web-config-volume, persistentVolumeClaim: {claimName: deluge-web-config-pvc}}
