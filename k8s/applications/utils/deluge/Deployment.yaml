# https://github.com/home-operations/containers
# https://github.com/home-operations/containers/blob/main/apps/deluge/Dockerfile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge-deployment
  namespace: deluge
spec:
  replicas: 0
  strategy:
    type: Recreate
  template:
    metadata:
      namespace: deluge
      labels:
        app.kubernetes.io/name: deluge
        app: deluge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deluged
          image: ghcr.io/home-operations/deluge:2
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: torrent-tcp
              containerPort: 6881
              protocol: TCP
            - name: torrent-udp
              containerPort: 6881
              protocol: UDP
          env:
            - name: TZ
              value: Europe/Oslo
            - name: DELUGE_BIN
              value: deluged
          resources:
            requests:
              cpu: 100m
              memory: 1.5Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
        - name: deluge-web
          image: ghcr.io/home-operations/deluge:2
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8112
          env:
            - name: TZ
              value: Europe/Oslo
            - name: DELUGE_BIN
              value: deluge-web
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
            limits:
              cpu: 500m
              memory: 500Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: deluge-config-pvc
        - name: downloads
          nfs:
            server: 192.168.6.20
            path: /mnt/nfs/homelab/k8s/deluge/downloads
