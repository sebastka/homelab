# https://github.com/home-operations/containers
# https://github.com/home-operations/containers/blob/main/apps/deluge/Dockerfile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge-deployment
  namespace: deluge
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      namespace: deluge
      labels:
        app.kubernetes.io/name: deluge
        app: deluge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deluge
          image: ghcr.io/home-operations/deluge:2
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8112
            - name: torrent-tcp
              containerPort: 6881
              protocol: TCP
            - name: torrent-udp
              containerPort: 6881
              protocol: UDP
          env:
            - name: TZ
              value: Europe/Oslo
            - name: DELUGE_LOGLEVEL
              value: debug
            - name: DELUGE_BIN
              value: deluge-web
          resources:
            requests:
              cpu: 100m
              memory: 1.5Gi
            limits:
              cpu: 2000m
              memory: 8Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: longhorn-deluge-config-pvc
        - name: data
          emptyDir: {}
          # nfs:
          #   server: 192.168.1.117
          #   path: /mnt/pool-0/data
