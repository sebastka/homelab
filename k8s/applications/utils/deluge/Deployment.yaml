---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge
  namespace: deluge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      namespace: deluge
      labels:
        app.kubernetes.io/name: deluge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: deluged
          # Dockerfile: https://github.com/home-operations/containers/blob/main/apps/deluge/Dockerfile
          image: ghcr.io/home-operations/deluge:2.2.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 512Mi}
          ports:
            - {name: torrent-tcp, containerPort: 6881, protocol: TCP}
            - {name: torrent-udp, containerPort: 6881, protocol: UDP}
          env:
            - {name: TZ, value: Europe/Oslo}
            - {name: DELUGE_BIN, value: deluged}
          volumeMounts:
            - {name: config-volume, mountPath: /config}
            - {name: downloads-volume, mountPath: /downloads}
        - name: deluge-web
          # Dockerfile: https://github.com/home-operations/containers/blob/main/apps/deluge/Dockerfile
          image: ghcr.io/home-operations/deluge:2.2.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          ports:
            - {name: http, containerPort: 8112}
          env:
            - {name: TZ, value: Europe/Oslo}
            - {name: DELUGE_BIN, value: deluge-web}
          volumeMounts:
            - {name: config-volume, mountPath: /config}
            - {name: downloads-volume, mountPath: /downloads}
      volumes:
        - {name: config-volume, persistentVolumeClaim: {claimName: deluge-config-pvc}}
        - {name: downloads-volume, persistentVolumeClaim: {claimName: deluge-downloads-pvc}}
