---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deluge

configMapGenerator:
  - namespace: deluge
    name: deluged-core-conf
    files: [core.conf=assets/deluged-core.conf]

resources:
  - Namespace.yaml
  - PersistentVolume.yaml
  - PersistentVolumeClaim.yaml
  - ServiceAccounts.yaml
  - SealedSecret.oidc.yaml
  - SealedSecret.deluged-certs.yaml
  - SealedSecret.deluge-credentials.yaml
  - Deployment.deluged.yaml
  - Deployment.deluge-web.yaml
  - Services.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
