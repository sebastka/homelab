---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deluge

configMapGenerator:
  - namespace: deluge
    name: deluged-conf
    files:
      - core.conf=assets/core.conf
      - autoadd.conf=assets/autoadd.conf
      - label.conf=assets/label.conf

resources:
  - Namespace.yaml
  - PersistentVolume.yaml
  - PersistentVolumeClaim.yaml
  - ServiceAccounts.yaml
  - SealedSecret.oidc.yaml
  - SealedSecret.deluge-credentials.yaml
  - Deployment.deluged.yaml
  - Deployment.deluge-web.yaml
  - Services.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
