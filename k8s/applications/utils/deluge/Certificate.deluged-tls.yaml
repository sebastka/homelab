---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: deluged-tls
  namespace: deluge
spec:
  secretName: deluged-tls
  dnsNames: [daemon.deluge.svc.cluster.local, daemon.deluge.svc, daemon.deluge]
  issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: cluster-root-ca}
  privateKey: {algorithm: ECDSA, encoding: PKCS8, size: 256}
  usages: [digital signature, key encipherment]
