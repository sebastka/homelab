---
apiVersion: v1
kind: Service
metadata:
  name: deluge-service
  namespace: deluge
spec:
  type: ClusterIP
  ports:
    - name: web
      protocol: TCP
      port: 8112
      targetPort: 8112

    - name: torrent-tcp
      protocol: TCP
      port: 6881
      targetPort: torrent-tcp

    - name: torrent-udp
      protocol: UDP
      port: 6881
      targetPort: torrent-udp
