---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge-web
  namespace: deluge
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deluge-web
      # app.kubernetes.io/version: stable
      app.kubernetes.io/component: client
      app.kubernetes.io/part-of: deluge
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: deluge
      labels:
        app.kubernetes.io/name: deluge-web
        # app.kubernetes.io/version: stable
        app.kubernetes.io/component: client
        app.kubernetes.io/part-of: deluge
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: deluge-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: deluge-web-init
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/deluge/Dockerfile
          image: ghcr.io/sebastka/deluge:2.2.0@sha256:128a19d7b473151bc7598242098f98f4eac889d4e80f5c4c9a782ce55719a760
          # The image has no shell: Python, from Deluge's own virtualenv. Deluge's config files are
          # two JSON objects in a row: format version, then the settings.
          command: [/opt/deluge/bin/python, -c]
          args:
            - |
              import json, os, shutil

              # Clean up the volume
              for entry in os.scandir('/config'):
                  if entry.is_dir(follow_symlinks=False):
                      shutil.rmtree(entry.path)
                  else:
                      os.remove(entry.path)

              os.makedirs('/config/plugins/.python-eggs')

              def write_config(path, version, settings):
                  with open(path, 'w') as f:
                      f.write(json.dumps({'file': version, 'format': 1}, indent=2) + '\n')
                      f.write(json.dumps(settings, indent=2) + '\n')

              # web.conf: deluge-web's interface configuration
              write_config('/config/web.conf', 2, {
                  'base': '/',
                  'https': False,
                  'cert': 'ssl/daemon.cert',
                  'pkey': 'ssl/daemon.pkey',
                  'default_daemon': '',
                  'enabled_plugins': [],
                  'first_login': False,
                  'interface': '0.0.0.0',
                  'language': '',
                  'port': 8112,
                  'pwd_salt': os.environ['DELUGE_WEB_PASSWORD_SALT'],
                  'pwd_sha1': os.environ['DELUGE_WEB_PASSWORD_SHA1'],
                  'session_timeout': 3600,
                  'sessions': {},
                  'show_session_speed': True,
                  'show_sidebar': True,
                  'sidebar_multiple_filters': True,
                  'sidebar_show_zero': True,
                  'theme': 'gray',
              })

              # hostlist.conf: the daemon deluge-web connects to
              write_config('/config/hostlist.conf', 3, {
                  'hosts': [[
                      '60fd37b1be6940388eae58b4628680c2',
                      'daemon',
                      58846,
                      os.environ['DELUGED_USERNAME'],
                      os.environ['DELUGED_PASSWORD'],
                  ]],
              })
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 24Mi}
          envFrom:
            - secretRef: {name: deluge-credentials}
          volumeMounts:
            - {name: deluge-web-config-volume, mountPath: /config}
      containers:
        - name: deluge-web
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/deluge/Dockerfile
          image: ghcr.io/sebastka/deluge:2.2.0@sha256:128a19d7b473151bc7598242098f98f4eac889d4e80f5c4c9a782ce55719a760
          command:
            - /opt/deluge/bin/deluge-web
            - --config=/config
            - --loglevel=info
            - --pidfile=/tmp/deluge-web.pid
            - --do-not-daemonize
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 128Mi}
          ports:
            - {name: http, containerPort: 8112}
          startupProbe: {httpGet: {port: 8112, path: /}, periodSeconds: 5, failureThreshold: 24}  # Up to 2 minutes
          livenessProbe: {httpGet: {port: 8112, path: /}, periodSeconds: 60, failureThreshold: 3}
          readinessProbe: {httpGet: {port: 8112, path: /}, periodSeconds: 15}
          env:
            - {name: TZ, value: Europe/Oslo}
            - {name: SSL_CERT_FILE, value: /etc/ssl/certs/cluster-root-ca.crt}  # Python's RPC client does not validate TLS certs by default, so this should not be needed.
            # - {name: DELUGE_BIN, value: deluge-web}
          volumeMounts:
            - {name: deluge-web-config-volume, mountPath: /config}
            - {name: cluster-ca-volume, mountPath: /etc/ssl/certs/cluster-root-ca.crt, subPath: cluster-root-ca.crt, readOnly: true}
            - {name: tmp-volume, mountPath: /tmp}
      volumes:
        - {name: deluge-web-config-volume, emptyDir: {}}
        - {name: cluster-ca-volume, configMap: {name: cluster-ca-bundle}}
        - {name: tmp-volume, emptyDir: {}}
