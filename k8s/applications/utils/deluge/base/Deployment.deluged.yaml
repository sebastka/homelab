---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluged
  namespace: deluge
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deluged
      # app.kubernetes.io/version: stable
      app.kubernetes.io/component: server
      app.kubernetes.io/part-of: deluge
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: deluge
      labels:
        app.kubernetes.io/name: deluged
        # app.kubernetes.io/version: stable
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: deluge
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: deluged
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: deluged-init
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/deluge/Dockerfile
          image: ghcr.io/sebastka/deluge:2.2.0@sha256:67d5c7aac5278c3d0b8f45a002327d6619e9a90d56302753da09b17f74fce968
          # The image has no shell: Python, from Deluge's own virtualenv
          command: [/opt/deluge/bin/python, -c]
          args:
            - |
              import os, shutil
              os.makedirs('/config/plugins/.python-eggs', exist_ok=True)
              for name in ('auth', 'core.conf', 'autoadd.conf', 'daemon.cert', 'daemon.pkey'):  # label.conf
                  if os.path.lexists(f'/config/{name}'):
                      os.remove(f'/config/{name}')
              for name in ('core.conf', 'autoadd.conf'):
                  shutil.copy(f'/tmp/{name}', f'/config/{name}')
              with open('/config/auth', 'w') as f:
                  f.write(f"{os.environ['DELUGED_USERNAME']}:{os.environ['DELUGED_PASSWORD']}:10\n")
              shutil.copy('/mnt/tls/tls.crt', '/config/daemon.cert')
              shutil.copy('/mnt/tls/tls.key', '/config/daemon.pkey')
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 24Mi}
          envFrom:
            - secretRef: {name: deluge-credentials}
          volumeMounts:
            - {name: deluged-conf-volume, mountPath: /tmp/core.conf, subPath: core.conf}
            - {name: deluged-conf-volume, mountPath: /tmp/autoadd.conf, subPath: autoadd.conf}
            # - {name: deluged-conf-volume, mountPath: /tmp/label.conf, subPath: label.conf}
            - {name: deluged-config-volume, mountPath: /config}
            - {name: deluged-tls-volume, mountPath: /mnt/tls, readOnly: true}
      containers:
        - name: deluged
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/deluge/Dockerfile
          image: ghcr.io/sebastka/deluge:2.2.0@sha256:67d5c7aac5278c3d0b8f45a002327d6619e9a90d56302753da09b17f74fce968
          command:
            - /opt/deluge/bin/deluged
            - --config=/config
            - --loglevel=info
            - --pidfile=/tmp/deluged.pid
            - --do-not-daemonize
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            # ghcr.io/sebastka/deluge (libtorrent 2.1.1, Python 3.13) needs about twice the memory
            # of home-operations' image: 256Mi was OOMKilled while loading torrents. Generous until
            # its steady state is known.
            requests: {memory: 256Mi}
            limits: {memory: 1024Mi}
          ports:
            - {name: daemon, containerPort: 58846, protocol: TCP}
            - {name: torrent-tcp, containerPort: 6881, protocol: TCP}
            - {name: torrent-udp, containerPort: 6881, protocol: UDP}
          startupProbe: {tcpSocket: {port: 58846}, periodSeconds: 5, failureThreshold: 60}  # Up to 5 minutes
          livenessProbe: {tcpSocket: {port: 58846}, periodSeconds: 60, failureThreshold: 3}
          readinessProbe: {tcpSocket: {port: 58846}, periodSeconds: 15}
          env:
            - {name: TZ, value: Europe/Oslo}
            # - {name: DELUGE_BIN, value: deluged}
          volumeMounts:
            - {name: deluged-config-volume, mountPath: /config}
            - {name: downloads-volume, mountPath: /downloads}
            - {name: tmp-volume, mountPath: /tmp}
      volumes:
        - {name: deluged-conf-volume, configMap: {name: deluged-conf}}
        - {name: deluged-config-volume, persistentVolumeClaim: {claimName: deluged-config-pvc}}
        - {name: downloads-volume, persistentVolumeClaim: {claimName: deluge-downloads-pvc}}
        - {name: deluged-tls-volume, secret: {secretName: deluged-tls}}
        - {name: tmp-volume, emptyDir: {}}
