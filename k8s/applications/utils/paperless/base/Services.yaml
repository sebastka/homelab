---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: paperless
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paperless
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
