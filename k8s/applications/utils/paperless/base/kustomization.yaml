  - BackendTrafficPolicy.yaml
  - CiliumNetworkPolicy.yaml

helmCharts:
  - name: paperless
    repo: oci://ghcr.io/sebastka/charts
    version: 0.1.16
    releaseName: paperless
    namespace: paperless
    valuesFile: values.yaml
