---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
  annotations:
    reloader.stakater.com/auto: 'true'
    argocd.argoproj.io/sync-wave: '2'
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
      # app.kubernetes.io/version: stable
      app.kubernetes.io/component: document-management
      app.kubernetes.io/part-of: paperless
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: paperless
      labels:
        app.kubernetes.io/name: paperless
        # app.kubernetes.io/version: stable
        app.kubernetes.io/component: document-management
        app.kubernetes.io/part-of: paperless
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: paperless
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The image's own Tesseract data, plus PAPERLESS_OCR_LANGUAGES from tesseract-ocr/tessdata, into TESSDATA_PREFIX (/mnt/tessdata)
        - name: tessdata
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command: [paperless-tessdata]
          envFrom:
            - configMapRef: {name: paperless-env}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: tessdata-volume, mountPath: /mnt/tessdata}
        # Mirrors the s6 init chain from the upstream image (ours has no s6, nor a shell: Python throughout)
        # Deliberately skipped: init-tesseract-langs, tessdata-sync and init-modify-user / init-env-file / init-custom-init
        # https://github.com/paperless-ngx/paperless-ngx/tree/dev/docker/rootfs/etc/s6-overlay/s6-rc.d
        - name: wait-for-db
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command: [paperless-wait-for-db]  # pg_isready's job, with psycopg
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
        - name: wait-for-redis
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command: [python3, /usr/local/bin/wait-for-redis.py]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
        - name: folders
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command:
            - python3
            - -c
            - |
              import os
              for path in (f"{os.environ['PAPERLESS_DATA_DIR']}/index",
                           f"{os.environ['PAPERLESS_MEDIA_ROOT']}/documents/originals",
                           f"{os.environ['PAPERLESS_MEDIA_ROOT']}/documents/thumbnails",
                           os.environ['PAPERLESS_CONSUMPTION_DIR'], os.environ['PAPERLESS_EMPTY_TRASH_DIR'],
                           '/usr/src/paperless/export'):
                  os.makedirs(path, exist_ok=True)
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
        - name: migrate
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command: [python3, manage.py, migrate, --noinput]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: llmindex-migrate
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command: [python3, manage.py, document_llmindex, migrate]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: reindex
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command: [python3, manage.py, document_index, reindex, --if-needed, --no-progress-bar]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: superuser
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command: [python3, manage.py, manage_superuser]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: system-checks
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command: [python3, manage.py, check]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
      containers:
        - name: consumer
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          # document_consumer stops cleanly on SIGINT (KeyboardInterrupt) but, as PID 1, would ignore
          # Kubernetes' SIGTERM: run it as a child and pass SIGTERM on as SIGINT
          command:
            - python3
            - -c
            - |
              import signal, subprocess, sys
              consumer = subprocess.Popen([sys.executable, 'manage.py', 'document_consumer'])
              for sig in (signal.SIGTERM, signal.SIGINT):
                  signal.signal(sig, lambda *_: consumer.send_signal(signal.SIGINT))
              sys.exit(consumer.wait())
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 512Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            - {name: scripts-volume, mountPath: /mnt/scripts/post-consumption.sh, subPath: post-consumption.sh, readOnly: true}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: scheduler
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command: [celery, "--app", "paperless", "beat", "--loglevel", "INFO"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 512Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
        - name: worker
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command: [celery, "--app", "paperless", "worker", "--loglevel", "INFO"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 4096Mi}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          # The worker's node name is celery@<hostname>, the pod's name (no shell to read $HOSTNAME)
          lifecycle: {preStop: {exec: {command: [celery, --app, paperless, control, shutdown, --destination, "celery@$(POD_NAME)"]}}}
          startupProbe: {exec: {command: [/usr/local/bin/worker-health]}, initialDelaySeconds: 10, periodSeconds: 60, timeoutSeconds: 10, failureThreshold: 3}
          livenessProbe: {exec: {command: [/usr/local/bin/worker-health]}, periodSeconds: 60, timeoutSeconds: 10, failureThreshold: 3}
          readinessProbe: {exec: {command: [/usr/local/bin/worker-health]}, periodSeconds: 60, timeoutSeconds: 10, failureThreshold: 3}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            - {name: scripts-volume, mountPath: /mnt/scripts/post-consumption.sh, subPath: post-consumption.sh, readOnly: true}
            - {name: scripts-volume, mountPath: /usr/local/bin/worker-health, subPath: worker-health.py, readOnly: true}
            - {name: scripts-volume, mountPath: /usr/local/bin/paperless-ai-review, subPath: paperless-ai-review.py, readOnly: true}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: webserver
          # Dockerfile: https://github.com/sebastka/containers/blob/main/apps/paperless/Dockerfile
          image: ghcr.io/sebastka/paperless:3.3.1@sha256:fb06df2e309918de7df394a070bdef4d63ce724dcd7caf6fb438e974283f5538
          command: [granian, "--interface", "asginl", "--no-access-log", "--ws", "paperless.asgi:application"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 384Mi}
            limits: {memory: 768Mi}
          env:
            - {name: DJANGO_SETTINGS_MODULE, value: webserver}
            - {name: PYTHONPATH, value: /mnt/settings}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          ports:
            - {name: http, protocol: TCP, containerPort: 8000}
          startupProbe: {httpGet: {port: 8000, path: /}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 12}
          livenessProbe: {httpGet: {port: 8000, path: /}, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3}
          readinessProbe: {httpGet: {port: 8000, path: /}, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            - {name: settings-volume, mountPath: /mnt/settings/webserver.py, subPath: webserver.py, readOnly: true}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
      volumes:
        - {name: tmp-volume, emptyDir: {}}
        - {name: cache-volume, emptyDir: {}}
        - {name: scripts-volume, configMap: {name: paperless-scripts, defaultMode: 493}}  # 0o755 = 493
        - {name: settings-volume, configMap: {name: paperless-settings}}
        - {name: tessdata-volume, emptyDir: {sizeLimit: 256Mi}}
        - {name: paperless-data-volume, persistentVolumeClaim: {claimName: paperless-data-pvc}}
