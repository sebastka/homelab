---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: websocket-timeout
  namespace: paperless
spec:
  mergeType: StrategicMerge  # Merge with the Gateway-scoped policy so the rate limit there still applies here.
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: paperless}
  timeout: {http: {maxStreamDuration: 0s}}
