# Create: kubectl create secret --dry-run=client generic -n paperless paperless-secrets -o yaml --from-literal=paperless-redis=XX --from-literal=paperless-dbpass=XX --from-literal=paperless-secret-key=XX --from-literal=paperless-admin-password=XX
# Ksops:
# - Encrypt: sops -e Secret.paperless-secrets.yaml > Secret.paperless-secrets.enc.yaml
# - Decrypt: sops -d Secret.paperless-secrets.enc.yaml > Secret.paperless-secrets.yaml
# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.paperless-secrets.yaml >SealedSecret.paperless-secrets.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: paperless-secrets
  namespace: paperless
spec:
  encryptedData:
    paperless-admin-password: 
    paperless-dbpass: 
    paperless-redis: 
    paperless-secret-key: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: paperless-secrets
      namespace: paperless
