---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: paperless-secrets
  namespace: paperless
spec:
  encryptedData:
    PAPERLESS_ADMIN_PASSWORD: 
    PAPERLESS_DBPASS: 
    PAPERLESS_EMAIL_HOST_PASSWORD: 
    PAPERLESS_SECRET_KEY: 
    PAPERLESS_SOCIALACCOUNT_PROVIDERS: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: paperless-secrets
      namespace: paperless
