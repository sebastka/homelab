---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless-httproute
  namespace: paperless
spec:
  parentRefs:
    - {namespace: gateway, name: internal, sectionName: https-wc-karlsen-app}
    # - {namespace: gateway, name: external, sectionName: https-wc-karlsen-app}
  hostnames:
    - paperless.karlsen.app
  rules:
    - backendRefs:
        - name: paperless-service
          port: 8000
      matches:
        - path:
            type: PathPrefix
            value: /
