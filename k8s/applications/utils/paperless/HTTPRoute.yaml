---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: paperless
spec:
  parentRefs:
    - {namespace: gateway, name: default, sectionName: https-wc-karlsen-app}
  hostnames: [paperless.karlsen.app]
  rules:
    # POST /api/token/ mints a long-lived API token from a native username/password and ignores
    # PAPERLESS_DISABLE_REGULAR_LOGIN (PaperlessAuthTokenSerializer calls django authenticate()
    # directly). Answered by Envoy so the native credential path is closed at the edge. Issue
    # tokens from the UI instead. PathPrefix covers /api/token and /api/token/ in one match, and
    # a longer prefix wins over the / rule below regardless of ordering.
    - matches: [path: {type: PathPrefix, value: /api/token}]
      filters:
        - {type: ExtensionRef, extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: deny-api-token}}
    # Django's admin login calls django.contrib.auth.authenticate() directly and never reaches
    # allauth's adapter, so PAPERLESS_DISABLE_REGULAR_LOGIN does not cover it - it served a full
    # username/password form to the Internet. Only /admin/login is blocked: /admin itself stays
    # usable for a session already established through OIDC.
    - matches: [path: {type: PathPrefix, value: /admin/login}]
      filters:
        - {type: ExtensionRef, extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: deny-admin-login}}
    - matches: [path: {type: PathPrefix, value: /}]
      backendRefs: [{name: web, kind: Service, port: 80}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              # - {name: Access-Control-Allow-Origin, value: '*'}
              - {name: Content-Security-Policy, value: "default-src 'self'; script-src-elem 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; form-action 'self'; base-uri 'self';"}
              - {name: Strict-Transport-Security, value: 'max-age=31536000; includeSubDomains; preload'}
              # - {name: X-Content-Type-Options, value: nosniff}  # Already set in application
              # - {name: X-Frame-Options, value: SAMEORIGIN}  # Already set in application
              - {name: Cross-Origin-Resource-Policy, value: same-origin}
              - {name: Cross-Origin-Embedder-Policy, value: require-corp}
              # - {name: Cross-Origin-Opener-Policy, value: same-origin}  # Already set in application
              # - {name: Referrer-Policy, value: same-origin}
              - {name: Permissions-Policy, value: 'accelerometer=(), autoplay=(), camera=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()'}
              - {name: Integrity-Policy, value: 'blocked-destinations=(style),sources=(inline)'}
              # - {name: Reporting-Endpoints, value: ''}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: deny-api-token
  namespace: paperless
spec:
  directResponse:
    contentType: application/json
    statusCode: 403
    body:
      type: Inline
      # Bodies are parsed for Envoy %command% operators: write a literal % as %%
      inline: '{"detail":"Password authentication is disabled. Sign in with SSO, or use an API token issued from the Paperless UI."}'
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: deny-admin-login
  namespace: paperless
spec:
  directResponse:
    contentType: text/html; charset=utf-8
    statusCode: 403
    body:
      type: Inline
      # Bodies are parsed for Envoy %command% operators: write a literal % as %%
      inline: '<!doctype html><meta charset="utf-8"><title>Blocked</title><p>The Django admin login form is disabled. <a href="/accounts/login/">Sign in with SSO</a> first, then open <a href="/admin/">/admin/</a>.'
