---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: paperless
spec:
  parentRefs:
    - {namespace: gateway, name: internal, sectionName: https-wc-karlsen-app}
    # - {namespace: gateway, name: external, sectionName: https-wc-karlsen-app}
  hostnames:
    - paperless.karlsen.app
  rules:
    - matches: [path: {type: PathPrefix, value: /}]
      backendRefs: [{name: web, kind: Service, port: 80}]
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - {name: X-Forwarded-Host, value: paperless.karlsen.app}
              - {name: Host, value: paperless.karlsen.app}
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            remove: [Referrer-Policy]
            add:
              # - {name: Access-Control-Allow-Origin, value: '*'}
              - {name: Content-Security-Policy, value: "default-src 'self'; script-src-elem 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; form-action 'self'; base-uri 'self';"}
              - {name: Strict-Transport-Security, value: 'max-age=31536000; includeSubDomains; preload'}
              # - {name: X-Content-Type-Options, value: nosniff}  # Already set in application
              # - {name: X-Frame-Options, value: SAMEORIGIN}  # Already set in application
              - {name: Cross-Origin-Resource-Policy, value: same-origin}
              - {name: Cross-Origin-Embedder-Policy, value: require-corp}
              # - {name: Cross-Origin-Opener-Policy, value: same-origin}  # Already set in application
              - {name: Referrer-Policy, value: no-referrer}
              - {name: Permissions-Policy, value: 'accelerometer=(), autoplay=(), camera=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()'}
              - {name: Integrity-Policy, value: 'blocked-destinations=(style),sources=(inline)'}
              # - {name: Reporting-Endpoints, value: ''}
