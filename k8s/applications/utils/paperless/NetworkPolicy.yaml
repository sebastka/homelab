---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: paperless
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# All pods need DNS to resolve service names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: paperless
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
# HTTPRoute in the envoy namespace routes HTTPS to the webserver container.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-envoy-to-webserver
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperless
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - {port: 8000, protocol: TCP}
---
# Paperless pods reach valkey, tika, gotenberg, and postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-paperless-egress
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paperless
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - {port: 6379, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tika
      ports:
        - {port: 9998, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gotenberg
      ports:
        - {port: 3000, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-database
      ports:
        - {port: 5432, protocol: TCP}
    # Init container fetches Tesseract trained data from GitHub on every pod start.
    # NetworkPolicy can't scope this to init containers only, so all paperless
    # containers get port-443 egress as a side effect.
    - ports:
        - {port: 443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-valkey-from-paperless
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paperless
      ports:
        - {port: 6379, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tika-from-paperless
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tika
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paperless
      ports:
        - {port: 9998, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gotenberg-from-paperless
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gotenberg
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paperless
      ports:
        - {port: 3000, protocol: TCP}
