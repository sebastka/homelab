# Rootless? https://github.com/paperless-ngx/paperless-ngx/discussions/4019
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      namespace: paperless
      labels:
        app.kubernetes.io/name: paperless
        app: paperless
    spec:
      securityContext:
        runAsNonRoot: true
        # runAsUser: 999
        # runAsGroup: 999
        # fsGroup: 999
        # fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 750m
          memory: 450Mi
        limits:
          cpu: 1500m
          memory: 1500Mi
      containers:
        - name: gotenberg
          image: index.docker.io/gotenberg/gotenberg:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 500Mi
          args:
            - gotenberg
            - --chromium-disable-javascript=true
            - --chromium-allow-list=file:///tmp/.*
          ports:
            - containerPort: 3000

        - name: tika
          image: index.docker.io/apache/tika:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 35002
            runAsGroup: 35002
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 500Mi
          ports:
            - containerPort: 9998

        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem: true
            # capabilities:
            #   drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 250Mi
            limits:
              cpu: 500m
              memory: 500Mi
          envFrom:
            - configMapRef:
                name: paperless-config
          env:
            - name: PAPERLESS_REDIS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: paperless-redis
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: paperless-dbpass
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: paperless-secret-key
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: paperless-admin-password
          ports:
            - containerPort: 8000
          volumeMounts:
            - mountPath: /data/data
              name: paperless-data
            - mountPath: /data/media
              name: paperless-media
            - mountPath: /data/export
              name: paperless-export
            - mountPath: /data/consume
              name: paperless-consume
      volumes:
        - name: paperless-consume
          persistentVolumeClaim:
            claimName: longhorn-paperless-consume-pvc
        - name: paperless-data
          persistentVolumeClaim:
            claimName: longhorn-paperless-data-pvc
        - name: paperless-export
          persistentVolumeClaim:
            claimName: longhorn-paperless-export-pvc
        - name: paperless-media
          persistentVolumeClaim:
            claimName: longhorn-paperless-media-pvc
