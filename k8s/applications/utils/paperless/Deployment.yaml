---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
  template:
    metadata:
      namespace: paperless
      labels:
        app.kubernetes.io/name: paperless
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: paperless-custom-init
          image: ghcr.io/paperless-ngx/paperless-ngx:latest
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux

              # Clean up volumes
              for d in customizations; do [ ! -d "/$d" ] || { rm -rf "/$d"/* "/$d"/.[!.]*; }; done

              # Fetch trained data for Tesseract OCR
              # Use the existing PAPERLESS_OCR_LANGUAGES var
              for lang in $PAPERLESS_OCR_LANGUAGES; do
                curl -sLO --output-dir /customizations "https://raw.githubusercontent.com/tesseract-ocr/tessdata/refs/heads/main/${lang}.traineddata"
              done

              # Force cookies to use samesite, httponly and secure
              {
                cat /usr/src/paperless/src/paperless/settings.py
                cat /scripts/extra_settings.py
              } >/customizations/settings.py
          envFrom:
            - configMapRef: {name: paperless-env}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: paperless-scripts-volume, mountPath: /scripts/extra_settings.py, subPath: extra_settings.py, readOnly: true}
            - {name: customizations-volume, mountPath: /customizations}
      containers:
        - name: paperless-consumer
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:latest
          command: [python3, "manage.py", "document_consumer"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          volumeMounts:
            - {name: paperless-tmp-volume, mountPath: /tmp}
            - {name: paperless-cache-volume, mountPath: /var/cache}
            - {name: paperless-data, mountPath: /data/data}
            - {name: paperless-media, mountPath: /data/media}
            - {name: paperless-export, mountPath: /data/export}
            - {name: paperless-consume, mountPath: /data/consume}
            - {name: paperless-scripts-volume, mountPath: /scripts/post-consumption.sh, subPath: post-consumption.sh, readOnly: true}
            - {name: customizations-volume, mountPath: /usr/share/tesseract-ocr/5/tessdata/nor.traineddata, subPath: nor.traineddata, readOnly: true}
            - {name: customizations-volume, mountPath: /usr/src/paperless/src/paperless/settings.py, subPath: settings.py, readOnly: true}
        - name: paperless-scheduler
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:latest
          command: [celery, "--app", "paperless", "beat", "--loglevel", "INFO"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          volumeMounts:
            - {name: paperless-tmp-volume, mountPath: /tmp}
            - {name: paperless-cache-volume, mountPath: /var/cache}
            - {name: paperless-data, mountPath: /data/data}
            - {name: paperless-media, mountPath: /data/media}
            - {name: paperless-export, mountPath: /data/export}
            - {name: paperless-consume, mountPath: /data/consume}
            - {name: paperless-scripts-volume, mountPath: /scripts/post-consumption.sh, subPath: post-consumption.sh, readOnly: true}
            - {name: customizations-volume, mountPath: /usr/share/tesseract-ocr/5/tessdata/nor.traineddata, subPath: nor.traineddata, readOnly: true}
            - {name: customizations-volume, mountPath: /usr/src/paperless/src/paperless/settings.py, subPath: settings.py, readOnly: true}
        - name: paperless-task-queue
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:latest
          command: [celery, "--app", "paperless", "worker", "--loglevel", "INFO"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 512Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          volumeMounts:
            - {name: paperless-tmp-volume, mountPath: /tmp}
            - {name: paperless-cache-volume, mountPath: /var/cache}
            - {name: paperless-data, mountPath: /data/data}
            - {name: paperless-media, mountPath: /data/media}
            - {name: paperless-export, mountPath: /data/export}
            - {name: paperless-consume, mountPath: /data/consume}
            - {name: paperless-scripts-volume, mountPath: /scripts/post-consumption.sh, subPath: post-consumption.sh, readOnly: true}
            - {name: customizations-volume, mountPath: /usr/share/tesseract-ocr/5/tessdata/nor.traineddata, subPath: nor.traineddata, readOnly: true}
            - {name: customizations-volume, mountPath: /usr/src/paperless/src/paperless/settings.py, subPath: settings.py, readOnly: true}
        - name: paperless-webserver
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:latest
          command: [granian, "--interface", "asginl", "--ws", "paperless.asgi:application"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 512Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          ports:
            - {name: http, containerPort: 8000}
          volumeMounts:
            - {name: paperless-tmp-volume, mountPath: /tmp}
            - {name: paperless-cache-volume, mountPath: /var/cache}
            - {name: paperless-data, mountPath: /data/data}
            - {name: paperless-media, mountPath: /data/media}
            - {name: paperless-export, mountPath: /data/export}
            - {name: paperless-consume, mountPath: /data/consume}
            - {name: paperless-scripts-volume, mountPath: /scripts/post-consumption.sh, subPath: post-consumption.sh, readOnly: true}
            - {name: customizations-volume, mountPath: /usr/share/tesseract-ocr/5/tessdata/nor.traineddata, subPath: nor.traineddata, readOnly: true}
            - {name: customizations-volume, mountPath: /usr/src/paperless/src/paperless/settings.py, subPath: settings.py, readOnly: true}
        - name: gotenberg
          # Dockerfile: https://github.com/gotenberg/gotenberg/blob/main/build/Dockerfile
          image: index.docker.io/gotenberg/gotenberg:latest
          args:
            - gotenberg
            - --chromium-disable-javascript=true
            - --chromium-allow-list=file:///tmp/.*
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
        - name: tika
          # Dockerfile: https://github.com/apache/tika-docker/blob/main/minimal/Dockerfile
          image: index.docker.io/apache/tika:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            runAsUser: 35002
            runAsGroup: 35002
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tika-tmp-volume, mountPath: /tmp}
      volumes:
        - {name: paperless-tmp-volume, emptyDir: {}}
        - {name: paperless-cache-volume, emptyDir: {}}
        - {name: tika-tmp-volume, emptyDir: {}}
        - {name: paperless-consume, persistentVolumeClaim: {claimName: longhorn-paperless-consume-pvc}}
        - {name: paperless-data, persistentVolumeClaim: {claimName: longhorn-paperless-data-pvc}}
        - {name: paperless-export, persistentVolumeClaim: {claimName: longhorn-paperless-export-pvc}}
        - {name: paperless-media, persistentVolumeClaim: {claimName: longhorn-paperless-media-pvc}}
        - {name: paperless-scripts-volume, configMap: {name: paperless-scripts}}
        - {name: customizations-volume, emptyDir: {}}
