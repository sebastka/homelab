# Rootless? https://github.com/paperless-ngx/paperless-ngx/discussions/4019
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  template:
    spec:
      volumes:
        - name: paperless-consume
          persistentVolumeClaim:
            claimName: longhorn-paperless-consume-pvc
        - name: paperless-data
          persistentVolumeClaim:
            claimName: longhorn-paperless-data-pvc
        - name: paperless-export
          persistentVolumeClaim:
            claimName: longhorn-paperless-export-pvc
        - name: paperless-media
          persistentVolumeClaim:
            claimName: nfs-paperless-media-pvc
      containers:
        - name: gotenberg
          image: index.docker.io/gotenberg/gotenberg:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          args:
            - gotenberg
            - --chromium-disable-javascript=true
            - --chromium-allow-list=file:///tmp/.*

        - name: tika
          image: index.docker.io/apache/tika:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9998
          securityContext:
            runAsUser: 35002
            runAsGroup: 35002
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          securityContext:
            # runAsUser: 1000
            # runAsGroup: 1003
            # fsGroup: 1003
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            # runAsNonRoot: true
            # capabilities:
            #   drop:
            #     - ALL
          envFrom:
            - configMapRef:
                name: paperless-config
          env:
            - name: PAPERLESS_REDIS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: paperless-redis
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: paperless-dbpass
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: paperless-secret-key
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: paperless-admin-password
          volumeMounts:
            - mountPath: /data/data
              name: paperless-data
            - mountPath: /data/media
              name: paperless-media
            - mountPath: /data/export
              name: paperless-export
            - mountPath: /data/consume
              name: paperless-consume
