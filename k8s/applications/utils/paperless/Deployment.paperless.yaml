---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
      app.kubernetes.io/version: stable
      app.kubernetes.io/component: document-management
      app.kubernetes.io/part-of: paperless
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: paperless
      labels:
        app.kubernetes.io/name: paperless
        app.kubernetes.io/version: stable
        app.kubernetes.io/component: document-management
        app.kubernetes.io/part-of: paperless
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: paperless
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: git-sync-tesseract
          # Dockerfile: https://github.com/kubernetes/git-sync/blob/master/Dockerfile.in
          image: registry.k8s.io/git-sync/git-sync:v4.6.0  # renovate: docker=registry.k8s.io/git-sync/git-sync
          args:
            - --repo=https://github.com/tesseract-ocr/tessdata.git
            - --root=/mnt/tessdata
            - --one-time
            - --sync-timeout=1800s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: GIT_CONFIG_NOSYSTEM, value: 'true'}
            - {name: GIT_CONFIG_NOGLOBAL, value: 'true'}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: paperless-data-volume, mountPath: /mnt/tessdata, subPath: tessdata}
            - {name: tmp-volume, mountPath: /tmp}
        - name: fetch-tesseract-data
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux

              # Fetch trained data for Tesseract OCR
              # Use the existing PAPERLESS_OCR_LANGUAGES var
              for lang in $PAPERLESS_OCR_LANGUAGES; do
                rm -f "/usr/share/tesseract-ocr/5/tessdata/${lang}.traineddata"
                curl -sLO --output-dir /usr/share/tesseract-ocr/5/tessdata/ "https://raw.githubusercontent.com/tesseract-ocr/tessdata/refs/heads/main/${lang}.traineddata"
              done
          envFrom:
            - configMapRef: {name: paperless-env}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: tesseract-volume, mountPath: /usr/share/tesseract-ocr/5/tessdata/}
        - name: migrate
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
          command: [python3, manage.py, migrate, --noinput]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: tesseract-volume, mountPath: /usr/share/tesseract-ocr/5/tessdata/nor.traineddata, subPath: nor.traineddata, readOnly: true}
            - {name: paperless-data-volume, mountPath: /mnt/tessdata, subPath: tessdata, readOnly: true}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
      containers:
        - name: consumer
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
          command: [python3, "manage.py", "document_consumer"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 512Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            - {name: scripts-volume, mountPath: /mnt/scripts/post-consumption.sh, subPath: post-consumption.sh, readOnly: true}
            - {name: tesseract-volume, mountPath: /usr/share/tesseract-ocr/5/tessdata/nor.traineddata, subPath: nor.traineddata, readOnly: true}
            - {name: paperless-data-volume, mountPath: /mnt/tessdata, subPath: tessdata, readOnly: true}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
        - name: scheduler
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
          command: [celery, "--app", "paperless", "beat", "--loglevel", "INFO"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 512Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
        - name: worker
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
          command: [celery, "--app", "paperless", "worker", "--loglevel", "INFO"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 3Gi}
            limits: {memory: 3Gi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            - {name: scripts-volume, mountPath: /mnt/scripts/post-consumption.sh, subPath: post-consumption.sh, readOnly: true}
            - {name: tesseract-volume, mountPath: /usr/share/tesseract-ocr/5/tessdata/nor.traineddata, subPath: nor.traineddata, readOnly: true}
            - {name: paperless-data-volume, mountPath: /mnt/tessdata, subPath: tessdata}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
        - name: webserver
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
          command: [granian, "--interface", "asginl", "--no-access-log", "--ws", "paperless.asgi:application"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 768Mi}
            limits: {memory: 768Mi}
          env:
            - {name: DJANGO_SETTINGS_MODULE, value: webserver}
            - {name: PYTHONPATH, value: /mnt/settings}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          ports:
            - {name: http, protocol: TCP, containerPort: 8000}
          startupProbe: {httpGet: {port: 8000, path: /}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 12}
          livenessProbe: {httpGet: {port: 8000, path: /}, periodSeconds: 30}
          readinessProbe: {httpGet: {port: 8000, path: /}, periodSeconds: 30}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            - {name: settings-volume, mountPath: /mnt/settings/webserver.py, subPath: webserver.py, readOnly: true}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
      volumes:
        - {name: tmp-volume, emptyDir: {}}
        - {name: cache-volume, emptyDir: {}}
        - {name: tesseract-volume, emptyDir: {}}
        - {name: scripts-volume, configMap: {name: paperless-scripts}}
        - {name: settings-volume, configMap: {name: paperless-settings}}
        - {name: paperless-data-volume, persistentVolumeClaim: {claimName: paperless-data-pvc}}
