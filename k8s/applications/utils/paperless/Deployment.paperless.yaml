      #       - {name: customizations-volume, mountPath: /customizations}
      containers:
        - name: paperless-consume-volumer
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.14
          command: [python3, "manage.py", "document_consumer"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            - {name: scripts-volume, mountPath: /scripts/post-consumption.sh, subPath: post-consumption.sh, readOnly: true}
            - {name: customizations-volume, mountPath: /usr/share/tesseract-ocr/5/tessdata/nor.traineddata, subPath: nor.traineddata, readOnly: true}
            # - {name: customizations-volume, mountPath: /usr/src/paperless/src/paperless/settings.py, subPath: settings.py, readOnly: true}
            - {name: paperless-consume-volume, mountPath: /usr/src/paperless/consume}
            - {name: paperless-export-volume, mountPath: /usr/src/paperless/export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data}
            - {name: paperless-media-volume, mountPath: /usr/src/paperless/media}
