---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
  annotations:
    reloader.stakater.com/auto: "true"
    argocd.argoproj.io/sync-wave: '2'
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
      app.kubernetes.io/version: stable
      app.kubernetes.io/component: document-management
      app.kubernetes.io/part-of: paperless
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: paperless
      labels:
        app.kubernetes.io/name: paperless
        app.kubernetes.io/version: stable
        app.kubernetes.io/component: document-management
        app.kubernetes.io/part-of: paperless
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: paperless
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: tessdata-sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.1  # renovate: datasource=docker depName=registry.k8s.io/git-sync/git-sync
          args: [--repo=https://github.com/tesseract-ocr/tessdata.git, --root=/mnt/tessdata, --link=tessdata.git, --one-time, --sync-timeout=600s]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: tessdata-volume, mountPath: /mnt/tessdata}
            - {name: tmp-volume, mountPath: /tmp}
        # Mirrors the s6 init chain from the upstream image
        # Deliberately skipped: init-tesseract-langs, tessdata-sync and init-modify-user / init-env-file / init-custom-init
        # https://github.com/paperless-ngx/paperless-ngx/tree/dev/docker/rootfs/etc/s6-overlay/s6-rc.d
        - name: wait-for-db
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command: [sh, -c, "until pg_isready -h \"$PAPERLESS_DBHOST\" -U \"$PAPERLESS_DBUSER\"; do sleep 2; done"]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 64Mi}
        - name: wait-for-redis
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command: [python3, /usr/local/bin/wait-for-redis.py]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
        - name: folders
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command: [sh, -c, 'mkdir -p "$PAPERLESS_DATA_DIR/index" "$PAPERLESS_MEDIA_ROOT/documents/originals" "$PAPERLESS_MEDIA_ROOT/documents/thumbnails" "$PAPERLESS_CONSUMPTION_DIR" "$PAPERLESS_EMPTY_TRASH_DIR" /usr/src/paperless/export']
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
        - name: migrate
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command: [python3, manage.py, migrate, --noinput]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: llmindex-migrate
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command: [python3, manage.py, document_llmindex, migrate]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: reindex
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command: [python3, manage.py, document_index, reindex, --if-needed, --no-progress-bar]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: superuser
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command: [python3, manage.py, manage_superuser]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: system-checks
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command: [python3, manage.py, check]
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
      containers:
        - name: consumer
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command:  # Handle SIGTERM and SIGINT to allow graceful shutdown of the consumer process
            - sh
            - -c
            - |
              python3 manage.py document_consumer &
              pid=$!
              trap 'kill -TERM "$pid" 2>/dev/null' TERM INT
              wait "$pid"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 512Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            - {name: scripts-volume, mountPath: /mnt/scripts/post-consumption.sh, subPath: post-consumption.sh, readOnly: true}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: scheduler
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command: [celery, "--app", "paperless", "beat", "--loglevel", "INFO"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 512Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
        - name: worker
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command: [celery, "--app", "paperless", "worker", "--loglevel", "INFO"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 4096Mi}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          lifecycle: {preStop: {exec: {command: [sh, -c, "celery --app paperless control shutdown --destination celery@$HOSTNAME || true"]}}}
          startupProbe: {exec: {command: [/usr/local/bin/worker-health]}, initialDelaySeconds: 10, periodSeconds: 60, timeoutSeconds: 10, failureThreshold: 3}
          livenessProbe: {exec: {command: [/usr/local/bin/worker-health]}, periodSeconds: 60, timeoutSeconds: 10, failureThreshold: 3}
          readinessProbe: {exec: {command: [/usr/local/bin/worker-health]}, periodSeconds: 60, timeoutSeconds: 10, failureThreshold: 3}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            - {name: scripts-volume, mountPath: /mnt/scripts/post-consumption.sh, subPath: post-consumption.sh, readOnly: true}
            - {name: scripts-volume, mountPath: /usr/local/bin/worker-health, subPath: worker-health.sh, readOnly: true}
            - {name: scripts-volume, mountPath: /usr/local/bin/paperless-ai-review, subPath: paperless-ai-review.py, readOnly: true}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
            - {name: tessdata-volume, mountPath: /mnt/tessdata, readOnly: true}
        - name: webserver
          # Dockerfile: https://github.com/paperless-ngx/paperless-ngx/blob/dev/Dockerfile
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
          command: [granian, "--interface", "asginl", "--no-access-log", "--ws", "paperless.asgi:application"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 384Mi}
            limits: {memory: 768Mi}
          env:
            - {name: DJANGO_SETTINGS_MODULE, value: webserver}
            - {name: PYTHONPATH, value: /mnt/settings}
          envFrom:
            - configMapRef: {name: paperless-env}
            - secretRef: {name: paperless-secrets}
          ports:
            - {name: http, protocol: TCP, containerPort: 8000}
          startupProbe: {httpGet: {port: 8000, path: /}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 12}
          livenessProbe: {httpGet: {port: 8000, path: /}, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3}
          readinessProbe: {httpGet: {port: 8000, path: /}, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache}
            - {name: settings-volume, mountPath: /mnt/settings/webserver.py, subPath: webserver.py, readOnly: true}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/consume, subPath: paperless-consume}
            # - {name: paperless-data-volume, mountPath: /usr/src/paperless/export, subPath: paperless-export}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/data, subPath: paperless-data}
            - {name: paperless-data-volume, mountPath: /usr/src/paperless/media, subPath: paperless-media}
      volumes:
        - {name: tmp-volume, emptyDir: {}}
        - {name: cache-volume, emptyDir: {}}
        - {name: scripts-volume, configMap: {name: paperless-scripts, defaultMode: 493}}  # 0o755 = 493
        - {name: settings-volume, configMap: {name: paperless-settings}}
        - {name: tessdata-volume, persistentVolumeClaim: {claimName: paperless-tessdata-pvc}}
        - {name: paperless-data-volume, persistentVolumeClaim: {claimName: paperless-data-pvc}}
