---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-db
  namespace: cnpg-database
spec:
  instances: 1
  postgresql: {parameters: {timezone: Europe/Oslo}}
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret: {name: paperless-db-credentials}
  managed: {services: {disabledDefaultServices: [ro, r]}}
  resources:
    requests: {memory: 512Mi}
    limits: {memory: 512Mi}
  storage:
    size: 2Gi
    pvcTemplate:
      accessModes: [ReadWriteOncePod]
      storageClassName: longhorn-encrypted
      volumeMode: Filesystem
      volumeName: paperless-db-pv
