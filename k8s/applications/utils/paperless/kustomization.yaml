---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: paperless
      app: paperless

configMapGenerator:
  - name: paperless-config
    namespace: paperless
    envs:
      - paperless.env

resources:
  - Namespace.yaml
  - SealedSecret.paperless-secrets.yaml
  - PersistentVolumeClaim.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
