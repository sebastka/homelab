---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {name: paperless-env, envs: [assets/paperless.env]}
  - {name: paperless-settings, files: [webserver.py=assets/settings/webserver.py]}
  - {name: paperless-scripts, files: [post-consumption.sh=assets/scripts/post-consumption.sh, worker-health.sh=assets/scripts/worker-health.sh]}

components:
  - ../../../common/default-networkpolicy
  - ../../../common/valkey

patches:
  - target: {kind: CiliumNetworkPolicy, name: allow-valkey-ingress}
    patch: |
      - op: replace
        path: /spec/ingress/0/fromEndpoints/0/matchLabels/app.kubernetes.io~1name
        value: paperless

resources:
  - Namespace.yaml
  - SealedSecret.paperless-secrets.yaml
  - PersistentVolumeClaim.yaml
  - ServiceAccounts.yaml
  - Job.tessdata-sync.yaml
  - Deployment.paperless.yaml
  - Deployment.gotenberg.yaml
  - Deployment.tika.yaml
  - Services.yaml
  - HTTPRoute.yaml
  - BackendTrafficPolicy.yaml
  - SecurityPolicy.yaml
  - CiliumNetworkPolicy.paperless.yaml
  - CiliumNetworkPolicy.tika.yaml
  - CiliumNetworkPolicy.gotenberg.yaml
  - CiliumNetworkPolicy.tessdata-sync.yaml
