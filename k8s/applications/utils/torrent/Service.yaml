---
apiVersion: v1
kind: Service
metadata:
  name: torrent-service
  namespace: torrent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: torrent-tcp
      port: 6881
      targetPort: torrent-tcp
      protocol: TCP
