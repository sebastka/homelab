---
apiVersion: v1
kind: Service
metadata:
  name: torrent-service
  namespace: torrent
spec:
  type: ClusterIP
  selector:
    app: torrent
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: torrent-tcp
      port: 10011
      targetPort: torrent-tcp
    - name: torrent-udp
      port: 10011
      targetPort: torrent-udp
