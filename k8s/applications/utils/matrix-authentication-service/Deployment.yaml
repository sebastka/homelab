# https://github.com/element-hq/matrix-authentication-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-authentication-service
  namespace: matrix-authentication-service
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-authentication-service
      app.kubernetes.io/version: stable
      app.kubernetes.io/component: identity-provider
      app.kubernetes.io/part-of: matrix-authentication-service
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: matrix-authentication-service
      labels:
        app.kubernetes.io/name: matrix-authentication-service
        app.kubernetes.io/version: stable
        app.kubernetes.io/component: identity-provider
        app.kubernetes.io/part-of: matrix-authentication-service
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: matrix-authentication-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: config-merger
          image: docker.io/mikefarah/yq:4.53.3@sha256:11a1f0b604b13dbbdc662260d8db6f644b22d8553122a25c1b5b2e8713ca6977
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eu
              rm -f /config/config.yaml
              yq eval-all '.database.password = strenv(DATABASE_PASSWORD) | .email.username = strenv(EMAIL_USERNAME) | .email.password = strenv(EMAIL_PASSWORD)' /mnt/config.yaml \
                >/config/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 24Mi}
          env:
            - {name: DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: mas-secrets, key: DATABASE_PASSWORD}}}
            - {name: EMAIL_USERNAME, valueFrom: {secretKeyRef: {name: mas-secrets, key: EMAIL_USERNAME}}}
            - {name: EMAIL_PASSWORD, valueFrom: {secretKeyRef: {name: mas-secrets, key: EMAIL_PASSWORD}}}
          volumeMounts:
            - {name: config-volume, mountPath: /config}
            - {name: mas-config-volume, mountPath: /mnt/config.yaml, subPath: config.yaml, readOnly: true}
      containers:
        - name: matrix-authentication-service
          # Dockerfile: https://github.com/element-hq/matrix-authentication-service/blob/main/Dockerfile
          image: ghcr.io/element-hq/matrix-authentication-service:1.18.0@sha256:fa0de1cd3d02e07ab65e9730c927ec65155245911c61ac97d564e490bfefe373
          args: [--config, /config/config.yaml]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          ports:
            - {name: http, protocol: TCP, containerPort: 8080}
            - {name: health, protocol: TCP, containerPort: 8081}
          startupProbe: {httpGet: {port: 8081, path: /health}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {port: 8081, path: /health}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {httpGet: {port: 8081, path: /health}, initialDelaySeconds: 10, periodSeconds: 120}
          volumeMounts:
            - {name: config-volume, mountPath: /config, readOnly: true}
            - {name: mas-secrets, mountPath: /secrets/mas-secrets/matrix_secret, subPath: MATRIX_SECRET, readOnly: true}
            - {name: mas-secrets, mountPath: /secrets/mas-secrets/secrets_encryption, subPath: SECRETS_ENCRYPTION, readOnly: true}
            - {name: mas-secrets, mountPath: /secrets/mas-secrets/secrets_keys_0_key, subPath: SECRETS_KEYS_0_KEY, readOnly: true}
            - {name: mas-secrets, mountPath: /secrets/mas-secrets/secrets_keys_1_key, subPath: SECRETS_KEYS_1_KEY, readOnly: true}
            - {name: mas-secrets, mountPath: /secrets/mas-secrets/secrets_keys_2_key, subPath: SECRETS_KEYS_2_KEY, readOnly: true}
            - {name: mas-secrets, mountPath: /secrets/mas-secrets/secrets_keys_3_key, subPath: SECRETS_KEYS_3_KEY, readOnly: true}
            - {name: mas-secrets, mountPath: /secrets/mas-secrets/upstream_oauth2_provider_0_client_secret, subPath: UPSTREAM_OAUTH2_PROVIDERS_0_CLIENT_SECRET, readOnly: true}
      volumes:
        - {name: config-volume, emptyDir: {}}
        - {name: mas-config-volume, configMap: {name: mas-config}}
        - {name: mas-secrets, secret: {secretName: mas-secrets}}
