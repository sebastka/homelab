---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mas-secrets
  namespace: matrix-authentication-service
spec:
  encryptedData:
    DATABASE_PASSWORD: 
    EMAIL_PASSWORD: 
    EMAIL_USERNAME: 
    MATRIX_SECRET: 
    SECRETS_ENCRYPTION: 
    SECRETS_KEYS_0_KEY: 
    SECRETS_KEYS_1_KEY: 
    SECRETS_KEYS_2_KEY: 
    SECRETS_KEYS_3_KEY: 
    UPSTREAM_OAUTH2_PROVIDERS_0_CLIENT_SECRET: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: mas-secrets
      namespace: matrix-authentication-service
    type: Opaque
