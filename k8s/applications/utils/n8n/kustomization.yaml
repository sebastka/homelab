---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {namespace: n8n, name: n8n-env, envs: [assets/n8n.env]}

components:
  - ../../../common/valkey

patches:
  - target: {kind: CiliumNetworkPolicy, name: allow-valkey-ingress}
    patch: |
      - {op: replace, path: /spec/ingress/0/fromEndpoints/0/matchLabels/app.kubernetes.io~1name, value: n8n}
      - {op: replace, path: /spec/ingress/0/fromEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace, value: n8n}

resources:
  - Namespace.yaml
  - SealedSecret.oidc.yaml
  - SealedSecret.n8n-secrets.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
  - CiliumNetworkPolicy.main.yaml
  - CiliumNetworkPolicy.webhook-processor.yaml
  - CiliumNetworkPolicy.worker.yaml

helmCharts:
  - name: n8n
    repo: oci://ghcr.io/n8n-io/n8n-helm-chart
    version: 1.5.1  # renovate: datasource=github-releases depName=n8n-io/n8n-hosting
    releaseName: n8n
    namespace: n8n
    includeCRDs: true
    valuesFile: values.yaml
