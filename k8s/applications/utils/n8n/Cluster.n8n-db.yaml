---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db
  namespace: cnpg-database
spec:
  instances: 1
  postgresql: {parameters: {timezone: Europe/Oslo}}
  bootstrap:
    # initdb:
    #   database: n8n
    #   owner: n8n
    #   secret: {name: n8n-db-credentials}
    recovery:
      database: n8n
      owner: n8n
      secret: {name: n8n-db-credentials}
      volumeSnapshots:
        storage: {apiGroup: v1, kind: PersistentVolumeClaim, name: n8n-db-restore-pv}
  managed: {services: {disabledDefaultServices: [ro, r]}}
  resources:
    requests: {memory: 512Mi}
    limits: {memory: 512Mi}
  storage:
    size: 5Gi
    pvcTemplate:
      accessModes: [ReadWriteOncePod]
      storageClassName: longhorn-encrypted
      volumeMode: Filesystem
      volumeName: n8n-db-pv
