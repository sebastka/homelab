---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: valkey
  namespace: n8n
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/version: 9.0.3
      app.kubernetes.io/component: key-value-store
      app.kubernetes.io/part-of: opentogethertube
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: opentogethertube
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/version: 9.0.3
        app.kubernetes.io/component: key-value-store
        app.kubernetes.io/part-of: opentogethertube
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: valkey
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          # Dockerfile: https://github.com/valkey-io/valkey-container/blob/mainline/9.0/alpine/Dockerfile
          image: index.docker.io/valkey/valkey:9.0.3-alpine3.23
          args: [--save, ""]
          lifecycle: {preStop: {exec: {command: [sleep, "30"]}}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 64Mi, cpu: 100m}
          # env:
          #   - {name: VALKEY_EXTRA_FLAGS, value: '--save 60 1 --loglevel warning'}
          ports:
            - {name: valkey, protocol: TCP, containerPort: 6379}
