# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.searxng-secrets.yaml >SealedSecret.searxng-secrets.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: searxng-secrets
  namespace: searxng
spec:
  encryptedData:
    searxng-secret: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: searxng-secrets
      namespace: searxng
