---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      namespace: searxng
      labels:
        app.kubernetes.io/name: searxng
    spec:
      serviceAccount: searxng
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: searxng
          # Dockerfile: https://github.com/searxng/searxng/blob/master/container/dist.dockerfile
          image: docker.io/searxng/searxng:2026.4.11-9e08a6771
          command: ["/usr/local/searxng/.venv/bin/granian", "searx.webapp:app"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
          envFrom:
            - secretRef: {name: searxng-secrets}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /var/cache/searxng}
            - {name: searxng-config-volume, mountPath: /etc/searxng/settings.yml, subPath: settings.yaml, readOnly: true}
            - {name: searxng-config-volume, mountPath: /etc/searxng/limiter.toml, subPath: limiter.toml, readOnly: true}
        - name: valkey
          # Dockerfile: https://github.com/valkey-io/valkey-container/blob/mainline/9.0/alpine/Dockerfile
          image: index.docker.io/valkey/valkey:9.0.3-alpine3.23
          args: [--save, ""]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            runAsUser: 999
            runAsGroup: 1000
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 64Mi}
          # env:
          #   - {name: VALKEY_EXTRA_FLAGS, value: '--save 60 1 --loglevel warning'}
      volumes:
        - {name: tmp-volume, emptyDir: {}}
        - {name: cache-volume, emptyDir: {}}  # Use Longhorn if persistent data is needed
        - {name: searxng-config-volume, configMap: {name: searxng-config}}
