# https://docs.searxng.org/admin/settings/settings.html#settings-use-default-settings
# https://github.com/searxng/searxng/blob/master/searx/settings.yml
---
use_default_settings: true

general:
  debug: false
  enable_metrics: false
  open_metrics: ''

search:
  safe_search: 0
  # favicon_resolver: duckduckgo
  default_lang: en
  # languages: [en, de, fr, nb]

server:
  limiter: true  # enable this when running the instance for a public usage on the internet
  http_protocol_version: "1.1"

ui:
  default_locale: en
  results_on_new_tab: true
  # hotkeys: vim
  url_formatting: full
