---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: searxng

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {namespace: searxng, name: searxng-config, files: [settings.yaml=assets/settings.yaml, limiter.toml=assets/limiter.toml]}

components:
  - ../../../common/valkey

patches:
  - target: {kind: CiliumNetworkPolicy, name: allow-valkey-ingress}
    patch: |
      - op: replace
        path: /spec/ingress/0/fromEndpoints/0/matchLabels/app.kubernetes.io~1name
        value: searxng

resources:
  - Namespace.yaml
  - SealedSecret.searxng-secrets.yaml
  - ServiceAccount.yaml
  - Deployment.searxng.yaml
  - Deployment.valkey.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - SealedSecret.oidc.yaml
  - SecurityPolicy.yaml
