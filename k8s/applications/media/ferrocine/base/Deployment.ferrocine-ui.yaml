---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrocine-ui
  namespace: ferrocine
  labels:
    app.kubernetes.io/name: ferrocine-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrocine-ui
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrocine-ui
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: ferrocine
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: ferrocine-ui
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ferrocine-ui
          # Dockerfile: https://github.com/sebastka/ferrocine-ui/blob/master/Dockerfile
          image: ghcr.io/sebastka/ferrocine-ui:2026-10-23.1@sha256:0f79afa42b2ca59becfc9163bbca6076962945c57a3814aaf061cc466288b7e4
          env:
            # nginx resolves it at run time with the pod's nameserver, without search domains: the full name
            - {name: FERROCINE_UPSTREAM, value: 'http://ferrocine.ferrocine.svc.cluster.local:8096'}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 16Mi}
            limits: {memory: 64Mi}
          ports:
            - {name: http, protocol: TCP, containerPort: 8080}
          livenessProbe:  {httpGet: {port: http, path: /ui-healthz}, periodSeconds: 30}
          readinessProbe: {httpGet: {port: http, path: /ui-healthz}, periodSeconds: 10}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp, readOnly: false}
      volumes:
        - {name: tmp-volume, emptyDir: {sizeLimit: 64Mi}}
