---
apiVersion: v1
kind: Service
metadata:
  name: ferrocine
  namespace: ferrocine
  labels:
    app.kubernetes.io/name: ferrocine
spec:
  selector: {app.kubernetes.io/name: ferrocine, app.kubernetes.io/component: server}
  ports: [{name: http, protocol: TCP, port: 8096, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: ferrocine-ui
  namespace: ferrocine
  labels:
    app.kubernetes.io/name: ferrocine-ui
spec:
  selector: {app.kubernetes.io/name: ferrocine-ui, app.kubernetes.io/component: web}
  ports: [{name: http, protocol: TCP, port: 80, targetPort: http}]
