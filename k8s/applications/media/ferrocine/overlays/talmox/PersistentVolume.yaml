---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ferrocine-media-pv
  labels:
    app.kubernetes.io/name: ferrocine
spec:
  accessModes: [ReadOnlyMany]
  capacity: {storage: 1Gi}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  claimRef: {namespace: ferrocine, name: ferrocine-media-pvc}
  nfs:
    server: file01.hera.home.karlsen.fr
    path: /mnt/nfs/homelab/k8s
    readOnly: true
