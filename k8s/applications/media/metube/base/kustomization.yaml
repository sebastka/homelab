---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metube

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {name: metube-env, envs: [assets/metube.env]}
  - {name: ytdl-options, files: [ytdl-options.json=assets/ytdl-options.json]}

resources:
  - Namespace.yaml
  - ServiceAccount.yaml
  - PersistentVolumeClaim.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - SealedSecret.oidc.yaml
  - SecurityPolicy.yaml
  - CiliumNetworkPolicy.yaml
