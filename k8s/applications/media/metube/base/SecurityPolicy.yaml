# Cross namespace attachment?
# - https://github.com/envoyproxy/gateway/issues/5143
# OIDC:
# - https://gateway.envoyproxy.io/docs/tasks/security/oidc/
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: allow-sso
  namespace: metube
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: web}
  oidc:
    clientID: envoy
    clientSecret: {namespace: metube, kind: Secret, name: oidc}
    cookieConfig: {sameSite: Lax}
    cookieDomain: metube.karlsen.app
    cookieNames: {accessToken: oidc-access-token, idToken: oidc-id-token}
    logoutPath: /authelia/logout
    provider:
      issuer: https://auth.karlsen.fr
      authorizationEndpoint: https://auth.karlsen.fr/api/oidc/authorization
      tokenEndpoint: https://auth.karlsen.fr/api/oidc/token
    redirectURL: https://metube.karlsen.app/authelia/openid_connect/callback
    forwardAccessToken: false
    refreshToken: false
    passThroughAuthHeader: false
    # resources: []
    scopes: [openid, email, profile, groups]
  jwt:
    providers:
      - name: authelia
        issuer: https://auth.karlsen.fr
        audiences: [envoy]
        remoteJWKS: {uri: https://auth.karlsen.fr/jwks.json}
        extractFrom: {cookies: [oidc-id-token]}
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-homelab-users
        action: Allow
        principal:
          jwt:
            provider: authelia
            claims:
              - {name: groups, valueType: StringArray, values: ['k8s_admins']}
---
# The Socket.IO route (HTTPRoute socket): the same session as the page, checked without the OIDC filter, whose
# redirect to Authelia a socket cannot follow. The id token cookie that allow-sso's login sets is validated here;
# without a valid one, or outside k8s_admins, 401/403 (the page logs in again on its next load). The socket pushes
# the download queue and history, and MeTube's configuration.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: allow-sso-socket
  namespace: metube
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: socket}
  jwt:
    providers:
      - name: authelia
        issuer: https://auth.karlsen.fr
        audiences: [envoy]
        remoteJWKS: {uri: https://auth.karlsen.fr/jwks.json}
        extractFrom: {cookies: [oidc-id-token]}
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-homelab-users
        action: Allow
        principal:
          jwt:
            provider: authelia
            claims:
              - {name: groups, valueType: StringArray, values: ['k8s_admins']}
  extAuth:
    failOpen: false
    grpc: {backendRefs: [{group: '', kind: Service, namespace: envoy-gateway-system, name: envoy-proxy-bouncer-karlsenapp, port: 8080}]}
