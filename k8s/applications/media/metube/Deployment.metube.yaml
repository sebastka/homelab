---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: metube
  namespace: metube
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metube
      app.kubernetes.io/version: '2026.04.26'
      app.kubernetes.io/component: server
      app.kubernetes.io/part-of: metube
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: metube
      labels:
        app.kubernetes.io/name: metube
        app.kubernetes.io/version: '2026.04.26'
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: metube
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: metube
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: init-dirs
          # Dockerfile: https://github.com/alexta69/metube/blob/master/Dockerfile
          image: ghcr.io/alexta69/metube:2026.04.28
          command: [/bin/sh, '-c']
          args:
            - |
              set -eux
              mkdir -p /mnt/persistent/downloads/audio /mnt/persistent/state /mnt/persistent/temp
              chown -R $(id -u):$(id -g) /mnt/persistent/downloads /mnt/persistent/state /mnt/persistent/temp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 24Mi}
          env:
            - {name: TZ, value: Europe/Oslo}
          volumeMounts:
            - {name: persistent-volume, mountPath: /mnt/persistent}
      containers:
        - name: metube
          # Dockerfile: https://github.com/alexta69/metube/blob/master/Dockerfile
          image: ghcr.io/alexta69/metube:2026.04.28
          command: [python3, app/main.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 768Mi}
            limits: {memory: 768Mi}
          env:
            - {name: TZ, value: Europe/Oslo}
          envFrom:
            - configMapRef: {name: metube-env}
          ports:
            - {name: http, containerPort: 8081}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: persistent-volume, mountPath: /mnt/persistent}
            - {name: ytdl-options, mountPath: /mnt/ytdl-options.json, subPath: ytdl-options.json}
      volumes:
        - {name: tmp-volume, emptyDir: {}}
        - {name: persistent-volume, persistentVolumeClaim: {claimName: metube-persistent-pvc}}
        - {name: ytdl-options, configMap: {name: ytdl-options}}
