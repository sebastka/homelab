---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: opentogethertube
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opentogethertube
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: opentogethertube
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      protocol: TCP
      port: 80
      targetPort: valkey
valkey