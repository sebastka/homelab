---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: opentogethertube
  namespace: opentogethertube
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opentogethertube
      app.kubernetes.io/version: stable
      app.kubernetes.io/component: server
      app.kubernetes.io/part-of: opentogethertube
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: opentogethertube
      labels:
        app.kubernetes.io/name: opentogethertube
        app.kubernetes.io/version: stable
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: opentogethertube
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: opentogethertube
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrate-db
          # Dockerfile: https://hub.docker.com/r/opentogethertube/opentogethertube/dockerfile
          image: index.docker.io/dyc3/opentogethertube:latest
          command: [yarn, workspace, ott-server, run, sequelize-cli, db:migrate]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 128Mi}
          envFrom:
            - configMapRef: {name: opentogethertube-env}
            - secretRef: {name: opentogethertube-secrets}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /home/node/.cache}
            - {name: config-volume, mountPath: /app/env/base.toml, subPath: base.toml, readOnly: true}
      containers:
        - name: opentogethertube
          # Dockerfile: https://hub.docker.com/r/opentogethertube/opentogethertube/dockerfile
          image: index.docker.io/dyc3/opentogethertube:latest
          command: [yarn, run, start]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 512Mi}
          envFrom:
            - configMapRef: {name: opentogethertube-env}
            - secretRef: {name: opentogethertube-secrets}
          ports:
            - {name: http, containerPort: 3000}
          startupProbe: {httpGet: {port: 3000, path: /}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {port: 3000, path: /}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {httpGet: {port: 3000, path: /}, initialDelaySeconds: 10, periodSeconds: 120}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: cache-volume, mountPath: /home/node/.cache}
            - {name: config-volume, mountPath: /app/env/base.toml, subPath: base.toml, readOnly: true}
      volumes:
        - {name: tmp-volume, emptyDir: {medium: Memory}}
        - {name: cache-volume, emptyDir: {medium: Memory}}
        - {name: config-volume, configMap: {name: opentogethertube-config}}
