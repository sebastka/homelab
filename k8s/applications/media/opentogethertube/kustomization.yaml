---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace: opentogethertube

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {namespace: opentogethertube, name: opentogethertube-env, envs: [assets/opentogethertube.env]}
  - {namespace: opentogethertube, name: opentogethertube-config, files: [base.toml=assets/base.toml]}

resources:
  - Namespace.yaml
  - SealedSecret.ott-db-credentials.yaml
  - SealedSecret.opentogethertube-secrets.yaml
  - Cluster.ott-db.yaml
  - ServiceAccount.yaml
  - Deployment.ott.yaml
  - Deployment.valkey.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
