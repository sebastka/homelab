---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opentogethertube

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {name: opentogethertube-env, envs: [assets/opentogethertube.env]}
  - {name: opentogethertube-config, files: [base.toml=assets/base.toml]}

components:
  - ../../../common/valkey

patches:
  - target: {kind: CiliumNetworkPolicy, name: allow-valkey-ingress}
    patch: |
      - {op: replace, path: /spec/ingress/0/fromEndpoints/0/matchLabels/app.kubernetes.io~1name, value: opentogethertube}
      - {op: replace, path: /spec/ingress/0/fromEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace, value: opentogethertube}

resources:
  - Namespace.yaml
  - SealedSecret.opentogethertube-secrets.yaml
  - ServiceAccount.yaml
  - Deployment.ott.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
  - CiliumNetworkPolicy.yaml
