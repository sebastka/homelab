# Netplay's datagrams (WebTransport): the default Gateway's UDP 4433 listener (texel.karlsen.app:4433), relayed as is to Texel. Envoy cannot proxy WebTransport itself; QUIC and its TLS end in Texel (Certificate.texel-tls.yaml).
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: webtransport
  namespace: texel
spec:
  parentRefs:
    - {namespace: gateway, name: default, sectionName: texel-webtransport}
  rules:
    - backendRefs: [{name: webtransport, port: 4433}]
