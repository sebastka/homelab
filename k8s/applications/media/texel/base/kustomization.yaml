---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: texel

resources:
  - Namespace.yaml
  - SealedSecret.texel.yaml  # TEXEL_DATABASE_URL (the texel user's, as in mariadb's Secret.mariadb-users.yaml), TEXEL_OIDC_CLIENT_SECRET (Authelia's client texel)
  - ServiceAccount.yaml
  - Deployment.yaml
  - Service.yaml
  - PersistentVolume.yaml
  - PersistentVolumeClaim.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml  # Opens the public route: only once Texel's own authentication is in the image
  - BackendTrafficPolicy.yaml
  - CiliumNetworkPolicy.yaml
