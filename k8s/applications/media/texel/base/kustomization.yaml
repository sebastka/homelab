---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: texel

configMapGenerator:
  - {name: texel-env, envs: [assets/texel.env]}

resources:
  - Namespace.yaml
  - SealedSecret.texel.yaml
  - ServiceAccount.yaml
  - Deployment.yaml
  - Service.yaml
  - PersistentVolume.yaml
  - PersistentVolumeClaim.yaml
  - Certificate.texel-tls.yaml
  - HTTPRoute.yaml
  - UDPRoute.yaml
  - SecurityPolicy.yaml
  - BackendTrafficPolicy.yaml
  - CiliumNetworkPolicy.yaml
