# The game library: ps1/{bios,games}, ps2/{bios,games}, on the file VM's Games share (/mnt/data_disk1/Games on its
# disk, exported under /mnt/nfs; read-only to the cluster, backed up off-site: sebastka/nixos, hosts/file). Read-only:
# Texel never writes there. A PV's source can't change: a new path means a new PV (and PVC) name.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: texel-games-pv
  labels:
    app.kubernetes.io/name: texel
spec:
  accessModes: [ReadOnlyMany]
  capacity: {storage: 1Gi}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  nfs:
    server: file.home.karlsen.fr
    path: /mnt/nfs/Games
    readOnly: true
