---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kubelet-probes-jellyfin
  namespace: jellyfin
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: jellyfin}}
  ingress:
    - {fromEntities: [host], toPorts: [ports: [{port: '8096', protocol: TCP}]]}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-jellyfin-ingress
  namespace: jellyfin
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: jellyfin}}
  ingress:
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}], toPorts: [ports: [{port: '8096', protocol: TCP}]]}
    # - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}], toPorts: [ports: [{port: '7359', protocol: TCP}]]}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-jellyfin-egress
  namespace: jellyfin
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: jellyfin}}
  egress:
    - {toEntities: [world]}  # cluster, host
