---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-pv
  namespace: jellyfin
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 1Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  nfs:
    server: file01.hera.home.karlsen.fr
    path: /homelab-k8s/deluge/downloads
    readOnly: true
