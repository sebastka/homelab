---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-httproute
  namespace: jellyfin
spec:
  parentRefs:
    - kind: Gateway
      name: internal
      namespace: gateway
      sectionName: https-wc-talmox-hera-home-karlsen-fr
  hostnames:
    - jellyfin.talmox.hera.home.karlsen.fr
  rules:
    - backendRefs:
        - name: jellyfin-service
          port: 8096
      matches:
        - path:
            type: PathPrefix
            value: /
