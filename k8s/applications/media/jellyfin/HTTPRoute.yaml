---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-httproute
  namespace: jellyfin
spec:
  parentRefs:
    - {namespace: gateway, name: internal, sectionName: https-wc-karlsen-app}
    # - {namespace: gateway, name: external, sectionName: https-wc-karlsen-app}
  hostnames:
    - jellyfin.karlsen.app
  rules:
    - backendRefs:
        - name: jellyfin-service
          port: 8096
      matches:
        - path:
            type: PathPrefix
            value: /
