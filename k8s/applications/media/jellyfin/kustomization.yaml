---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jellyfin

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {namespace: jellyfin, name: jellyfin-env, envs: [assets/jellyfin.env]}

components:
  - ../../../common/default-networkpolicy

resources:
  - Namespace.yaml
  - ServiceAccount.yaml
  - Deployment.yaml
  - Service.yaml
  - PersistentVolume.yaml
  - PersistentVolumeClaim.yaml
  - HTTPRoute.yaml
  - CiliumNetworkPolicy.yaml
