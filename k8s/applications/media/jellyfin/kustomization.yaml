---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jellyfin

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: jellyfin

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: jellyfin-env
    namespace: jellyfin
    envs:
      - assets/jellyfin.env

resources:
  - Namespace.yaml
  - ServiceAccount.yaml
  - Deployment.yaml
  - Service.yaml
  - PersistentVolume.yaml
  - PersistentVolumeClaim.yaml
  - HTTPRoute.yaml
