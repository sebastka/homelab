---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/name: jellyfin
  app: jellyfin

configMapGenerator:
  - name: jellyfin-env
    namespace: jellyfin
    literals:
      - TZ="Europe/Oslo"

resources:
  - Namespace.yaml
  - Deployment.yaml
  - Service.yaml
  - PersistentVolumeClaim.yaml
  - HTTPRoute.yaml
