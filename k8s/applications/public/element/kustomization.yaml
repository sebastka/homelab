---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: element

configMapGenerator:
  - {namespace: element, name: element-config, files: [config.json=assets/config.json]}

resources:
  - Namespace.yaml
  - ServiceAccounts.yaml
  - Deployment.yaml
  - Services.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
