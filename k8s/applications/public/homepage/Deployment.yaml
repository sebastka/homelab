# Set up redirections in html because of HTST preload requirements on headers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: homepage
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
      app.kubernetes.io/version: v1
      app.kubernetes.io/component: karlsenfr
      app.kubernetes.io/part-of: homepage
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: homepage
      labels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/version: v1
        app.kubernetes.io/component: karlsenfr
        app.kubernetes.io/part-of: homepage
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: homepage
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: git-cloner
          image: alpine/git:v2.52.0
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux

              # Clean up volumes
              for d in karlsenfr other openpgpkey mta-sts; do [ ! -d "/$d" ] || { rm -rf "/$d"/* "/$d"/.[!.]*; }; done

              # Homepage: www.karlsen.fr
              git -C /karlsenfr clone --depth 1 --branch master --single-branch https://github.com/sebastka/sebastka.github.io.git .
              rm -rf /karlsenfr/.git /karlsenfr/bin /karlsenfr/.nojekyll /karlsenfr/README.md

              # Other tlds (org|app) and karlsen.fr:
              cp -a /karlsenfr/.well-known /other/
              printf -- '<!DOCTYPE html><html lang="en"><head><title>Karlsen.fr</title><meta http-equiv="refresh" content="0; URL=https://www.karlsen.fr"></head></html>' >/other/index.html

              # WKD: openpgpkey.karlsen.fr
              mkdir -p /openpgpkey/.well-known/openpgpkey/karlsen.fr/hu/
              cp /other/index.html /openpgpkey/index.html
              cp /karlsenfr/.well-known/openpgpkey/hu/* /openpgpkey/.well-known/openpgpkey/karlsen.fr/hu/
              touch /openpgpkey/.well-known/openpgpkey/karlsen.fr/policy

              # MTA-STS:
              mkdir -p /mta-sts/.well-known
              printf -- 'version: STSv1\nmode: testing\nmx: mx.domeneshop.no\nmax_age: 86400\n' >/mta-sts/.well-known/mta-sts.txt
              cp /other/index.html /mta-sts/index.html
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 24Mi}
          volumeMounts:
            - {name: karlsenfr-volume, mountPath: /karlsenfr}
            - {name: other-volume, mountPath: /other}
            - {name: openpgpkey-volume, mountPath: /openpgpkey}
            - {name: mtasts-volume, mountPath: /mta-sts}
      containers:
        - name: nginx
          # Dockerfile: https://github.com/nginx/docker-nginx-unprivileged/blob/main/Dockerfile-alpine-slim.template
          image: nginxinc/nginx-unprivileged:1.30.0-alpine-slim
          command: [nginx]
          args: ['-c', '/etc/nginx/nginx.custom.conf', '-g', 'daemon off;']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 24Mi}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 10, periodSeconds: 120}
          volumeMounts:
            - {name: karlsenfr-volume, mountPath: /karlsenfr, readOnly: true}
            - {name: other-volume, mountPath: /other, readOnly: true}
            - {name: openpgpkey-volume, mountPath: /openpgpkey, readOnly: true}
            - {name: mtasts-volume, mountPath: /mta-sts, readOnly: true}
            - {name: nginx-config-volume, mountPath: /etc/nginx/nginx.custom.conf, subPath: 'nginx.custom.conf', readOnly: true}
            - {name: nginx-config-volume, mountPath: /etc/nginx/conf.d/sites.conf, subPath: 'sites.conf', readOnly: true}
      volumes:
        - {name: karlsenfr-volume, emptyDir: {}}
        - {name: other-volume, emptyDir: {}}
        - {name: openpgpkey-volume, emptyDir: {}}
        - {name: mtasts-volume, emptyDir: {}}
        - {name: nginx-config-volume, configMap: {name: nginx-config}}
