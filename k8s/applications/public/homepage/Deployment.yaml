# Set up redirections in html because of HTST preload requirements on headers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: homepage
  annotations:
    reloader.stakater.com/auto: "true"
    argocd.argoproj.io/sync-wave: '2'
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
      app.kubernetes.io/version: v1
      app.kubernetes.io/component: karlsenfr
      app.kubernetes.io/part-of: homepage
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: homepage
      labels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/version: v1
        app.kubernetes.io/component: karlsenfr
        app.kubernetes.io/part-of: homepage
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: homepage
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: site-setup
          image: docker.io/alpine/git:v2.52.0
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux

              # Clean up and init dirs
              rm -rf /mnt/www-data/www /mnt/www-data/other /mnt/www-data/openpgpkey /mnt/www-data/mta-sts
              mkdir -p /mnt/www-data/www /mnt/www-data/other /mnt/www-data/openpgpkey /mnt/www-data/mta-sts

              # Homepage: www.karlsen.fr
              cp -a /mnt/karlsenfr/sebastka.github.io.git/* /mnt/karlsenfr/sebastka.github.io.git/.[!.]* /mnt/www-data/www
              rm -rf /mnt/www-data/www/.git /mnt/www-data/www/bin /mnt/www-data/www/.nojekyll /mnt/www-data/www/README.md

              # Other tlds (org|app) and karlsen.fr:
              cp -a /mnt/karlsenfr/sebastka.github.io.git/.well-known /mnt/www-data/other/
              printf -- '<!DOCTYPE html><html lang="en"><head><title>Karlsen.fr</title><meta http-equiv="refresh" content="0; URL=https://www.karlsen.fr"></head></html>' >/mnt/www-data/other/index.html

              # WKD: openpgpkey.karlsen.fr
              mkdir -p /mnt/www-data/openpgpkey/.well-known/openpgpkey/karlsen.fr/hu/
              cp /mnt/www-data/other/index.html /mnt/www-data/openpgpkey/index.html
              cp /mnt/karlsenfr/sebastka.github.io.git/.well-known/openpgpkey/hu/* /mnt/www-data/openpgpkey/.well-known/openpgpkey/karlsen.fr/hu/
              touch /mnt/www-data/openpgpkey/.well-known/openpgpkey/karlsen.fr/policy

              # MTA-STS:
              mkdir -p /mnt/www-data/mta-sts/.well-known
              printf -- 'version: STSv1\nmode: testing\nmx: mx.domeneshop.no\nmax_age: 86400\n' >/mnt/www-data/mta-sts/.well-known/mta-sts.txt
              cp /mnt/www-data/other/index.html /mnt/www-data/mta-sts/index.html
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 24Mi}
          volumeMounts:
            - {name: karlsenfr-volume, mountPath: /mnt/karlsenfr, readOnly: true}
            - {name: wwwdata-volume, mountPath: /mnt/www-data}
      containers:
        - name: nginx
          # Dockerfile: https://github.com/nginx/docker-nginx-unprivileged/blob/main/Dockerfile-alpine-slim.template
          image: docker.io/nginxinc/nginx-unprivileged:1.31.0-alpine-slim
          command: [nginx]
          args: ['-c', '/etc/nginx/nginx.custom.conf', '-g', 'daemon off;']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 128Mi}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {httpGet: {port: 8080, path: /}, initialDelaySeconds: 10, periodSeconds: 120}
          volumeMounts:
            - {name: var-cache-nginx-volume, mountPath: /var/cache/nginx/client_temp, subPath: client_temp, readOnly: true}
            - {name: var-cache-nginx-volume, mountPath: /var/cache/nginx/fastcgi_temp, subPath: fastcgi_temp, readOnly: true}
            - {name: var-cache-nginx-volume, mountPath: /var/cache/nginx/proxy_temp, subPath: proxy_temp, readOnly: true}
            - {name: var-cache-nginx-volume, mountPath: /var/cache/nginx/scgi_temp, subPath: scgi_temp, readOnly: true}
            - {name: var-cache-nginx-volume, mountPath: /var/cache/nginx/uwsgi_temp, subPath: uwsgi_temp, readOnly: true}
            - {name: nginx-config-volume, mountPath: /etc/nginx/nginx.custom.conf, subPath: nginx.custom.conf, readOnly: true}
            - {name: nginx-config-volume, mountPath: /etc/nginx/conf.d/sites.conf, subPath: 'sites.conf', readOnly: true}
            - {name: wwwdata-volume, mountPath: /mnt/www-data, readOnly: true}
      volumes:
        - {name: nginx-config-volume, configMap: {name: nginx-config}}
        - {name: karlsenfr-volume, persistentVolumeClaim: {claimName: homepage-karlsenfr-pvc}}
        - {name: wwwdata-volume, emptyDir: {}}
        - {name: var-cache-nginx-volume, emptyDir: {}}
