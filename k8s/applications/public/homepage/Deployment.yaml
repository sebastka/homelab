# https://hub.docker.com/hardened-images/catalog/dhi/nginx/images/nginx%2Fdebian-13%2Fmainline/sha256-12e286038641ad2919be50aec641eb6eabfc7f68d1ad8a8991cf6b8a922b2bf2/specifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      namespace: homepage
      labels:
        app.kubernetes.io/name: homepage
        app: homepage
    spec:
      imagePullSecrets:
        - name: dhi-io-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          # cpu: 10m
          memory: 24Mi
        limits:
          # cpu: 100m
          memory: 24Mi
      initContainers:
        - name: git-cloner
          image: alpine/git:latest
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eux
              [ ! -d /tmp/sebastka ] || { rm -rf /tmp/sebastka/* /tmp/sebastka/.[!.]*; }
              git -C /tmp/sebastka clone --depth 1 --branch master --single-branch https://github.com/sebastka/sebastka.github.io.git .
              rm -rf /tmp/sebastka/.git /tmp/sebastka/.nojekyll /tmp/sebastka/README.md
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: git-volume, mountPath: /tmp/sebastka}
      containers:
        - name: nginx
          # Dockerfile: https://hub.docker.com/hardened-images/catalog/dhi/nginx/images/nginx%2Falpine-3.23%2Fmainline/sha256-838bfb5a32b0d803389b6ee72ed411c066b3b49301ecdd8e0d7469bca06c2f77/specifications
          image: dhi.io/nginx:1-alpine3.23
          command: [nginx]
          args: ['-c', '/etc/nginx/nginx.custom.conf', '-g', 'daemon off;']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: git-volume, mountPath: /sebastka, readOnly: true}
            - {name: nginx-config-volume, mountPath: /etc/nginx/nginx.custom.conf, subPath: 'nginx.custom.conf', readOnly: true}
            - {name: nginx-config-volume, mountPath: /etc/nginx/conf.d/site.conf, subPath: 'site.conf', readOnly: true}
      volumes:
        - {name: git-volume, emptyDir: {}}
        - {name: tmp-volume, emptyDir: {}}
        - {name: nginx-config-volume, configMap: {name: nginx-config}}
