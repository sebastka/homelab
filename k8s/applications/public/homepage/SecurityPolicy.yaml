# https://gateway.envoyproxy.io/docs/tasks/security/restrict-ip-access/
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: homepage-allow-all
  namespace: homepage
spec:
  targetSelectors:
    matchLabels:
      app.kubernetes.io/name: homepage-allow-all
  authorization:
    defaultAction: Allow
