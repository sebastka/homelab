# https://gateway.envoyproxy.io/docs/tasks/security/restrict-ip-access/
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: homepage-allow-all
  namespace: homepage
spec:
  targetRefs:
    - group: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      name: https-karlsen-fr
    - group: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      name: https-www-karlsen-fr

    - group: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      name: https-karlsen-org
    - group: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      name: https-www-karlsen-org

    - group: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      name: https-karlsen-app
    - group: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      name: https-www-karlsen-app
  authorization:
    defaultAction: Allow
