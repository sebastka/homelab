---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-karlsen-fr
  namespace: homepage
spec:
  parentRefs:
    - kind: Gateway
      name: external
      namespace: gateway
      sectionName: https-karlsen-fr
  hostnames:
    - karlsen.fr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: homepage
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-www-karlsen-fr
  namespace: homepage
spec:
  parentRefs:
    - kind: Gateway
      name: external
      namespace: gateway
      sectionName: https-wc-karlsen-fr
  hostnames:
    - www.karlsen.fr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: homepage
          port: 80
