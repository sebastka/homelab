---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-www-karlsen-fr
  namespace: homepage
  labels:
    httproute-allow: all
spec:
  parentRefs:
    - kind: Gateway
      name: external
      namespace: gateway
      sectionName: https-wc-karlsen-fr
  hostnames:
    - www.karlsen.fr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: homepage-service
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-karlsen-fr
  namespace: homepage
  labels:
    httproute-allow: all
spec:
  parentRefs:
    - kind: Gateway
      name: external
      namespace: gateway
      sectionName: https-karlsen-fr
  hostnames:
    - karlsen.fr
  rules:
    - filters:
      - type: RequestRedirect
        requestRedirect:
          scheme: https
          hostname: www.karlsen.fr
          statusCode: 301
