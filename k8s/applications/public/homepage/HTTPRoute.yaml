---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-karlsen-fr
  namespace: homepage
  labels:
    security-policy: httproute-allow-all
spec:
  parentRefs:
    - kind: Gateway
      name: external
      namespace: gateway
      sectionName: https-wc-karlsen-fr
    - kind: Gateway
      name: internal
      namespace: gateway
      sectionName: https-wc-karlsen-fr
  hostnames:
    - www.karlsen.fr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: homepage-service
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: other-to-www-karlsen-fr
  namespace: homepage
  labels:
    security-policy: httproute-allow-all
spec:
  parentRefs:
    - kind: Gateway
      name: external
      namespace: gateway
      sectionName: https-karlsen-fr
    - kind: Gateway
      name: external
      namespace: gateway
      sectionName: https-karlsen-org
    - kind: Gateway
      name: external
      namespace: gateway
      sectionName: https-wc-karlsen-org
    - kind: Gateway
      name: external
      namespace: gateway
      sectionName: https-karlsen-app
    - kind: Gateway
      name: external
      namespace: gateway
      sectionName: https-wc-karlsen-app

    - kind: Gateway
      name: internal
      namespace: gateway
      sectionName: https-karlsen-fr
    - kind: Gateway
      name: internal
      namespace: gateway
      sectionName: https-karlsen-org
    - kind: Gateway
      name: internal
      namespace: gateway
      sectionName: https-wc-karlsen-org
    - kind: Gateway
      name: internal
      namespace: gateway
      sectionName: https-karlsen-app
    - kind: Gateway
      name: internal
      namespace: gateway
      sectionName: https-wc-karlsen-app
  hostnames:
    - karlsen.fr
    - karlsen.org
    - www.karlsen.org
    - karlsen.app
    - www.karlsen.app
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: www.karlsen.fr
            statusCode: 301
