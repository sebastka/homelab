map $uri $cache_control {
    default                     "no-cache";
    "~\.[0-9a-f]{8}\.(css|js)$" "public, max-age=31536000, immutable";
}

# Which JRD answers for a given resource. $arg_resource is the raw query
# argument, so the percent-encoded spellings have to match too. Regexes are
# tried in order, so sebastian's identity must be listed before the catch-all.
map $arg_resource $webfinger_file {
    default                                                  "";
    "~*^acct(:|%3a)sebastian(@|%40)karlsen\.fr$"             "/.well-known/webfinger.sebastian.json";
    "~*^mailto(:|%3a)sebastian(@|%40)karlsen\.fr$"           "/.well-known/webfinger.sebastian.json";
    "~*^https(:|%3a)(//|%2f%2f)(www\.)?karlsen\.fr(/|%2f)?$" "/.well-known/webfinger.sebastian.json";
    "~*^acct(:|%3a)[a-z0-9._+-]+(@|%40)karlsen\.fr$"         "/.well-known/webfinger.default.json";
}

# The shared JRD is the same bytes for everyone, so the account it describes is
# substituted in. The capture rebuilds the decoded form: echoing $arg_resource
# would hand back "acct%3amelanie%40karlsen.fr".
map $arg_resource $webfinger_subject {
    default                                                              "";
    "~*^acct(?::|%3a)(?<wf_local>[a-z0-9._+-]+)(?:@|%40)karlsen\.fr$"    "acct:$wf_local@karlsen.fr";
}

server {
    listen 8080;
    server_name www.karlsen.fr;

    add_header Cache-Control $cache_control always;

    location ~ /(\.ht|\.git|wp)      { deny all; }
    location /                       { root /mnt/karlsenfr/www; index index.html; }
    location = /.well-known/caldav   { return 301 https://caldav.domeneshop.no/; }
    location = /.well-known/carddav  { return 301 https://carddav.domeneshop.no/; }
    location ^~ /.well-known/matrix/ { root /mnt/karlsenfr/www; default_type application/json; } # Matrix delegation is served from extensionless files
    location ^~ /avatar/             { root /mnt/karlsenfr/www; default_type image/jpeg; }       # Libravatar hashes are extensionless

    location = /.well-known/webfinger {
        if ($arg_resource = "") {
            return 400 "Bad Request: missing resource parameter";
        }

        # Echoing $arg_resource back would claim authority over any subject,
        # and would return it percent-encoded; serve the real document instead.
        if ($webfinger_file = "") {
            return 404;
        }

        root /mnt/karlsenfr/www;
        types { application/jrd+json json; }   # .json would otherwise be application/json
        default_type application/jrd+json;

        # webfinger.sebastian.json carries no placeholder, so this is a no-op there
        sub_filter_types application/jrd+json;
        sub_filter_once on;
        sub_filter '__RESOURCE__' '$webfinger_subject';
        try_files $webfinger_file =404;
    }

    error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        root /usr/share/nginx/html;
    }
}

