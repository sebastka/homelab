server {
    listen 8080;
    server_name www.karlsen.fr;

    location ~ /(\.ht|\.git|wp) {
        deny  all;
    }

    location / {
        root   /mnt/karlsenfr/www;
        index  index.html;
    }

    location = /.well-known/webfinger {
        if ($arg_resource = "") {
            return 400 "Bad Request: missing resource parameter";
        }

        add_header Content-Type "application/jrd+json";
        # add_header Access-Control-Allow-Origin "*";
        return 200 '{"subject":"$arg_resource","links":[{"rel":"http://openid.net/specs/connect/1.0/issuer","href":"https://auth.karlsen.fr"}]}';
    }

    error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

