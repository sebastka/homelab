---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-default-site
  namespace: homepage
data:
  'default.conf': |-
    server {
      listen 8080;
      server_name www.karlsen.fr;

      # access_log /var/log/nginx/host.access.log main;
      # error_log /var/log/nginx/host.error.log warn;

      location ~ /\.(ht|git|wp) {
        deny  all;
      }

      location / {
          root   /tmp/sebastka;
          index  index.html;
      }

      error_page   500 502 503 504  /50x.html;
      location = /50x.html {
          root   /usr/share/nginx/html;
      }
    }

    server {
      listen 8080;
      server_name karlsen.fr karlsen.org www.karlsen.org karlsen.app www.karlsen.app;
      return 404;
    }
