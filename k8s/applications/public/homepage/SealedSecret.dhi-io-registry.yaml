# Ksops:
# - Encrypt: sops -e Secret.dhi-io-registry.yaml > Secret.dhi-io-registry.enc.yaml
# - Decrypt: sops -d Secret.dhi-io-registry.enc.yaml > Secret.dhi-io-registry.yaml
# Sealed Secrets:
# - kubeseal --controller-namespace sealed-secrets -o yaml -f Secret.dhi-io-registry.yaml > SealedSecret.dhi-io-registry.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dhi-io-registry
  namespace: homepage
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      annotations:
        kustomize.config.k8s.io/behavior: replace
      name: dhi-io-registry
      namespace: homepage
    type: kubernetes.io/dockerconfigjson
