---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: homepage
      app: homepage

generators:
  - ksops.dhi-io-registry-secret-generator.yaml

resources:
  - Namespace.yaml
  - Secret.dhi-io-registry.enc.yaml
  - ConfigMap.nginx-default-site.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
  # - SecurityPolicy.yaml
