---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {name: nginx-config, files: [nginx.custom.conf=assets/nginx.custom.conf, sites.conf=assets/sites.conf]}

resources:
  - Namespace.yaml
  - ServiceAccount.yaml
  - PersistentVolumeClaim.yaml
  - Job.karlsenfr-sync.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
  - CiliumNetworkPolicy.website.yaml
  - CiliumNetworkPolicy.karlsenfr-sync.yaml
