# Machine-read discovery endpoints, deliberately outside the CrowdSec bouncer.
#
# MTA-STS policies, WKD keys and mail autoconfig are static public documents
# fetched by sending MTAs, mail clients and OpenPGP tooling -- never by a
# person with a browser. Behind the bouncer on the karlsen-fr route they are
# unreadable from any address CrowdSec holds a decision on, and a captcha
# would answer with a redirect, which RFC 8461 s3.3 forbids a policy fetch
# from following. The sender then falls back to "no policy", so MTA-STS
# silently stops protecting exactly the senders CrowdSec distrusts.
#
# These hostnames must therefore stay allow-all. Nothing sensitive is served
# here: the same three documents are public by design.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: discovery
  namespace: homepage
spec:
  parentRefs:
    - {namespace: gateway, name: default, sectionName: https-wc-karlsen-fr}
    - {namespace: gateway, name: default, sectionName: https-wc-karlsen-org}
  hostnames:
    - autoconfig.karlsen.fr  # Thunderbird, /mail/config-v1.1.xml
    - openpgpkey.karlsen.fr  # WKD, /.well-known/openpgpkey/...
    - mta-sts.karlsen.fr     # MTA-STS, /.well-known/mta-sts.txt
    - mta-sts.karlsen.org
  rules:
    - matches: [path: {type: PathPrefix, value: /}]
      backendRefs: [{name: web, kind: Service, port: 80}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - {name: Content-Security-Policy, value: default-src 'none';}
              - &HSTS {name: Strict-Transport-Security, value: 'max-age=31536000; includeSubDomains; preload'}
              - &XCTO {name: X-Content-Type-Options, value: nosniff}
              - &XFO {name: X-Frame-Options, value: DENY}
              - &CORP {name: Cross-Origin-Resource-Policy, value: same-origin}
              - &RP {name: Referrer-Policy, value: no-referrer}
              - &PP {name: Permissions-Policy, value: 'accelerometer=(), autoplay=(), camera=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()'}

    # WKD is read cross-origin by webmail clients, so this path keeps the
    # permissive CORS header the karlsen-fr route already gave it.
    - matches: [path: {type: PathPrefix, value: /.well-known}]
      backendRefs: [{name: web, kind: Service, port: 80}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - {name: Access-Control-Allow-Origin, value: '*'}
              - {name: Content-Security-Policy, value: default-src 'none';}
              - *HSTS
              - *XCTO
              - *XFO
              - {name: Cross-Origin-Resource-Policy, value: cross-origin}
              - *RP
              - *PP
