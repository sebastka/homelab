---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  namespace: coturn
data:
  'turnserver.conf': |-
    # https://github.com/coturn/coturn/blob/master/examples/etc/turnserver.conf
    # https://manpages.debian.org/testing/coturn/turnserver.1.en.html

    listening-port=3478
    tls-listening-port=5349
    alt-listening-port=3479
    alt-tls-listening-port=5350
    min-port=49160
    max-port=49200

    verbose
    fingerprint
    lt-cred-mech
    realm=turn.karlsen.fr
    server-name=turn.karlsen.fr
    log-file=stdout
    pidfile=/tmp/turnserver.pid

    web-admin
    web-admin-ip=0.0.0.0
    web-admin-port=8080
