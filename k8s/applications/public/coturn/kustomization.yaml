---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: coturn
      app: coturn

resources:
  - Namespace.yaml
  - ConfigMap.coturn-config.yaml
  - SealedSecret.coturn-cert.yaml
  - Deployment.yaml
  - Service.http.yaml
  - HTTPRoute.yaml
