---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: adibou2
spec:
  parentRefs:
    - {namespace: gateway, name: default, sectionName: https-wc-karlsen-app}
  hostnames: [adibou2.karlsen.app]
  rules:
    - matches: [path: {type: PathPrefix, value: /}]
      backendRefs: [{name: web, kind: Service, port: 80}]
      # The app sets its own security headers (Hono secureHeaders: CSP, COOP same-origin and COEP require-corp,
      # which its shared memory needs, CORP, Referrer-Policy, X-Frame-Options, Permissions-Policy): none added here,
      # they would be sent twice. Only HSTS is set, to the other routes' value.
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Strict-Transport-Security, value: 'max-age=31536000; includeSubDomains; preload'}
