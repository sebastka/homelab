# https://github.com/element-hq/synapse/tree/develop/docker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: synapse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse
  template:
    metadata:
      namespace: synapse
      labels:
        app.kubernetes.io/name: synapse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: synapse
          # Dockerfile: https://github.com/element-hq/synapse/blob/develop/docker/Dockerfile
          image: index.docker.io/matrixdotorg/synapse:v1.148.0
          # command: [/start.py]
          args:
            - run
            - --config-path=/config/homeserver.yaml
            - --config-path=/config/secrets.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
          ports:
            - {name: http, containerPort: 18080}
            # - {name: metrics, containerPort: 19090}
          envFrom:
            - configMapRef: {name: common-env}
            - configMapRef: {name: run-env}
            # - configMapRef: {name: generate-env}
          volumeMounts:
            - {name: tmp-volume, mountPath: /tmp}
            - {name: log-volume, mountPath: /var/log}
            - {name: data-volume, mountPath: /data}
            - {name: synapse-config-volume, mountPath: /start.py, subPath: start.py, readOnly: true}
            - {name: synapse-config-volume, mountPath: /karlsen.fr.log.config, subPath: karlsen.fr.log.config, readOnly: true}
            - {name: synapse-config-volume, mountPath: /config/homeserver.yaml, subPath: homeserver.yaml, readOnly: true}
            - {name: synapse-secrets-volume, mountPath: /config/secrets.yaml, subPath: secrets.yaml, readOnly: true}
            - {name: synapse-secrets-volume, mountPath: /karlsen.fr.signing.key, subPath: karlsen.fr.signing.key, readOnly: true}
      volumes:
        - {name: tmp-volume, emptyDir: {}}
        - {name: log-volume, emptyDir: {}}
        - {name: data-volume, persistentVolumeClaim: {claimName: synapse-data-pvc}}
        - {name: synapse-config-volume, configMap: {name: synapse-config}}
        - {name: synapse-secrets-volume, secret: {secretName: synapse-secrets}}
