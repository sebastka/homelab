# https://github.com/element-hq/synapse/tree/develop/docker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: synapse
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse
      app.kubernetes.io/version: '1.151.0'
      app.kubernetes.io/component: matrix-server
      app.kubernetes.io/part-of: synapse
      # app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      namespace: synapse
      labels:
        app.kubernetes.io/name: synapse
        app.kubernetes.io/version: '1.151.0'
        app.kubernetes.io/component: matrix-server
        app.kubernetes.io/part-of: synapse
        # app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: synapse
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      hostAliases: [{ip: 192.168.0.3, hostnames: [auth.karlsen.fr, mas.karlsen.fr]}]
      initContainers:
        - name: config-merger
          image: mikefarah/yq:4.53.2
          command: ['/bin/sh', '-c']
          args:
            - |
              set -eu
              rm -f /generated-config/homeserver.yaml
              yq eval '
                .database.args.password = strenv(DATABASE_ARGS_PASSWORD) |
                .registration_shared_secret = strenv(REGISTRATION_SHARED_SECRET) |
                .macaroon_secret_key = strenv(MACAROON_SECRET_KEY) |
                .form_secret = strenv(FORM_SECRET) |
                .email.smtp_user = strenv(EMAIL_SMTP_USER) |
                .email.smtp_pass = strenv(EMAIL_SMTP_PASS)' \
                /mnt/homeserver.yaml >/generated-config/homeserver.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 24Mi}
            limits: {memory: 24Mi}
          envFrom:
            - secretRef: {name: synapse-secrets}
          volumeMounts:
            - {name: generated-config-volume, mountPath: /generated-config}
            - {name: synapse-config-volume, mountPath: /mnt/homeserver.yaml, subPath: homeserver.yaml, readOnly: true}
      containers:
        - name: synapse
          # Dockerfile: https://github.com/element-hq/synapse/blob/develop/docker/Dockerfile
          image: matrixdotorg/synapse:v1.151.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 256Mi}
          ports:
            - {name: http, containerPort: 18080}
            # - {name: metrics, containerPort: 19090}
          envFrom:
            - configMapRef: {name: common-env}
            - configMapRef: {name: run-env}
            # - configMapRef: {name: generate-env}
          volumeMounts:
            - {name: data-volume, mountPath: /data, subPath: synapse-data}
            - {name: tmp-volume, mountPath: /tmp}
            - {name: log-volume, mountPath: /var/log}
            - {name: generated-config-volume, mountPath: /generated-config, readOnly: true}
            - {name: synapse-config-volume, mountPath: /karlsen.fr.log.config, subPath: karlsen.fr.log.config, readOnly: true}
            - {name: synapse-secrets-volume, mountPath: /karlsen.fr.signing.key, subPath: karlsen.fr.signing.key, readOnly: true}
            - {name: synapse-secrets-volume, mountPath: /secrets/mas-shared.key, subPath: mas-shared.key, readOnly: true}
      volumes:
        - {name: data-volume, persistentVolumeClaim: {claimName: synapse-data-pvc}}
        - {name: tmp-volume, emptyDir: {}}
        - {name: log-volume, emptyDir: {}}
        - {name: generated-config-volume, emptyDir: {}}
        - {name: synapse-config-volume, configMap: {name: synapse-config}}
        - {name: synapse-secrets-volume, secret: {secretName: synapse-secrets}}
