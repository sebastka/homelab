---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: synapse
spec:
  parentRefs:
    - {namespace: gateway, name: default, sectionName: https-wc-karlsen-fr}
  hostnames: [matrix.karlsen.fr]
  rules:
    - matches: [path: {type: PathPrefix, value: /}]
      backendRefs: [{name: web, kind: Service, port: 80}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            # remove: [Content-Security-Policy, Access-Control-Allow-Origin]  # Synapse sets "content-security-policy: frame-ancestors 'none'"
            add:
              # - {name: Access-Control-Allow-Origin, value: '*'}
              # - {name: Content-Security-Policy, value: "default-src 'none'; style-src-elem 'sha256-5nmABY0n6AHY5A6W8TKSGqMCp6RVWXwjYd7/FoevaVY='; img-src 'self'; frame-ancestors 'none'; form-action 'none'; base-uri 'none';"}
              - {name: Strict-Transport-Security, value: 'max-age=31536000; includeSubDomains; preload'}
              - {name: X-Content-Type-Options, value: nosniff}
              # - {name: X-Frame-Options, value: DENY}  # Already set in application
              # - {name: Cross-Origin-Resource-Policy, value: cross-origin} # Already set in application
              - {name: Cross-Origin-Embedder-Policy, value: require-corp}
              - {name: Cross-Origin-Opener-Policy, value: same-origin}
              - {name: Referrer-Policy, value: no-referrer}
              - {name: Permissions-Policy, value: 'accelerometer=(), autoplay=(), camera=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()'}
              # - {name: Integrity-Policy, value: 'blocked-destinations=(script style),sources=(inline)'}
              # - {name: Reporting-Endpoints, value: ''}
