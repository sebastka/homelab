---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: synapse

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - {name: common-env, envs: [assets/common.env]}
  - {name: run-env, envs: [assets/run.env]}
  # - {name: generate-env, envs: [assets/generate.env]}
  - name: synapse-config
    files:
      - homeserver.yaml=assets/homeserver.yaml
      - karlsen.fr.log.config=assets/karlsen.fr.log.config

components:
  - ../../../common/default-networkpolicy

resources:
  - Namespace.yaml
  - SealedSecret.synapse-secrets.yaml
  - PersistentVolumeClaim.yaml
  - ServiceAccount.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
  - SecurityPolicy.yaml
  - BackendTrafficPolicy.yaml
  - CiliumNetworkPolicy.yaml
