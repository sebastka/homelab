# https://hub.docker.com/hardened-images/catalog/dhi/nginx/images/nginx%2Fdebian-13%2Fmainline/sha256-12e286038641ad2919be50aec641eb6eabfc7f68d1ad8a8991cf6b8a922b2bf2/specifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      namespace: glance
      labels:
        app.kubernetes.io/name: glance
        app: glance
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: glance
          # Dockerfile: https://github.com/glanceapp/glance/blob/main/Dockerfile
          image: docker.io/glanceapp/glance:latest
          command: [/app/glance]
          args: ['--config', '/glance.yaml']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              # cpu: 10m
              memory: 64Mi
            limits:
              # cpu: 100m
              memory: 64Mi
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - {name: glance-config-volume, mountPath: /glance.yaml, subPath: 'glance.yaml', readOnly: true}
      volumes:
        - {name: glance-config-volume, configMap: {name: glance-config}}
