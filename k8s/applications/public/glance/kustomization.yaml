---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: glance

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: glance

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: glance-config
    namespace: glance
    files:
      - glance.yaml=assets/glance.yaml

resources:
  - Namespace.yaml
  - Deployment.yaml
  - Service.yaml
  - HTTPRoute.yaml
