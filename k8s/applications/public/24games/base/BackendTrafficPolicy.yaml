# Replaces the default gateway's default-backend-traffic-policy for this route (no mergeType), per client IP:
# - its usual 300 requests a minute
# - and 10 score submissions a minute (POST /api/scores/<game>/<table>): the shared Hall of Fame is public. The
#   app adds its own limit per table across all clients (SCORES_PER_MINUTE, 30).
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: rate-limit
  namespace: 24games
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: web}
  rateLimit:
    global:
      rules:
        - {clientSelectors: [{sourceCIDR: {type: Distinct, value: 0.0.0.0/0}}],                                                                       limit: {requests: 300, unit: Minute}}
        - {clientSelectors: [{sourceCIDR: {type: Distinct, value: 0.0.0.0/0}, methods: [{value: POST}], path: {type: PathPrefix, value: /api/scores/}}], limit: {requests: 10, unit: Minute}}
