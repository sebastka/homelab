---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-24games
  namespace: 24games
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: 24games}}
  ingress:
    - {fromEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: envoy-gateway-system}], toPorts: [ports: [{port: '8080', protocol: TCP}]]}  # Envoy Gateway
  egress:
    - {toEndpoints: [matchLabels: {k8s:io.kubernetes.pod.namespace: mariadb, app.kubernetes.io/name: mariadb, app.kubernetes.io/component: server}], toPorts: [ports: [{port: '3306', protocol: TCP}]]}
