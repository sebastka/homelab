---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: public
  namespace: argocd
spec:
  sourceRepos: [https://github.com/sebastka/homelab.git]
  destinations:
    - {namespace: default,   name: talmox}
    - {namespace: argocd,    name: talmox}
    - {namespace: homepage,  name: talmox}
    - {namespace: element,   name: talmox}
    # - {namespace: slink,     name: talmox}
    - {namespace: synapse,   name: talmox}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
