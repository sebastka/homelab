---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: public
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/sebastka/homelab.git
  destinations:
    - namespace: argocd
      server: '*'
    - namespace: cnpg-database
      server: '*'
    - namespace: homepage
      server: '*'
    - namespace: synapse
      server: '*'
    - namespace: slink
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
